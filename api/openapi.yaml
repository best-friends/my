# SPDX-License-Identifier: AGPL-3.0-only
#
# The client API (ADR-0007, ADR-0016). This file is the source of truth: `make generate` generates
# the Go server interface in internal/interface/clientapi from it, and `make api-lint` enforces the
# OpenAPI 3.1 subset that the generators support (ADR-0029). docs/architecture/client-api.md
# explains how to add an endpoint.
openapi: 3.1.0
info:
  title: my client API
  version: 0.1.0
  description: |
    The client API of my, an ActivityPub microblog server. It is not compatible with the
    Mastodon client API.

    - Every error is an RFC 9457 problem document (`application/problem+json`) whose `title`
      and `detail` are localized from `Accept-Language`. Clients branch on `type` and `status`,
      never on the text.
    - Requests authenticate with an OAuth 2.0 access token in `Authorization: Bearer`, never
      with cookies. Each operation lists the scopes it needs under `security`; a broad scope
      (`read`, `write`, `follow`, `admin`) grants the fine-grained scopes under it. A missing or
      invalid token is a 401 with `WWW-Authenticate`, a token without the scope a 403
      `insufficient_scope`.
    - Every response carries the `RateLimit` and `RateLimit-Policy` fields
      (draft-ietf-httpapi-ratelimit-headers): anonymous requests share a limit per client IP,
      authenticated requests one per account. Past the limit the answer is 429 with
      `Retry-After`.
    - IDs are UUIDv7 strings. Collections use keyset pagination: pass the `next_cursor` of a
      page as `cursor` to get the next page.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - oauth2: []
tags:
  - name: instance
    description: Public information about the instance.
  - name: accounts
    description: Accounts and the authenticated user's own account.
  - name: media
    description: Media files that the user uploads to attach to posts.
  - name: preferences
    description: The authenticated user's preferences.
  - name: moderation
    description: The moderation actions on the authenticated user's own account.
  - name: notifications
    description: The authenticated user's notifications, their read marker, and dismissals.
  - name: statuses
    description: Posts, their threads and edit history, and boosts, favourites, bookmarks, and pins of them.
  - name: timelines
    description: The home, local, hashtag, and account timelines.
  - name: reports
    description: Reports of accounts and posts to the moderators.
  - name: streaming
    description: Real-time updates of the home timeline and the notifications.
  - name: admin
    description: |
      Instance administration. The operations need an `admin` scope and a permission of the
      user's roles; a user without it gets a 403 `/api/v1/problems/missing-permission`.
paths:
  /instance:
    get:
      operationId: getInstance
      summary: Get the public information of the instance
      tags: [instance]
      security: []
      responses:
        "200":
          description: |
            The instance. Its texts are in the locale of the request (the user's locale,
            then `Accept-Language`, then the instance's default locale), falling back along
            the locale chain to the instance's default locale. Like every response of the
            API, it varies with `Accept-Language`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
  # --- instance: public domain actions (#347) ---
  /instance/domain_actions:
    get:
      operationId: listInstanceDomainActions
      summary: List the domains that the instance moderates
      description: |
        The moderation actions in effect on remote domains that the instance lists publicly
        (FR-718): `limit` and `suspend`, one item per action, newest first. The instance
        setting `domain_actions_visibility` decides who may read it: `none` makes it a 404,
        `users` a 401 `/api/v1/problems/unauthenticated` for a request without an access
        token, and `all` serves everyone. The setting `domain_actions_rationale_visibility`
        decides, in the same way, who gets each action's public comment. The moderators'
        private notes are never listed.
      tags: [instance]
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of domain actions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDomainActionPage"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of instance: public domain actions (#347) ---
  /accounts/verify_credentials:
    get:
      operationId: verifyAccountCredentials
      summary: Get the authenticated user's own account
      tags: [accounts]
      security:
        - oauth2: ["read:accounts"]
      responses:
        "200":
          description: The account that the access token acts as, with the source of its profile.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAccount"
        default:
          $ref: "#/components/responses/Problem"
  # --- The user's own profile and preferences (#113) ---
  /accounts/update_credentials:
    patch:
      operationId: updateAccountCredentials
      summary: Change the authenticated user's profile
      description: |
        Records a new revision of the profile. Properties left out of the request keep their
        current values. The note and the field values are plain text that the server renders
        to HTML like the text of a post (mentions, hashtags, and URLs become links). A 422
        problem names the property that is invalid in `detail`.
      tags: [accounts]
      security:
        - oauth2: ["write:accounts"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCredentialsRequest"
      responses:
        "200":
          description: The account with its new profile.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialAccount"
        default:
          $ref: "#/components/responses/Problem"
  /preferences:
    get:
      operationId: getPreferences
      summary: Get the authenticated user's preferences
      tags: [preferences]
      security:
        - oauth2: ["read:accounts"]
      responses:
        "200":
          description: The preferences.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePreferences
      summary: Change the authenticated user's preferences
      description: |
        Properties left out of the request keep their current values. Language tags are
        canonicalized (`ja-jp` becomes `ja-JP`). A 422 problem names the property that is
        invalid in `detail`.
      tags: [preferences]
      security:
        - oauth2: ["write:accounts"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: The preferences after the change.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"
  # --- end profile and preferences ---
  # --- Accounts and relationships (#108): accounts, follows, follow requests, blocks, mutes ---
  /accounts/lookup:
    get:
      operationId: lookupAccount
      summary: Look up or resolve an account by its handle or URL
      description: |
        Finds `username` (a local account), `username@domain`, or the `https` URL of an actor
        (its `uri`, or a profile page that serves the actor) among the accounts that the instance
        knows. A leading `@` of a handle is ignored. An account that blocks the viewer, is
        deactivated, or is deleted is a 404, the same as an unknown one.

        With `resolve=true`, a remote account that the instance does not know yet is fetched
        from its server (FR-305): a handle through WebFinger, a URL directly. Only accounts
        whose handle WebFinger confirms are returned; a handle or URL that does not lead to one
        is a 404. Resolving needs an access token (anonymous requests get the 401 of
        `/api/v1/problems/unauthenticated`) and is limited to 30 fetches per account every
        5 minutes (429 with `Retry-After`); finding a known account is not limited.
      tags: [accounts]
      security:
        - {}
        - oauth2: ["read:accounts"]
      parameters:
        - name: acct
          in: query
          required: true
          description: The handle, `username` or `username@domain`, or the `https` URL of an actor.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: resolve
          in: query
          required: false
          description: Fetch a remote account that the instance does not know yet.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/AccountProfile"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/relationships:
    get:
      operationId: getRelationships
      summary: Get the viewer's relationships with accounts
      description: |
        Returns one relationship per requested account, in the order of the request. Accounts
        that do not exist, are not active, or block the viewer are left out.
      tags: [accounts]
      security:
        - oauth2: ["read:follows"]
      parameters:
        - name: id
          in: query
          required: true
          description: The account IDs, repeated (`?id=a&id=b`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 40
            items:
              $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The relationships.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account
      description: |
        An account that blocks the viewer, is deactivated, or is deleted is a 404, the same as
        an unknown one.
      tags: [accounts]
      security:
        - {}
        - oauth2: ["read:accounts"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/AccountProfile"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/block:
    post:
      operationId: blockAccount
      summary: Block an account
      description: |
        Ends the follows between the viewer and the account in both directions and keeps
        either from following the other until the block is lifted (FR-303). Blocking an
        account that the viewer already blocks changes nothing. Blocking a remote account
        also sends a Block to its server.
      tags: [accounts]
      security:
        - oauth2: ["write:blocks"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/follow:
    post:
      operationId: followAccount
      summary: Follow an account
      description: |
        Follows the account at once, or sends a follow request when the account is locked:
        then `requested` is true until the account accepts it (FR-301, FR-302). Following an
        account that the viewer already follows or has requested to follow changes only the
        preferences in the body. Following an account that the viewer blocks is a 409
        `/api/v1/problems/blocking`. A follow of an account on another server is a request
        until that server accepts it.
      tags: [accounts]
      security:
        - oauth2: ["write:follows"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/followers:
    get:
      operationId: listAccountFollowers
      summary: List the followers of an account
      description: |
        The accounts that actively follow the account, newest follow first. Followers that
        block the viewer, are deactivated, or are deleted are left out, so a page may hold
        fewer than `limit` accounts before the last.
      tags: [accounts]
      security:
        - {}
        - oauth2: ["read:accounts"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AccountPage"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/following:
    get:
      operationId: listAccountFollowing
      summary: List the accounts that an account follows
      description: |
        The accounts that the account actively follows, newest follow first, leaving out the
        same accounts as `listAccountFollowers`.
      tags: [accounts]
      security:
        - {}
        - oauth2: ["read:accounts"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AccountPage"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/mute:
    post:
      operationId: muteAccount
      summary: Mute an account
      description: |
        Hides the account's posts, and unless `notifications` is false its notifications,
        from the viewer (FR-303). Muting an account that the viewer already mutes replaces the
        settings and the expiry.
      tags: [accounts]
      security:
        - oauth2: ["write:mutes"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/remove_from_followers:
    post:
      operationId: removeAccountFromFollowers
      summary: Remove an account from the viewer's followers
      description: |
        Ends the account's active follow of the viewer. Without one it changes nothing; a
        pending request is declined with `rejectFollowRequest` instead.
      tags: [accounts]
      security:
        - oauth2: ["write:follows"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unblock:
    post:
      operationId: unblockAccount
      summary: Unblock an account
      description: The follows that the block ended stay ended. Without a block it changes nothing.
      tags: [accounts]
      security:
        - oauth2: ["write:blocks"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unfollow:
    post:
      operationId: unfollowAccount
      summary: Unfollow an account
      description: Ends the follow or withdraws the follow request. Without one it changes nothing.
      tags: [accounts]
      security:
        - oauth2: ["write:follows"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}/unmute:
    post:
      operationId: unmuteAccount
      summary: Unmute an account
      description: Without a mute it changes nothing.
      tags: [accounts]
      security:
        - oauth2: ["write:mutes"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /blocks:
    get:
      operationId: listBlocks
      summary: List the accounts that the viewer blocks
      description: Newest block first. Deactivated and deleted accounts are left out.
      tags: [accounts]
      security:
        - oauth2: ["read:blocks"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AccountPage"
        default:
          $ref: "#/components/responses/Problem"
  /follow_requests:
    get:
      operationId: listFollowRequests
      summary: List the follow requests to the viewer
      description: |
        The accounts whose follow requests await the viewer's approval, newest first.
        Deactivated and deleted accounts are left out.
      tags: [accounts]
      security:
        - oauth2: ["read:follows"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AccountPage"
        default:
          $ref: "#/components/responses/Problem"
  /follow_requests/{id}/authorize:
    post:
      operationId: acceptFollowRequest
      summary: Accept a follow request
      description: |
        Makes the account's pending follow of the viewer active (FR-302). Accepting a follow
        that is already active changes nothing; without a follow it is a 404.
      tags: [accounts]
      security:
        - oauth2: ["write:follows"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /follow_requests/{id}/reject:
    post:
      operationId: rejectFollowRequest
      summary: Reject a follow request
      description: Declines the account's pending follow request (FR-302); without one it is a 404.
      tags: [accounts]
      security:
        - oauth2: ["write:follows"]
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/Relationship"
        default:
          $ref: "#/components/responses/Problem"
  /mutes:
    get:
      operationId: listMutes
      summary: List the accounts that the viewer mutes
      description: |
        Mutes that have not expired, newest first. Deactivated and deleted accounts are left
        out.
      tags: [accounts]
      security:
        - oauth2: ["read:mutes"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of mutes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutePage"
        default:
          $ref: "#/components/responses/Problem"
  # --- End of accounts and relationships (#108) ---
  # --- media (#112) ---------------------------------------------------------------------
  /media:
    post:
      operationId: uploadMedia
      summary: Upload a media file
      description: |
        Uploads an image to attach to a post. The server checks the format from the content
        (JPEG, PNG, GIF, or WebP; the declared type must match it) and the size and dimension
        limits before it accepts the file, then processes it in the background: it removes the
        metadata (such as the location) by re-encoding the image, and makes a thumbnail and a
        blurhash. The answer is 202 with the file in its current `state`, usually `processing`;
        poll `getMedia` until it is `ready` or `failed`.

        A body larger than the size limit is refused with a 413 before it is read. Uploads
        count against a limit per account besides the API-wide one. Only the uploader can
        read and change the file.
      tags: [media]
      security:
        - oauth2: ["write:media"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "202":
          description: The file is accepted and being processed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"
        default:
          $ref: "#/components/responses/Problem"
  /media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The ID of the media file.
        schema:
          $ref: "#/components/schemas/Id"
    get:
      operationId: getMedia
      summary: Get a media file that the user uploaded
      description: |
        Returns a media file of the authenticated user with its processing state. A file of
        another account is a 404: other accounts see a file only as an attachment of a post.
      tags: [media]
      security:
        - oauth2: ["write:media"]
      responses:
        "200":
          description: The media file.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMedia
      summary: Change the description or focal point of a media file
      description: |
        Changes the description (alternative text) or the focal point of a media file of the
        authenticated user that no post attaches yet; a property left out keeps its value. A
        post copies the description when it attaches the file, so a file that a post attaches
        is a 409 `media-attached`: edit the post instead. A file of another account is a 404.
      tags: [media]
      security:
        - oauth2: ["write:media"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdate"
      responses:
        "200":
          description: The changed media file.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of media ------------------------------------------------------------------------
  # --- moderation: the user's own actions (#336) ---
  /moderation/actions:
    get:
      operationId: listOwnModerationActions
      summary: List the moderation actions on the authenticated user's account
      description: |
        The actions that moderators took on the user's own account (FR-715), newest first,
        lifted and expired ones included unless `active` is set, also those that the user was
        not notified of. Each carries what the moderators chose to tell the user; never their
        private note, the report the action follows from, or who filed it. `kind_label` and
        `reason_category_label` are in the user's language.
      tags: [moderation]
      security:
        - oauth2: ["read:accounts"]
      parameters:
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the actions on the user's account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationActionPage"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of moderation: the user's own actions (#336) ---
  # --- notifications (#111) ---
  /notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated user's notifications
      description: |
        The user's notifications, newest first. Dismissed notifications, notifications about
        deleted posts, and notifications from accounts that the user blocks, is blocked by, or
        mutes with notifications hidden are left out, also those that came before the block or
        mute. The moderator notifications (`admin_report`, `admin_sign_up`) are left out once
        the user's roles no longer grant the permission they need.
      tags: [notifications]
      security:
        - oauth2: ["read:notifications"]
      parameters:
        - name: types
          in: query
          description: Keep only notifications of these types; omitted keeps every type.
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 11
            items:
              $ref: "#/components/schemas/NotificationType"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of notifications.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/marker:
    get:
      operationId: getNotificationMarker
      summary: Get the read marker and the unread count
      tags: [notifications]
      security:
        - oauth2: ["read:notifications"]
      responses:
        "200":
          description: The read marker.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMarker"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateNotificationMarker
      summary: Mark notifications read
      description: |
        Marks the notifications up to and including `last_read_id` as read. The marker only
        moves forward: a `last_read_id` older than the current marker changes nothing, so
        clients that report their positions concurrently never move it back. A
        `last_read_id` that is not one of the user's notifications is a 404.
      tags: [notifications]
      security:
        - oauth2: ["write:notifications"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationMarkerUpdate"
      responses:
        "200":
          description: The read marker after the update.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMarker"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/{id}/dismiss:
    post:
      operationId: dismissNotification
      summary: Dismiss a notification
      description: |
        Removes the notification from the list and the unread count. Dismissing it again
        changes nothing; a notification that is not the user's is a 404.
      tags: [notifications]
      security:
        - oauth2: ["write:notifications"]
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification.
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: The notification is dismissed.
        default:
          $ref: "#/components/responses/Problem"
  # --- end notifications ---
  # --- statuses (#109) ---------------------------------------------------------------------
  /bookmarks:
    get:
      operationId: listBookmarks
      summary: List the posts the authenticated user bookmarked, newest bookmark first
      tags: [statuses]
      security:
        - oauth2: ["read:bookmarks"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: |
            A page of bookmarked posts. Posts that the user can no longer see are left out, so
            a page may hold fewer posts than `limit` and still have a `next_cursor`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  /statuses:
    post:
      operationId: createStatus
      summary: Post a status
      description: |
        Posts a status as the authenticated user. Retrying with the same `Idempotency-Key`
        returns the status posted with it. Attached media must be the user's own uploads that
        finished processing (422 otherwise).
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusRequest"
      responses:
        "200":
          description: The posted status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    get:
      operationId: getStatus
      summary: Get a status
      description: A status that the viewer may not see is a 404, the same as a missing one.
      tags: [statuses]
      security:
        - {}
        - oauth2: ["read:statuses"]
      responses:
        "200":
          description: The status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: editStatus
      summary: Edit the authenticated user's status
      description: |
        Replaces the text, content warning, sensitivity, language, and media of a status; the
        previous content stays in the edit history. The visibility and reply target never
        change. Attached media must be the user's own uploads that finished processing (422
        otherwise).
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditStatusRequest"
      responses:
        "200":
          description: The edited status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteStatus
      summary: Delete the authenticated user's status
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      responses:
        "204":
          description: The status is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/bookmark:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    post:
      operationId: bookmarkStatus
      summary: Bookmark a status
      description: Bookmarking a status that is already bookmarked changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:bookmarks"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unbookmarkStatus
      summary: Remove the bookmark of a status
      description: Without a bookmark it changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:bookmarks"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/boost:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    post:
      operationId: boostStatus
      summary: Boost a status
      description: |
        Boosting a status that is already boosted changes nothing. A status whose visibility
        does not allow boosting is a 422.
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unboostStatus
      summary: Retract the boost of a status
      description: Without a boost it changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/context:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    get:
      operationId: getStatusContext
      summary: Get the thread around a status
      description: |
        The ancestors and descendants of a status that the viewer may see. A status that the
        viewer may not see is a 404, the same as a missing one.
      tags: [statuses]
      security:
        - {}
        - oauth2: ["read:statuses"]
      responses:
        "200":
          description: The thread.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusContext"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/favourite:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    post:
      operationId: favouriteStatus
      summary: Favourite a status
      description: Favouriting a status that is already favourited changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:favourites"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unfavouriteStatus
      summary: Remove the favourite of a status
      description: Without a favourite it changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:favourites"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/history:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    get:
      operationId: getStatusHistory
      summary: Get the edit history of a status
      description: |
        Every revision of a status, oldest first; the last one is the current content. A
        status that the viewer may not see is a 404, the same as a missing one.
      tags: [statuses]
      security:
        - {}
        - oauth2: ["read:statuses"]
      responses:
        "200":
          description: The revisions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusHistory"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    post:
      operationId: pinStatus
      summary: Pin the authenticated user's status to the profile
      description: |
        Pinning a status that is already pinned changes nothing. Another account's status, a
        direct status, or a pin beyond the limit is a 422.
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unpinStatus
      summary: Unpin a status
      description: Without a pin it changes nothing.
      tags: [statuses]
      security:
        - oauth2: ["write:statuses"]
      responses:
        "200":
          $ref: "#/components/responses/StatusAfterAction"
        default:
          $ref: "#/components/responses/Problem"
  /statuses/{id}/source:
    parameters:
      - $ref: "#/components/parameters/StatusId"
    get:
      operationId: getStatusSource
      summary: Get the source of the authenticated user's status, for editing it
      description: Another account's status is a 404, the same as a missing one.
      tags: [statuses]
      security:
        - oauth2: ["read:statuses"]
      responses:
        "200":
          description: The source.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSource"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of statuses (#109) --------------------------------------------------------------
  # Timelines (FR-201 to FR-204, FR-208) ------------------------------------------------------
  /accounts/{id}/statuses:
    get:
      operationId: listAccountStatuses
      summary: List the posts and boosts of an account
      description: |
        The account's posts and boosts that the viewer may see, newest first: its public posts
        for everyone, its local posts for logged-in viewers, its followers-only posts for its
        followers, and its direct posts addressed to the viewer. With `pinned`, the page lists
        the account's pinned posts instead, newest pin first, in a single page.
      tags: [timelines]
      security:
        - {}
        - oauth2: ["read:statuses"]
      parameters:
        - name: id
          in: path
          required: true
          description: The account.
          schema:
            $ref: "#/components/schemas/Id"
        - name: exclude_replies
          in: query
          required: false
          description: Leave out the account's replies.
          schema:
            type: boolean
            default: false
        - name: exclude_boosts
          in: query
          required: false
          description: Leave out the account's boosts.
          schema:
            type: boolean
            default: false
        - name: pinned
          in: query
          required: false
          description: List only the account's pinned posts.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  /timelines/home:
    get:
      operationId: getHomeTimeline
      summary: Get the home timeline
      description: |
        The viewer's own posts and boosts and those of the accounts the viewer follows, newest
        first, in the viewer's timeline languages.
      tags: [timelines]
      security:
        - oauth2: ["read:statuses"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  /timelines/local:
    get:
      operationId: getLocalTimeline
      summary: Get the local timeline
      description: |
        The public posts of the instance's accounts, newest first, and their local posts for a
        logged-in viewer, in the viewer's timeline languages. The instance setting
        `local_timeline_enabled` turns it off; it is then a 404.
      tags: [timelines]
      security:
        - {}
        - oauth2: ["read:statuses"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  /timelines/public:
    get:
      operationId: getPublicTimeline
      summary: Get the federated timeline
      description: |
        The public posts of the instance's accounts and of the remote accounts whose posts the
        instance holds, newest first, in the viewer's timeline languages (FR-202). Posts of other
        visibilities, `local` ones included, and boosts never appear on it. The instance setting
        `federated_timeline_enabled` turns it off; it is then a 404.
      tags: [timelines]
      security:
        - {}
        - oauth2: ["read:statuses"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  /timelines/tag/{hashtag}:
    get:
      operationId: getHashtagTimeline
      summary: Get the timeline of a hashtag
      description: |
        The public posts with the hashtag, newest first, and its local posts for a logged-in
        viewer, in the viewer's timeline languages. A hashtag that no post uses has an empty
        timeline.
      tags: [timelines]
      security:
        - {}
        - oauth2: ["read:statuses"]
      parameters:
        - name: hashtag
          in: path
          required: true
          description: The hashtag without the `#`, matched case-insensitively.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/StatusPage"
        default:
          $ref: "#/components/responses/Problem"
  # --- reports (#332) ---
  /reports:
    get:
      operationId: listOwnReports
      summary: List the reports that the authenticated user filed
      description: |
        The reports that the user filed, newest first, each with whether it is still open or
        resolved (FR-711). A report reopened by the moderators is open again. It never tells how
        a report was resolved, which actions it led to, the reasons given to the account, or
        who handles it.
      tags: [reports]
      security:
        - oauth2: ["read:reports"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the user's reports.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createReport
      summary: Report an account
      description: |
        Reports an account, and optionally some of its posts, to the moderators (FR-701). The
        report waits, open, in the moderators' queue; nothing tells the account of it, and
        nothing that the account can read names the reporter. 422 when the account does not
        exist or is the user's own (`account_id`), when a post is not the account's or the
        user may not see it (`status_ids`), when `rule_ids` cite a rule that is not in effect
        or the category is not `violation`, or when the comment is too long. Reports are
        limited to 30 per hour per account (429 beyond).
      tags: [reports]
      security:
        - oauth2: ["write:reports"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "200":
          description: The filed report.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of reports (#332) ---
  # --- streaming (#116) ---
  /streaming:
    get:
      operationId: streamEvents
      summary: Stream real-time updates
      description: |
        A Server-Sent Events stream (`text/event-stream`) of the authenticated user's new home
        timeline entries and notifications, from the moment it opens. Read it with `fetch` and
        send the access token in `Authorization`, like every other operation (`EventSource`
        cannot send it).

        Events:

        - `update`: a new post or boost in the home timeline, as it would appear there (the
          viewer's follows, timeline languages, blocks, and mutes apply). `data` is a `Status`.
        - `notification`: a new notification. `data` is a `Notification`.

        A comment line (`: heartbeat`) arrives every 30 seconds. The server ends the stream when
        the access token stops being valid, when the client does not keep up, and when it shuts
        down; nothing is replayed, so after reconnecting read the home timeline and the
        notifications again for what was missed. A user may hold a limited number of streams
        open at once; past it the answer is 429 with type
        `/api/v1/problems/too-many-streams`.

        Each server process delivers only the updates that it produced itself, so a deployment
        that runs several web processes, or separate web and worker processes, misses updates
        on some streams.
      tags: [streaming]
      security:
        - oauth2: ["read:statuses", "read:notifications"]
      responses:
        "200":
          description: The event stream. It stays open until the client or the server ends it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  # --- end of streaming (#116) ---
  # --- admin: remote servers and dead jobs (#261) ---
  /admin/dead_jobs:
    get:
      operationId: listDeadJobs
      summary: List the dead jobs
      description: |
        The jobs of the job queue that failed for good (their handler gave up, or they used up
        their attempts), most recently failed first. Needs the `manage_jobs` permission; a user
        without it gets a 403 `/api/v1/problems/missing-permission`.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of dead jobs.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeadJobPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/dead_jobs/{id}/retry:
    post:
      operationId: retryDeadJob
      summary: Run a dead job again
      description: |
        Enqueues the dead job again with a fresh attempt count, to run now, and removes it from
        the dead jobs. When a pending job has the same idempotency key, that job stands in for
        it. An unknown ID, or one already retried, is a 404. Needs the `manage_jobs` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the dead job.
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: The job is enqueued.
        default:
          $ref: "#/components/responses/Problem"
  /admin/instances:
    get:
      operationId: listInstanceHealth
      summary: List the remote servers with delivery failures or marked unavailable
      description: |
        The health of the remote servers that deliveries failed to reach on some days, or that
        are marked unavailable, in domain order. A server that is not listed is available and
        has no failures. Unavailable servers are sent only `Follow`, `Accept`, and `Reject`
        until a delivery succeeds, they send a signed request, the daily probe reaches them, or
        an operator marks them available. Needs the `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the servers in this state; omitted keeps both.
          schema:
            $ref: "#/components/schemas/AdminInstanceState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of server health.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInstanceHealthPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/instances/{domain}:
    get:
      operationId: getInstanceHealth
      summary: Get the health of a remote server
      description: |
        The health of the server; one without failures is `available`, without `since`. Needs
        the `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/InstanceDomain"
      responses:
        "200":
          $ref: "#/components/responses/AdminInstanceHealth"
        default:
          $ref: "#/components/responses/Problem"
  /admin/instances/{domain}/availability_events:
    get:
      operationId: listInstanceAvailabilityEvents
      summary: List the times a remote server was marked unavailable or available
      description: |
        Why and when the server was marked unavailable or available again, newest first. Needs
        the `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/InstanceDomain"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of availability events.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAvailabilityEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/instances/{domain}/mark_available:
    post:
      operationId: markInstanceAvailable
      summary: Mark a remote server available
      description: |
        Clears the failure days of the server and, when it is unavailable, marks it available
        again with the reason `operator`, so that deliveries to it resume. A server that is
        already available without failures stays as it is. Needs the `manage_domains`
        permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/InstanceDomain"
      responses:
        "200":
          $ref: "#/components/responses/AdminInstanceHealth"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin (#261) ---
  # --- admin: audit log (#330) ---
  /admin/audit_log:
    get:
      operationId: listAuditLog
      summary: List the audit log
      description: |
        The operations of the moderators and administrators (FR-704), newest first: who did
        what to which target and when. Each entry keeps the target's display name as it was
        (`target_label`), so it stays readable after the target is gone; the reasons and notes
        stay with the operation itself (`source_event_id`). The audit log cannot be changed or
        deleted through the API. An unknown `action` or `target_kind`, or a `target_id`
        without its `target_kind`, is a 400. Needs the `view_audit` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - name: actor_account_id
          in: query
          required: false
          description: |
            Keep only the operations of the user of this local account. An account that is not
            local, or not known, has no operations.
          schema:
            $ref: "#/components/schemas/Id"
        - name: action
          in: query
          required: false
          description: Keep only this kind of operation.
          schema:
            $ref: "#/components/schemas/AdminAuditAction"
        - name: target_kind
          in: query
          required: false
          description: Keep only the operations on this kind of target.
          schema:
            $ref: "#/components/schemas/AdminAuditTargetKind"
        - name: target_id
          in: query
          required: false
          description: Keep only the operations on this target, of the kind `target_kind`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the audit log.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditEntryPage"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: audit log (#330) ---
  # --- admin: domain actions and reports (#296) ---
  /admin/domain_actions:
    get:
      operationId: listDomainActions
      summary: List the moderation actions on domains
      description: |
        The actions that moderators took on remote domains (FR-702), newest first, lifted and
        expired ones included unless `active` is set. Needs the `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - name: domain
          in: query
          required: false
          description: |
            Keep only the actions on this domain (not those on its parent domains). It is
            normalized like the domain of a new action.
          schema:
            type: string
            minLength: 1
            maxLength: 253
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of domain actions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDomainActionPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDomainAction
      summary: Take a moderation action on a domain
      description: |
        Records an action on a remote domain and its subdomains (FR-702), in effect at once and
        until it expires or is lifted. A `suspend` stops every delivery to the domain, every
        fetch from it, and every activity received from it, and hides its accounts and posts
        from the timelines; `limit` keeps its posts off the public timelines and its accounts
        from reaching users who do not follow them; `reject_media` stops fetching its media;
        `reject_reports` drops the reports it sends; `force_sensitive` marks its media
        sensitive. The domain is normalized (IDNA A-labels in lower case, without a trailing
        dot); one that is not a valid domain is a 422 naming `domain`. A `public_comment` or
        `private_note` that is too long or contains U+0000 is a 422 naming it. Needs the
        `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminDomainAction"
        default:
          $ref: "#/components/responses/Problem"
  /admin/domain_actions/{id}:
    get:
      operationId: getDomainAction
      summary: Get a moderation action on a domain
      description: An unknown ID is a 404. Needs the `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/DomainActionId"
      responses:
        "200":
          $ref: "#/components/responses/AdminDomainAction"
        default:
          $ref: "#/components/responses/Problem"
  /admin/domain_actions/{id}/lift:
    post:
      operationId: liftDomainAction
      summary: Lift a moderation action on a domain
      description: |
        Ends the action's restrictions at once; those of other actions on the domain stay.
        Lifting a lifted action changes nothing. An unknown ID is a 404. Needs the
        `manage_domains` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/DomainActionId"
      responses:
        "200":
          $ref: "#/components/responses/AdminDomainAction"
        default:
          $ref: "#/components/responses/Problem"
  /admin/reports:
    get:
      operationId: listReports
      summary: List the reports
      description: |
        The reports in the moderators' queue (FR-701), newest first. Needs the `manage_reports`
        permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - name: state
          in: query
          required: false
          description: Keep only the reports in this state; omitted keeps both.
          schema:
            $ref: "#/components/schemas/AdminReportState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of reports.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/reports/{id}:
    get:
      operationId: getReport
      summary: Get a report
      description: An unknown ID is a 404. Needs the `manage_reports` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          $ref: "#/components/responses/AdminReport"
        default:
          $ref: "#/components/responses/Problem"
  /admin/reports/{id}/assign_to_self:
    post:
      operationId: assignReportToSelf
      summary: Take a report
      description: |
        Makes the authenticated user the moderator who handles the report. An unknown ID is a
        404. Needs the `manage_reports` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          $ref: "#/components/responses/AdminReport"
        default:
          $ref: "#/components/responses/Problem"
  /admin/reports/{id}/unassign:
    post:
      operationId: unassignReport
      summary: Leave a report to nobody
      description: |
        Removes the moderator who handles the report, whoever it is. An unknown ID is a 404.
        Needs the `manage_reports` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          $ref: "#/components/responses/AdminReport"
        default:
          $ref: "#/components/responses/Problem"
  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      summary: Resolve a report
      description: |
        Resolves an open report with an outcome. Resolving a resolved report changes nothing
        and keeps its outcome. An unknown ID is a 404. Needs the `manage_reports` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminReport"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: domain actions and reports (#296) ---
  # --- admin: account actions (#316) ---
  /admin/accounts/{id}/actions:
    get:
      operationId: listAccountActions
      summary: List the moderation actions on an account
      description: |
        The actions that moderators took on an account (FR-703), newest first, lifted and
        expired ones included unless `active` is set. An unknown account is a 404. Needs the
        `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/AdminAccountId"
        - name: active
          in: query
          required: false
          description: Keep only the actions in effect now, neither lifted nor expired.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of account actions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountActionPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccountAction
      summary: Take a moderation action on an account
      description: |
        Records an action on an account (FR-703), in effect at once and until it expires or is
        lifted; several actions on one account add up. On a local account: `warn` only tells
        the account; `force_sensitive` shows its media as sensitive; `limit` makes its posts,
        past ones included, followers-only and keeps them off the public timelines;
        `restrict_posting` stops it posting, replying, boosting, and editing;
        `restrict_interaction` stops it following, favouriting, boosting, and replying;
        `disable_login` ends its sessions and tokens and stops it logging in; `suspend` does all
        of these and hides its profile and posts from everyone else; `ban` is a `suspend` that
        is never lifted and deletes the account 30 days later. `delete_statuses` deletes the
        posts of the account that `status_ids` names, for everyone, the account included, and
        sends their deletion like the account's own; `mark_statuses_sensitive` shows their
        media as sensitive until it is lifted. A remote account takes `limit`, `suspend`, and
        `force_sensitive`. Another kind, the instance actor, or a `report_id` that is not a
        report of the account is a 422 naming `kind`, `id`, or `report_id`. `status_ids` on
        another kind, missing, repeated, or too many on an action on posts, or naming a post
        that does not exist, is deleted, or is of another account is a 422 naming `status_ids`;
        `expires_in` on a `ban` or an action on posts is a 422 naming `expires_in`. A text that
        is too long or contains U+0000 is a 422 naming it. An unknown account is a 404. Needs
        the `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/AdminAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccountAction"
        default:
          $ref: "#/components/responses/Problem"
  /admin/account_actions/{id}:
    get:
      operationId: getAccountAction
      summary: Get a moderation action on an account
      description: An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/AccountActionId"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccountAction"
        default:
          $ref: "#/components/responses/Problem"
  /admin/account_actions/{id}/lift:
    post:
      operationId: liftAccountAction
      summary: Lift a moderation action on an account
      description: |
        Ends the action's restrictions at once; those of other actions on the account stay.
        Sessions and tokens that the action ended stay ended, and so do the posts that
        `delete_statuses` deleted; the posts that `mark_statuses_sensitive` marked are shown as
        they were. Lifting a lifted action changes nothing and keeps its first reason. A `ban`
        is never lifted: a 422 naming `id`. A `reason` that is too long or contains U+0000 is a
        422 naming `reason`. An unknown ID is a 404. Needs the `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/AccountActionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiftAccountActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccountAction"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: account actions (#316) ---
  # --- admin: instance rules (#331) ---
  /admin/rules:
    get:
      operationId: listInstanceRules
      summary: List the instance rules
      description: |
        Every rule in every locale (FR-705): the rules in effect by position, followed, when
        `include_retired` is set, by the retired ones. The list is not paginated; at most 100
        rules are in effect. Needs the `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - name: include_retired
          in: query
          required: false
          description: Also list the retired rules, after the rules in effect.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The rules.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRuleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInstanceRule
      summary: Add an instance rule
      description: |
        Adds a rule after the rules in effect. A text that is blank, longer than 300
        characters, or on more than one line, a hint longer than 1,000 characters, a locale
        that is not a BCP 47 tag or appears twice (after canonicalization: `ja_jp` is `ja-JP`),
        no texts, or more than 50 is a 422 naming the property (`texts[0].text`). With 100
        rules in effect it is a 422 naming `rules`. Needs the `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceRuleInput"
      responses:
        "200":
          $ref: "#/components/responses/AdminRule"
        default:
          $ref: "#/components/responses/Problem"
  /admin/rules/{id}:
    get:
      operationId: getInstanceRule
      summary: Get an instance rule
      description: |
        A rule, retired or not; reports cite rules by ID. An unknown ID is a 404. Needs the
        `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          $ref: "#/components/responses/AdminRule"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateInstanceRule
      summary: Revise the texts of an instance rule
      description: |
        Records a revision whose texts replace every text of the rule; the rule keeps its ID
        and position. The texts are checked as for a new rule (422). A retired rule is a 409
        and an unknown ID a 404. Needs the `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceRuleInput"
      responses:
        "200":
          $ref: "#/components/responses/AdminRule"
        default:
          $ref: "#/components/responses/Problem"
  /admin/rules/{id}/move:
    post:
      operationId: moveInstanceRule
      summary: Move an instance rule
      description: |
        Moves the rule to a place among the rules in effect and numbers them 1, 2, ... in their
        new order; a place after the last rule moves it last. A `position` below 1 is a 422, a
        retired rule a 409, and an unknown ID a 404. Needs the `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveInstanceRuleRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminRule"
        default:
          $ref: "#/components/responses/Problem"
  /admin/rules/{id}/retire:
    post:
      operationId: retireInstanceRule
      summary: Retire an instance rule
      description: |
        Removes the rule from the rules in effect, at once and for good; reports that cite it
        still refer to it. Retiring a retired rule changes nothing. An unknown ID is a 404.
        Needs the `manage_rules` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          $ref: "#/components/responses/AdminRule"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: instance rules (#331) ---
  # --- admin: moderator counts (#338) ---
  /admin/counts:
    get:
      operationId: getAdminCounts
      summary: Count what awaits the moderators
      description: |
        The number of open reports (with the `manage_reports` permission) and of registrations
        that await approval (with the `manage_accounts` permission), for the badges of the
        admin menu (FR-712). A count whose permission the user's roles lack is omitted, so a
        user without either gets an empty object.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      responses:
        "200":
          description: The counts that the user may see.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCounts"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: moderator counts (#338) ---
  # --- admin: registrations (#345) ---
  /admin/registrations:
    get:
      operationId: listPendingRegistrations
      summary: List the registrations that await approval
      description: |
        The sign-ups that wait for a moderator's decision (FR-721), with the reasons their
        applicants gave, longest waiting first. Needs the `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of pending registrations.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationPage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/registrations/{user_id}/approve:
    post:
      operationId: approveRegistration
      summary: Approve a registration
      description: |
        Approves a pending registration, so that its user can sign in, with an optional note
        for the moderators; the decision is audited. Deciding a decided registration changes
        nothing and keeps its decision. A user without a registration is a 404. Needs the
        `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/RegistrationUserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminRegistration"
        default:
          $ref: "#/components/responses/Problem"
  /admin/registrations/{user_id}/reject:
    post:
      operationId: rejectRegistration
      summary: Reject a registration
      description: |
        Rejects a pending registration, so that its user cannot sign in, with an optional note
        for the moderators; the decision is audited. Deciding a decided registration changes
        nothing and keeps its decision. A user without a registration is a 404. Needs the
        `manage_accounts` permission.
      tags: [admin]
      security:
        - oauth2: ["admin:write"]
      parameters:
        - $ref: "#/components/parameters/RegistrationUserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminRegistration"
        default:
          $ref: "#/components/responses/Problem"
  # --- end of admin: registrations (#345) ---
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        An OAuth 2.0 access token (Authorization Code + PKCE S256), sent as
        `Authorization: Bearer <token>`. `read`, `write`, `follow`, and `admin` grant every scope
        under them (`read` grants `read:accounts`; `follow` grants `read:follows`, `read:blocks`,
        `read:mutes`, `write:follows`, `write:blocks`, and `write:mutes`; `admin` grants
        `admin:read` and `admin:write`). `read` and `write` do not grant the admin scopes.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            admin: Administer the instance, as far as the user's roles allow.
            "admin:read": Read the instance's administration data, as far as the user's roles allow.
            "admin:write": Change the instance's administration data, as far as the user's roles allow.
            read: Read everything the user can read.
            write: Change everything the user can change.
            follow: Read and change follows, blocks, and mutes.
            push: Receive Web Push notifications.
            "read:accounts": Read accounts, including the user's own.
            "read:blocks": Read the accounts the user blocks.
            "read:bookmarks": Read the user's bookmarks.
            "read:favourites": Read the user's favourites.
            "read:follows": Read follows and follow requests.
            "read:mutes": Read the accounts the user mutes.
            "read:notifications": Read the user's notifications.
            "read:reports": Read the reports the user filed and whether they are resolved.
            "read:statuses": Read posts and timelines.
            "write:accounts": Change the user's profile and preferences.
            "write:blocks": Block and unblock accounts.
            "write:bookmarks": Bookmark posts and remove bookmarks.
            "write:favourites": Favourite posts and remove favourites.
            "write:follows": Follow and unfollow accounts and answer follow requests.
            "write:media": Upload media and change their descriptions.
            "write:mutes": Mute and unmute accounts.
            "write:notifications": Mark notifications read and dismiss them.
            "write:reports": Report accounts and posts to the moderators.
            "write:statuses": Post, edit, delete, boost, and pin posts.
  headers:
    CacheControl:
      description: The caching policy. Anonymous public GETs are cacheable by shared caches (ADR-0016).
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page; omitted for the first page.
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      description: The maximum number of items in the page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 20
    # --- statuses (#109) ---
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key the client chooses per new status; a retry with the same key returns the status
        posted with it instead of posting again. A key longer than 256 characters, or one
        that is not UTF-8 without U+0000, is a 422.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    StatusId:
      name: id
      in: path
      description: The ID of the status.
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    # --- end of statuses (#109) ---
    # Accounts and relationships (#108).
    AccountId:
      name: id
      in: path
      required: true
      description: The account ID.
      schema:
        $ref: "#/components/schemas/Id"
    # --- admin (#261) ---
    InstanceDomain:
      name: domain
      in: path
      required: true
      description: The domain of the remote server, such as `mastodon.example`.
      schema:
        type: string
        minLength: 1
        maxLength: 253
    # --- end of admin (#261) ---
    # --- admin: domain actions and reports (#296) ---
    DomainActionId:
      name: id
      in: path
      required: true
      description: The ID of the domain action.
      schema:
        $ref: "#/components/schemas/Id"
    ReportId:
      name: id
      in: path
      required: true
      description: The ID of the report.
      schema:
        $ref: "#/components/schemas/Id"
    # --- end of admin: domain actions and reports (#296) ---
    # --- admin: account actions (#316) ---
    AccountActionId:
      name: id
      in: path
      required: true
      description: The ID of the account action.
      schema:
        $ref: "#/components/schemas/Id"
    AdminAccountId:
      name: id
      in: path
      required: true
      description: The ID of the account, local or remote.
      schema:
        $ref: "#/components/schemas/Id"
    # --- end of admin: account actions (#316) ---
    # --- admin: instance rules (#331) ---
    RuleId:
      name: id
      in: path
      required: true
      description: The ID of the rule.
      schema:
        $ref: "#/components/schemas/Id"
    # --- end of admin: instance rules (#331) ---
    # --- admin: registrations (#345) ---
    RegistrationUserId:
      name: user_id
      in: path
      required: true
      description: The ID of the user who signed up.
      schema:
        $ref: "#/components/schemas/Id"
    # --- end of admin: registrations (#345) ---
  responses:
    StatusPage:
      description: A page of posts and boosts, newest first.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusPage"
    Problem:
      description: An error, as an RFC 9457 problem document.
      headers:
        Content-Language:
          description: The locale of `title` and `detail`.
          schema:
            type: string
        Cache-Control:
          description: Always `no-store`; problems are never cached.
          schema:
            type: string
        WWW-Authenticate:
          description: |
            The Bearer challenge of a 401 or a 403 `insufficient_scope` (RFC 6750 §3), with
            `error` and, for `insufficient_scope`, the `scope` the operation needs.
          schema:
            type: string
        Retry-After:
          description: The seconds to wait before retrying, on a 429.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    # --- statuses (#109) ---
    StatusAfterAction:
      description: The status after the action, as the authenticated user sees it.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    # --- end of statuses (#109) ---
    # Accounts and relationships (#108).
    AccountPage:
      description: A page of accounts.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountPage"
    AccountProfile:
      description: The account, with its follow counts.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    Relationship:
      description: The viewer's relationship with the account after the change.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Relationship"
    # --- admin (#261) ---
    AdminInstanceHealth:
      description: The health of the remote server.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminInstanceHealth"
    # --- end of admin (#261) ---
    # --- admin: domain actions and reports (#296) ---
    AdminDomainAction:
      description: The domain action.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminDomainAction"
    AdminReport:
      description: The report.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminReport"
    # --- end of admin: domain actions and reports (#296) ---
    # --- admin: account actions (#316) ---
    AdminAccountAction:
      description: The account action.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAccountAction"
    # --- end of admin: account actions (#316) ---
    # --- admin: instance rules (#331) ---
    AdminRule:
      description: The rule.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRule"
    # --- end of admin: instance rules (#331) ---
    # --- admin: registrations (#345) ---
    AdminRegistration:
      description: The registration.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRegistration"
    # --- end of admin: registrations (#345) ---
  schemas:
    Id:
      description: The ID of a resource, a UUIDv7 in its canonical string form.
      type: string
      format: uuid
      examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
      # The application layer passes IDs as strings (kernel.IDGenerator).
      x-go-type: string
    Cursor:
      description: An opaque pagination cursor. Clients pass it back unchanged and never parse it.
      type: string
      minLength: 1
      maxLength: 256
    PageInfo:
      description: The pagination of a collection page; collection responses embed it with allOf.
      type: object
      properties:
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    Problem:
      description: |
        An RFC 9457 problem document. Besides `about:blank`, `type` is one of

        - `/api/v1/problems/unauthenticated` (401): the operation needs an access token and
          the request has none.
        - `/api/v1/problems/invalid-token` (401): the access token is malformed, unknown,
          expired, or revoked. Refresh it or sign in again.
        - `/api/v1/problems/insufficient-scope` (403): the access token lacks the scope that
          `WWW-Authenticate` names.
        - `/api/v1/problems/account-unavailable` (403): the token is valid, but its user cannot
          use the app (registration pending or rejected, email unverified, the account
          deactivated or deleted, or a moderation action that disables its login). The user
          can still sign in to the server's sign-in page, which says why.
        - `/api/v1/problems/blocking` (409): the viewer blocks the account, which keeps them
          from following it. Unblock it first.
        - `/api/v1/problems/media-too-large` (413): the uploaded file is larger than the
          instance accepts.
        - `/api/v1/problems/unsupported-media-format` (415): the uploaded file is not in an
          accepted format, or its declared type does not match its content.
        - `/api/v1/problems/media-dimensions` (422): the image is too wide or tall, or has too
          many pixels or frames.
        - `/api/v1/problems/media-corrupt` (422): the uploaded file cannot be read as an image
          of its format.
        - `/api/v1/problems/media-attached` (409): the media file is attached to a post and can
          no longer be changed on its own.
        - `/api/v1/problems/too-many-streams` (429): the user already has as many streams
          (`GET /streaming`) open as the server allows. Close one first.
        - `/api/v1/problems/missing-permission` (403): the user's roles lack the permission
          that an admin operation needs.
      type: object
      required: [type, title, status]
      properties:
        type:
          description: |
            A URI that identifies the problem type, stable for clients to branch on.
            It is `about:blank` when the problem means no more than its HTTP status.
          type: string
          format: uri-reference
        title:
          description: A short summary of the problem type, localized from `Accept-Language`.
          type: string
        status:
          description: The HTTP status code.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: An explanation of this occurrence, localized from `Accept-Language`.
          type: string
        request_id:
          description: The request ID (the `X-Request-Id` response header), for reporting the problem.
          type: string
    Instance:
      description: Public information about the instance.
      type: object
      required: [domain, name, version, source_url, registrations, limits, timelines, rules]
      properties:
        domain:
          description: The domain that serves the instance.
          type: string
        name:
          description: The display name of the instance; the domain when the instance has none.
          type: string
        short_description:
          description: A one-paragraph summary of the instance, as plain text; omitted when there is none.
          type: string
        description:
          description: The full description of the instance, as plain text; omitted when there is none.
          type: string
        registrations:
          $ref: "#/components/schemas/InstanceRegistrations"
        version:
          description: The server version.
          type: string
        source_url:
          description: Where users get the source code of the running server (AGPL-3.0 section 13).
          type: string
          format: uri
        limits:
          $ref: "#/components/schemas/InstanceLimits"
        timelines:
          $ref: "#/components/schemas/InstanceTimelines"
        rules:
          description: The rules in effect, in order, each in the locale of the request.
          type: array
          items:
            $ref: "#/components/schemas/InstanceRule"
    InstanceRegistrations:
      description: How people sign up on the instance.
      type: object
      required: [mode]
      properties:
        mode:
          description: |
            Who may sign up: `open` (anyone), `approval` (sign-ups wait for a moderator's
            approval), `invite` (only with an invite), or `closed` (nobody).
          type: string
          enum: [open, approval, invite, closed]
    InstanceLimits:
      description: Limits that clients check before sending a request.
      type: object
      required: [max_post_characters]
      properties:
        max_post_characters:
          description: The maximum number of characters in the text and content warning of a post.
          type: integer
          minimum: 1
    InstanceTimelines:
      description: |
        Which public timelines the instance serves (FR-202). A timeline that is off is a 404, so
        clients do not offer it.
      type: object
      required: [local, federated]
      properties:
        local:
          description: Whether `GET /timelines/local` serves the local timeline (the instance setting `local_timeline_enabled`).
          type: boolean
        federated:
          description: Whether `GET /timelines/public` serves the federated timeline (the instance setting `federated_timeline_enabled`).
          type: boolean
    InstanceRule:
      description: |
        A rule of the instance (FR-705), in the first locale of the request's fallback chain
        that the rule has (the request's locale and its parents, the instance's default locale
        and its parents, then `en`), or else in its first locale. Reports cite it by `id`.
      type: object
      required: [id, text, lang]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
        lang:
          description: The BCP 47 tag of the locale of `text` and `hint`, for the `lang` attribute.
          type: string
    # --- instance: public domain actions (#347) ---
    InstanceDomainAction:
      description: A moderation action in effect on a remote domain and its subdomains, as the instance lists it publicly (FR-718).
      type: object
      required: [domain, digest, kind]
      properties:
        domain:
          description: |
            The domain, in IDNA A-labels. When the moderators chose to obfuscate it, the
            characters of its middle half other than dots are replaced with `*`.
          type: string
        digest:
          description: The SHA-256 of the domain (not obfuscated) in lower-case hexadecimal, to check a known domain against an obfuscated item.
          type: string
          pattern: "^[0-9a-f]{64}$"
        kind:
          description: |
            `suspend`: no federation with the domain at all. `limit`: its posts stay off the
            public timelines and its accounts reach only their followers.
          type: string
          enum: [limit, suspend]
        comment:
          description: The public reason for the action; omitted when there is none or the viewer may not read it.
          type: string
    InstanceDomainActionPage:
      description: A page of public domain actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InstanceDomainAction"
    # --- end of instance: public domain actions (#347) ---
    # Accounts and relationships (#108).
    Account:
      description: An account, as clients show it (FR-006).
      type: object
      required: [id, username, acct, domain, uri, display_name, note, fields, url, locked, bot, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        display_name:
          description: The display name; empty when the account has none.
          type: string
        note:
          description: The profile text as sanitized HTML; empty when there is none.
          type: string
        url:
          description: |
            The account's profile page: on this instance for a local account, and for a remote
            one the page its actor declares (`url`), or its `uri` when it declares none.
          type: string
          format: uri
        locked:
          description: Whether follow requests need the account's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        created_at:
          description: When the account was created.
          type: string
          format: date-time
        fields:
          description: The profile's metadata fields, in their order; empty when there are none.
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"
        avatar_url:
          description: |
            The URL of the avatar image; omitted when the account has none, or its image is not
            processed yet or could not be processed. Clients show a placeholder instead.
          type: string
          format: uri
        header_url:
          description: The URL of the header image; omitted when there is none, as `avatar_url` is.
          type: string
          format: uri
        followers_count:
          description: |
            The number of accounts that actively follow the account, as far as the instance
            knows. Present on the account's own endpoints (`getAccount`, `lookupAccount`,
            `verifyAccountCredentials`) and left out where accounts are listed or embedded.
          type: integer
          minimum: 0
        following_count:
          description: The number of accounts that the account actively follows; present where `followers_count` is.
          type: integer
          minimum: 0
    AccountPage:
      description: A page of accounts.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [accounts]
          properties:
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/Account"
    FollowAccountRequest:
      description: The viewer's preferences of the follow; a preference left out keeps its value.
      type: object
      properties:
        show_boosts:
          description: Show the account's boosts in the home timeline. New follows show them.
          type: boolean
        notify:
          description: Notify the viewer of the account's new posts. New follows do not.
          type: boolean
    MuteAccountRequest:
      description: The settings of a mute.
      type: object
      properties:
        notifications:
          description: Also hide the account's notifications.
          type: boolean
          default: true
        duration:
          description: How long the mute lasts, in seconds; 0 mutes until unmuted.
          type: integer
          minimum: 0
          maximum: 31536000
          default: 0
    MutePage:
      description: A page of mutes.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [mutes]
          properties:
            mutes:
              type: array
              items:
                $ref: "#/components/schemas/MutedAccount"
    MutedAccount:
      description: An account that the viewer mutes, with the mute's settings.
      type: object
      required: [account, notifications]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        notifications:
          description: Whether the mute also hides the account's notifications.
          type: boolean
        expires_at:
          description: When the mute ends; left out for a mute until unmuted.
          type: string
          format: date-time
    ProfileField:
      description: One metadata field of a profile.
      type: object
      required: [name, value]
      properties:
        name:
          description: The field's name, as plain text.
          type: string
        value:
          description: The field's value as sanitized HTML.
          type: string
    Relationship:
      description: |
        The viewer's relationship with an account. It never says whether the account blocks
        the viewer: such an account is not found at all.
      type: object
      required: [id, following, requested, followed_by, requested_by, show_boosts, notify, blocking, muting, muting_notifications]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        following:
          description: Whether the viewer actively follows the account.
          type: boolean
        requested:
          description: Whether the viewer's follow request awaits the account's approval.
          type: boolean
        followed_by:
          description: Whether the account actively follows the viewer.
          type: boolean
        requested_by:
          description: Whether the account's follow request awaits the viewer's approval.
          type: boolean
        show_boosts:
          description: Whether the viewer's follow shows the account's boosts in the home timeline (true without a follow).
          type: boolean
        notify:
          description: Whether the viewer's follow notifies them of the account's new posts.
          type: boolean
        blocking:
          description: Whether the viewer blocks the account.
          type: boolean
        muting:
          description: Whether the viewer mutes the account (a mute that has not expired).
          type: boolean
        muting_notifications:
          description: Whether the viewer's mute also hides the account's notifications.
          type: boolean
    # --- End of accounts and relationships (#108) ---
    # --- media (#112) -------------------------------------------------------------------
    MediaAttachment:
      description: |
        A media file, as an upload of the user (the media operations) or as an attachment of
        a status (`Status.media_attachments`). `url`, `preview_url`, `variants`, and `blurhash`
        are present once the file is `ready`; statuses attach only ready files. In a status,
        `description` is the status revision's own copy of the alternative text, absent when the
        attachment has none.

        A file of a remote status is always `ready`: the instance does not process it, so it has
        no `variants`; `url` and `preview_url` are its media proxy URL (federation.md §9),
        `remote_url` its URL on the remote server, and `meta`, `blurhash`, and `type` what the
        remote server declared.
      type: object
      required: [id, type, state, meta]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          description: The kind of media. Every accepted upload is an `image`; a file that failed processing is `unknown`.
          type: string
          enum: [image, gifv, video, audio, unknown]
        state:
          description: |
            The processing state: `processing` until the server has re-encoded the file,
            then `ready`, or `failed` when the content could not be processed.
          type: string
          enum: [processing, ready, failed]
        description:
          description: The alternative text; absent when there is none.
          type: string
          maxLength: 1500
        blurhash:
          description: The blurhash (https://blurha.sh) of the image, to show while it loads.
          type: string
        meta:
          $ref: "#/components/schemas/MediaMeta"
        variants:
          $ref: "#/components/schemas/MediaVariants"
        url:
          description: Where the file is served on this instance; for an upload, `variants.full.url`.
          type: string
          format: uri
        preview_url:
          description: Where its preview is served; for an upload, `variants.thumbnail.url`.
          type: string
          format: uri
        remote_url:
          description: The file's URL on the remote server, for a file of a remote status; clients load `url` instead.
          type: string
          format: uri
    MediaFocus:
      description: |
        The focal point that previews keep in view when they crop the image, from -1.0 (left,
        bottom) to 1.0 (right, top) on each axis; (0, 0) is the center.
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          minimum: -1
          maximum: 1
        y:
          type: number
          format: double
          minimum: -1
          maximum: 1
    MediaMeta:
      description: What the server knows about the media file.
      type: object
      required: [focus]
      properties:
        width:
          description: The width of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        height:
          description: The height of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        focus:
          $ref: "#/components/schemas/MediaFocus"
    MediaUpdate:
      description: The changes to a media file; a property left out keeps its value.
      type: object
      properties:
        description:
          description: The alternative text; an empty string removes it. Text with U+0000 is a 422.
          type: string
          maxLength: 1500
        focus:
          $ref: "#/components/schemas/MediaFocus"
    MediaUpload:
      description: An upload of a media file.
      type: object
      required: [file]
      properties:
        file:
          description: The file. Its declared type, if any, must match its content.
          type: string
          format: binary
        description:
          description: The alternative text. Text that is not UTF-8 or has U+0000 is a 422.
          type: string
          maxLength: 1500
    MediaVariant:
      description: A rendition of a media file, without metadata.
      type: object
      required: [url, content_type, width, height, size]
      properties:
        url:
          description: Where the rendition is served.
          type: string
          format: uri
        content_type:
          description: The media type of the rendition.
          type: string
        width:
          description: The width in pixels.
          type: integer
          minimum: 1
        height:
          description: The height in pixels.
          type: integer
          minimum: 1
        size:
          description: The size of the file in bytes.
          type: integer
          format: int64
          minimum: 1
    MediaVariants:
      description: The renditions of a ready media file.
      type: object
      required: [full, thumbnail]
      properties:
        full:
          description: The file itself, scaled down to at most 3840 × 2160 pixels of area.
          $ref: "#/components/schemas/MediaVariant"
        thumbnail:
          description: The preview, at most 640 × 360 pixels of area.
          $ref: "#/components/schemas/MediaVariant"
    # --- end of media --------------------------------------------------------------------
    # --- moderation: the user's own actions (#336) ---
    ModerationAction:
      description: |
        A moderation action on the authenticated user's own account (FR-715, NFR-MOD-6), as the
        user sees it. It never carries the moderators' private note, the report the action
        follows from, or who filed the report or issued the action.
      type: object
      required: [id, kind, kind_label, reason_category, reason_category_label, status_ids, state, issued_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        kind_label:
          description: What the action does, in the user's language.
          type: string
        reason_category:
          $ref: "#/components/schemas/AdminAccountActionCategory"
        reason_category_label:
          description: The reason category, in the user's language.
          type: string
        public_reason:
          description: |
            The moderators' explanation to the user, as plain text; omitted when there is none.
          type: string
        status_ids:
          description: |
            The posts that an action on posts acted on; empty for an action on the whole account.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/AdminAccountActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted when it lasts until it is lifted.
          type: string
          format: date-time
        lifted_at:
          description: When a moderator lifted the action; omitted unless it is lifted.
          type: string
          format: date-time
    ModerationActionPage:
      description: A page of the actions on the user's own account, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ModerationAction"
    # --- end of moderation: the user's own actions (#336) ---
    # --- notifications (#111) ---
    Notification:
      description: A notification of something that happened to the authenticated user.
      type: object
      required: [id, type, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/NotificationType"
        created_at:
          description: When it happened.
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        status:
          description: |
            The post that the notification is about, as the user sees it; omitted when the user
            may not see it.
          $ref: "#/components/schemas/Status"
        report:
          description: The user's report that a `report_resolved` tells of.
          $ref: "#/components/schemas/Report"
        moderation_action:
          description: The action on the user's account that a `moderation_notice` tells of.
          $ref: "#/components/schemas/ModerationAction"
        report_id:
          description: The report that an `admin_report` is about.
          allOf:
            - $ref: "#/components/schemas/Id"
    NotificationMarker:
      description: How far the authenticated user has read the notifications.
      type: object
      required: [unread_count]
      properties:
        last_read_id:
          description: The newest notification read; omitted when the user has read none.
          $ref: "#/components/schemas/Id"
        unread_count:
          description: The number of listed notifications newer than `last_read_id`.
          type: integer
          format: int64
          minimum: 0
    NotificationMarkerUpdate:
      description: The new position of the read marker.
      type: object
      required: [last_read_id]
      properties:
        last_read_id:
          $ref: "#/components/schemas/Id"
    NotificationPage:
      description: A page of notifications, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Notification"
    NotificationType:
      description: |
        The kind of a notification. `account` is the account that acted: the follower
        (`follow`, `follow_request`), the followed account (`follow_accepted`), the author
        (`mention`), the booster (`boost`), or the account that favourited (`favourite`).
        `status` is the post that `mention`, `boost`, `favourite`, and `poll_closed` are
        about. `moderation_notice` comes from the instance and has no `account`; its
        `moderation_action` is the action on the user's account, with its kind, reason, and end.
        `report_resolved` also comes from the instance: its `report` is the user's report that
        the moderators resolved, without how they resolved it. It is sent once per report, even
        when the report is reopened and resolved again.
        about. `moderation_notice` comes from the instance and has no `account`.
        The moderator notifications come from the instance too: `admin_report` (an account
        that had no open report was reported; `report_id` is the report) goes to the users
        with the `manage_reports` permission, and `admin_sign_up` (a registration awaits
        approval; `account` is the new user's account) to those with `manage_accounts`.
      type: string
      enum:
        - follow
        - follow_request
        - follow_accepted
        - mention
        - boost
        - favourite
        - poll_closed
        - moderation_notice
        - report_resolved
        - admin_report
        - admin_sign_up
    # --- end notifications ---
    # --- statuses (#109): Status is shared with the other operations; MediaAttachment is in the media section ---
    CreateStatusRequest:
      description: A new status.
      type: object
      required: [text, visibility]
      properties:
        text:
          $ref: "#/components/schemas/StatusText"
        spoiler_text:
          $ref: "#/components/schemas/SpoilerText"
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: "#/components/schemas/StatusLanguageInput"
        visibility:
          $ref: "#/components/schemas/Visibility"
        in_reply_to_id:
          $ref: "#/components/schemas/Id"
        media:
          $ref: "#/components/schemas/StatusMediaInput"
    EditStatusRequest:
      description: The new content of a status.
      type: object
      required: [text]
      properties:
        text:
          $ref: "#/components/schemas/StatusText"
        spoiler_text:
          $ref: "#/components/schemas/SpoilerText"
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: "#/components/schemas/StatusLanguageInput"
        media:
          $ref: "#/components/schemas/StatusMediaInput"
    SpoilerText:
      description: The content warning; omitted or empty for none. It counts toward `max_post_characters`.
      type: string
    Status:
      description: |
        A status (post), as the viewer sees it. `favourited`, `boosted`, and `bookmarked`
        describe the authenticated user's relation to it and are omitted for anonymous
        requests; `pinned` is only given to the author.

        In a timeline, a boost is a status of the booster with `boost` set to the boosted
        status: its `id` and `uri` are those of the boost, `created_at` is when it was boosted,
        `visibility` and `language` are those of the boosted status, its `content`,
        `spoiler_text`, `media_attachments`, `mentions`, and `tags` are empty, and its counts
        are zero.
      type: object
      required:
        - id
        - uri
        - account
        - content
        - spoiler_text
        - sensitive
        - visibility
        - language
        - created_at
        - media_attachments
        - mentions
        - tags
        - replies_count
        - boosts_count
        - favourites_count
      properties:
        id:
          $ref: "#/components/schemas/Id"
        uri:
          description: The ActivityPub ID of the status.
          type: string
          format: uri
        url:
          description: |
            The HTML page of the status, on the server it belongs to for a remote status; omitted
            when it has none.
          type: string
          format: uri
        account:
          $ref: "#/components/schemas/Account"
        content:
          description: |
            The text as sanitized HTML, with mentions, hashtags, and URLs linked. The HTML of a
            remote status is what the server's sanitizer kept of the received document (ADR-0019 §2).
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        visibility:
          $ref: "#/components/schemas/Visibility"
        language:
          description: The BCP 47 language tag of the text; `und` when it is unknown.
          type: string
        in_reply_to_id:
          $ref: "#/components/schemas/Id"
        in_reply_to_account_id:
          $ref: "#/components/schemas/Id"
        created_at:
          description: When the status was posted.
          type: string
          format: date-time
        boost:
          $ref: "#/components/schemas/Status"
        edited_at:
          description: When the status was last edited; omitted when it never was.
          type: string
          format: date-time
        media_attachments:
          description: The attached media, in order.
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
        mentions:
          description: The accounts the text mentions.
          type: array
          items:
            $ref: "#/components/schemas/StatusMention"
        tags:
          description: The hashtags of the text.
          type: array
          items:
            $ref: "#/components/schemas/StatusTag"
        replies_count:
          description: The number of replies.
          type: integer
          minimum: 0
        boosts_count:
          description: The number of boosts.
          type: integer
          minimum: 0
        favourites_count:
          description: The number of favourites.
          type: integer
          minimum: 0
        favourited:
          description: Whether the authenticated user favourited the status.
          type: boolean
        boosted:
          description: Whether the authenticated user boosts the status.
          type: boolean
        bookmarked:
          description: Whether the authenticated user bookmarked the status.
          type: boolean
        pinned:
          description: Whether the status is pinned to the author's profile; given only to the author.
          type: boolean
    StatusContext:
      description: The thread around a status.
      type: object
      required: [ancestors, descendants]
      properties:
        ancestors:
          description: The statuses the status replies to, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/Status"
        descendants:
          description: The replies to the status and their replies, depth first in posting order.
          type: array
          items:
            $ref: "#/components/schemas/Status"
    StatusEdit:
      description: One revision of a status.
      type: object
      required: [content, spoiler_text, sensitive, created_at, media_attachments]
      properties:
        content:
          description: The text of the revision as sanitized HTML.
          type: string
        spoiler_text:
          description: The content warning of the revision; empty when there is none.
          type: string
        sensitive:
          description: Whether the media of the revision are sensitive.
          type: boolean
        created_at:
          description: When the revision was made; the first one is when the status was posted.
          type: string
          format: date-time
        media_attachments:
          description: The media the revision attaches, in order.
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
    StatusHistory:
      description: The revisions of a status.
      type: object
      required: [items]
      properties:
        items:
          description: The revisions, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/StatusEdit"
    StatusLanguageInput:
      description: A BCP 47 language tag; omitted means the user's default post language.
      type: string
      minLength: 1
      maxLength: 35
    StatusMediaInput:
      description: The media to attach, in order.
      type: array
      maxItems: 4
      items:
        $ref: "#/components/schemas/StatusMediaItem"
    StatusMediaItem:
      description: A media file to attach, with its alternative text.
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        description:
          description: The alternative text; omitted or empty for none.
          type: string
          maxLength: 1500
    StatusMention:
      description: An account that a status mentions.
      type: object
      required: [id, username, acct, url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        url:
          description: The account's profile page.
          type: string
          format: uri
    StatusPage:
      description: A page of statuses.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              description: The statuses of the page.
              type: array
              items:
                $ref: "#/components/schemas/Status"
    StatusSource:
      description: What the author typed, for editing a status.
      type: object
      required: [id, text, spoiler_text, language]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: The plain text.
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        language:
          description: The BCP 47 language tag; `und` when it is unknown.
          type: string
    StatusTag:
      description: A hashtag of a status.
      type: object
      required: [name, url]
      properties:
        name:
          description: The hashtag as written, without `#`.
          type: string
        url:
          description: The hashtag's page.
          type: string
          format: uri
    StatusText:
      description: The plain text; the server links mentions, hashtags, and URLs.
      type: string
      minLength: 1
    Visibility:
      description: |
        Who may see a status (ADR-0017): `public` everyone, listed on public timelines;
        `local` logged-in users of this instance and followers; `unlisted` everyone, kept off
        public timelines; `private` followers and mentioned accounts; `direct` mentioned
        accounts.
      type: string
      enum: [public, local, unlisted, private, direct]
    # --- end of statuses (#109) ---
    # --- The user's own profile and preferences (#113) ---
    AccountFieldSource:
      description: A metadata field of a profile as the user typed it.
      type: object
      required: [name, value]
      properties:
        name:
          description: The label, at most 255 characters.
          type: string
        value:
          description: The value as plain text, at most 255 characters.
          type: string
    AccountSource:
      description: The profile as the user typed it, for editing.
      type: object
      required: [note, fields]
      properties:
        note:
          description: The profile text as plain text; empty when there is none.
          type: string
        fields:
          description: The metadata fields as typed, in the order of the account's `fields`.
          type: array
          items:
            $ref: "#/components/schemas/AccountFieldSource"
        avatar_media_id:
          description: The media file of the avatar; omitted when there is none.
          type: string
        header_media_id:
          description: The media file of the header image; omitted when there is none.
          type: string
    CredentialAccount:
      description: The authenticated user's own account, with what only its owner sees.
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [discoverable, indexable, source, posting, permissions]
          properties:
            discoverable:
              description: Whether the account may be suggested to others and listed in directories.
              type: boolean
            indexable:
              description: Whether the account's public posts may be indexed for search.
              type: boolean
            source:
              $ref: "#/components/schemas/AccountSource"
            posting:
              $ref: "#/components/schemas/PostingLimits"
            permissions:
              description: |
                The permissions that the user's roles grant, which the admin operations need; empty
                for a user without roles. Clients show the admin screens by them; the server checks
                the permission of each admin operation regardless.
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    UpdateCredentialsRequest:
      description: A change of the profile; properties left out keep their current values.
      type: object
      properties:
        display_name:
          description: The display name, at most 30 characters; empty removes it.
          type: string
        note:
          description: The profile text as plain text, at most 500 characters; empty removes it.
          type: string
        fields:
          description: The metadata fields, replacing the current ones; at most 4.
          type: array
          items:
            $ref: "#/components/schemas/AccountFieldSource"
        avatar_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the avatar; empty
            removes the avatar.
          type: string
        header_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the header image;
            empty removes the header image.
          type: string
        locked:
          description: Whether follow requests need the user's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        discoverable:
          description: Whether the account may be suggested to others and listed in directories.
          type: boolean
        indexable:
          description: Whether the account's public posts may be indexed for search.
          type: boolean
    Preferences:
      description: The authenticated user's preferences.
      type: object
      required: [locale, time_zone, default_visibility, default_post_language, require_media_description, email_moderator_notifications, timeline_languages]
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name such as `Asia/Tokyo`.
          type: string
        default_visibility:
          $ref: "#/components/schemas/Visibility"
        default_post_language:
          description: The language of new posts that name none, a BCP 47 language tag; `und` when undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: |
            Whether the moderator notifications (`admin_report`, `admin_sign_up`) also come by
            email, to the primary address. Off for a new user.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, sorted; empty shows every language.
          type: array
          items:
            type: string
    UpdatePreferencesRequest:
      description: A change of the preferences; properties left out keep their current values.
      type: object
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name.
          type: string
        default_visibility:
          $ref: "#/components/schemas/Visibility"
        default_post_language:
          description: The language of new posts that name none; `und` for undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: Whether the moderator notifications also come by email.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, at most 64; empty shows every language.
          type: array
          maxItems: 64
          items:
            type: string
    # --- end profile and preferences ---
    # --- The viewer's posting limits (#207) ---
    PostingLimits:
      description: |
        What the account's current moderation restrictions let it post (data-model.md §5.4). The
        server applies the same policy when it posts: a status asked for with a visibility that is
        not in `visibilities` gets `visibility_ceiling` instead.
      type: object
      required: [visibility_ceiling, visibilities]
      properties:
        visibility_ceiling:
          $ref: "#/components/schemas/Visibility"
        visibilities:
          description: |
            The visibilities that a new status keeps as asked for, from the widest audience to the
            narrowest; every visibility while the account is not restricted.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Visibility"
    # --- end of the viewer's posting limits (#207) ---
    # --- admin (#261) ---
    AdminAvailabilityEvent:
      description: The time a remote server was marked unavailable or available again, and why.
      type: object
      required: [id, kind, reason, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [marked_unavailable, marked_available]
        reason:
          description: |
            `failure_days`: deliveries failed on 7 distinct days. `delivery_succeeded`: a delivery
            succeeded. `inbound_request`: the server sent a signed request. `probe_succeeded`: the
            daily probe fetched its NodeInfo. `operator`: an operator marked it.
          type: string
          enum: [failure_days, delivery_succeeded, inbound_request, probe_succeeded, operator]
        occurred_at:
          type: string
          format: date-time
    AdminAvailabilityEventPage:
      description: A page of availability events, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAvailabilityEvent"
    AdminDeadJob:
      description: A job that failed for good.
      type: object
      required: [id, type, payload, attempts, last_error, created_at, failed_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          description: The job type, such as `federation.deliver`.
          type: string
        payload:
          description: The job's payload, a JSON document as text.
          type: string
        idempotency_key:
          type: string
        ordering_key:
          type: string
        attempts:
          description: The number of runs the job had.
          type: integer
          minimum: 0
        last_error:
          description: Why the last run failed.
          type: string
        created_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
    AdminDeadJobPage:
      description: A page of dead jobs, most recently failed first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminDeadJob"
    AdminInstanceHealth:
      description: Whether deliveries go to a remote server (federation.md §7.3).
      type: object
      required: [domain, state, failure_days]
      properties:
        domain:
          type: string
        state:
          $ref: "#/components/schemas/AdminInstanceState"
        since:
          description: When the server entered its state; omitted for a server without failures.
          type: string
          format: date-time
        failure_days:
          description: The number of distinct UTC days of the latest run of failed deliveries.
          type: integer
          minimum: 0
        last_failure_day:
          description: The latest of those days; omitted without failures.
          type: string
          format: date
    AdminInstanceHealthPage:
      description: A page of server health, in domain order.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminInstanceHealth"
    AdminInstanceState:
      description: |
        `available` servers get every delivery; `unavailable` ones only `Follow`, `Accept`, and
        `Reject`.
      type: string
      enum: [available, unavailable]
    # --- end of admin (#261) ---
    # --- admin: audit log (#330) ---
    AdminAuditAction:
      description: |
        The kind of an audited operation, each on one kind of target. On an `account`:
        `account_action_issued`, `account_action_lifted`. On a `domain`:
        `domain_action_issued`, `domain_action_lifted`. On a `report`: `report_assigned`,
        `report_unassigned`, `report_resolved`. On a `user` (a registration):
        `registration_approved`, `registration_rejected`. On a `setting`: `setting_changed`
        (an instance setting), `text_changed` (an instance text in one locale). On a `rule`:
        `rule_added`, `rule_revised`, `rule_moved`, `rule_retired`.
      type: string
      enum:
        - account_action_issued
        - account_action_lifted
        - domain_action_issued
        - domain_action_lifted
        - report_assigned
        - report_unassigned
        - report_resolved
        - registration_approved
        - registration_rejected
        - setting_changed
        - text_changed
        - rule_added
        - rule_revised
        - rule_moved
        - rule_retired
    AdminAuditActorKind:
      description: |
        Who performed the operation. `user`: a signed-in moderator or administrator.
        `cli`: the `my` command line, which acts as no user. `system`: the server itself.
        `remote`: another server.
      type: string
      enum: [user, cli, system, remote]
    AdminAuditEntry:
      description: One operation of a moderator or an administrator (FR-704).
      type: object
      required: [id, actor_kind, action, target_kind, target_id, target_label, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        actor_kind:
          $ref: "#/components/schemas/AdminAuditActorKind"
        actor_account_id:
          description: |
            The local account of the user who performed the operation; omitted unless
            `actor_kind` is `user`, and when the user has no account.
          allOf:
            - $ref: "#/components/schemas/Id"
        actor_account:
          description: The account of `actor_account_id`; omitted when it is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        action:
          $ref: "#/components/schemas/AdminAuditAction"
        target_kind:
          $ref: "#/components/schemas/AdminAuditTargetKind"
        target_id:
          description: |
            The target: the ID of an account, a report, a user, or a rule, the domain of a domain
            action, or the key of a setting or a text.
          type: string
        target_label:
          description: |
            The target's display name when the operation happened, such as `@alice`,
            `@bob@example.com`, a domain, a setting's key, or a rule's text; up to 512
            characters.
          type: string
        source_event_id:
          description: |
            The ID of the record of the operation (the domain action, the assignment, the
            resolution, the decision, the revision), which holds its reasons and notes; omitted
            when the operation has none.
          type: string
        occurred_at:
          type: string
          format: date-time
    AdminAuditEntryPage:
      description: A page of the audit log, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAuditEntry"
    AdminAuditTargetKind:
      description: The kind of what an audited operation acted on.
      type: string
      enum: [account, status, domain, report, appeal, user, role, setting, rule, signup_block]
    # --- end of admin: audit log (#330) ---
    # --- admin: domain actions and reports (#296) ---
    AdminDomainAction:
      description: A moderation action on a remote domain and its subdomains (FR-702).
      type: object
      required: [id, domain, kind, obfuscate, state, issued_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        domain:
          description: The domain, in IDNA A-labels.
          type: string
        kind:
          $ref: "#/components/schemas/AdminDomainActionKind"
        public_comment:
          description: The reason that may be shown publicly; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        obfuscate:
          description: Whether a public list of the domain actions hides part of the domain.
          type: boolean
        state:
          $ref: "#/components/schemas/AdminDomainActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
    AdminDomainActionKind:
      description: |
        `suspend`: no federation with the domain at all. `limit`: its posts stay off the public
        timelines and its accounts reach only their followers. `reject_media`: its media are
        not fetched. `reject_reports`: its reports are dropped. `force_sensitive`: its media
        are marked sensitive.
      type: string
      enum: [limit, suspend, reject_media, reject_reports, force_sensitive]
    AdminDomainActionPage:
      description: A page of domain actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminDomainAction"
    AdminDomainActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum: [active, expired, lifted]
    AdminReport:
      description: A report of an account to the moderators (FR-701).
      type: object
      required: [id, category, comment, forwarded, filed_at, state, state_changed_at, reporter_account_id, target_account_id, status_ids, rule_ids]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        uri:
          description: |
            The `id` of the `Flag` activity that another server sent; omitted for a report
            made on this server.
          type: string
        category:
          type: string
          enum: [spam, legal, violation, other]
        comment:
          description: The reporter's comment as plain text, up to 5,000 characters.
          type: string
        forwarded:
          description: Whether the report was forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/AdminReportState"
        outcome:
          $ref: "#/components/schemas/AdminReportOutcome"
        state_changed_at:
          description: When the report was filed or, once resolved, resolved.
          type: string
          format: date-time
        assignee_account_id:
          description: |
            The account of the moderator who handles the report; omitted when nobody does.
          allOf:
            - $ref: "#/components/schemas/Id"
        reporter_account_id:
          $ref: "#/components/schemas/Id"
        reporter_account:
          description: The reporter, often the instance actor of a remote server; omitted when the account is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        target_account_id:
          $ref: "#/components/schemas/Id"
        target_account:
          description: The account reported; omitted when the account is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        status_ids:
          description: The IDs of the target's posts that the report points at.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        rule_ids:
          description: |
            The IDs of the instance rules that the report cites, retired ones included; only a
            report of the `violation` category cites rules.
          type: array
          items:
            $ref: "#/components/schemas/Id"
    AdminReportOutcome:
      description: |
        How the report was resolved, present only while it is resolved. `actioned`: a moderator
        took an action on the target. `dismissed`: there was nothing to act on.
      type: string
      enum: [actioned, dismissed]
    AdminReportPage:
      description: A page of reports, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminReport"
    AdminReportState:
      description: "`open` reports await the moderators; `resolved` ones are handled."
      type: string
      enum: [open, resolved]
    CreateDomainActionRequest:
      description: A moderation action to take on a domain.
      type: object
      required: [domain, kind]
      properties:
        domain:
          description: |
            The remote domain, such as `spam.example`; a U-label spelling such as `例え.jp` is
            accepted. The action covers its subdomains.
          type: string
          minLength: 1
          maxLength: 253
        kind:
          $ref: "#/components/schemas/AdminDomainActionKind"
        public_comment:
          type: string
          maxLength: 5000
        private_note:
          type: string
          maxLength: 5000
        obfuscate:
          type: boolean
          default: false
        expires_in:
          description: The seconds the action lasts; omitted, it lasts until it is lifted.
          type: integer
          minimum: 1
    ResolveReportRequest:
      description: How a report is resolved.
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/AdminReportOutcome"
    # --- end of admin: domain actions and reports (#296) ---
    # --- admin: account actions (#316) ---
    AdminAccountAction:
      description: A moderation action on an account (FR-703).
      type: object
      required: [id, account_id, kind, reason_category, issuer, notify_target, state, issued_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        account_id:
          description: The account the action is on.
          allOf:
            - $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        reason_category:
          $ref: "#/components/schemas/AdminAccountActionCategory"
        public_reason:
          description: The reason shown to the account; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        report_id:
          description: The report the action follows from; omitted when there is none.
          allOf:
            - $ref: "#/components/schemas/Id"
        issuer:
          description: |
            `moderator`: a moderator or the CLI. `system`: this server by itself. `remote`: the
            account's own server.
          type: string
          enum: [moderator, system, remote]
        issued_by_account_id:
          description: |
            The account of the moderator who took the action; omitted for the CLI and the
            system.
          allOf:
            - $ref: "#/components/schemas/Id"
        notify_target:
          description: Whether the account is told of the action.
          type: boolean
        state:
          $ref: "#/components/schemas/AdminAccountActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
        lift_reason:
          description: Why the action was lifted; omitted until it is or when no reason was given.
          type: string
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on, in ID order; omitted for the other kinds.
          type: array
          items:
            $ref: "#/components/schemas/Id"
    AdminAccountActionCategory:
      description: The kind of reason for an action.
      type: string
      enum: [spam, legal, violation, other]
    AdminAccountActionKind:
      description: |
        `warn`: a notice only. `mark_statuses_sensitive` and `delete_statuses`: actions on
        posts. `force_sensitive`: every attachment is shown as sensitive. `limit`: every post is
        followers-only and stays off the public timelines. `restrict_posting`: no posting.
        `restrict_interaction`: no following, favouriting, boosting, or replying.
        `disable_login`: no logging in. `suspend`: all of these, and the profile and posts are
        hidden. `ban`: a suspension that never ends, with the deletion of the account.
      type: string
      enum:
        - warn
        - mark_statuses_sensitive
        - delete_statuses
        - force_sensitive
        - limit
        - restrict_posting
        - restrict_interaction
        - disable_login
        - suspend
        - ban
    AdminAccountActionPage:
      description: A page of account actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAccountAction"
    AdminAccountActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum: [active, expired, lifted]
    CreateAccountActionRequest:
      description: A moderation action to take on an account.
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        reason_category:
          allOf:
            - $ref: "#/components/schemas/AdminAccountActionCategory"
          default: other
        public_reason:
          description: The reason shown to the account.
          type: string
          maxLength: 5000
        private_note:
          description: A note for the moderators only.
          type: string
          maxLength: 5000
        report_id:
          description: The report of the account that the action follows from.
          allOf:
            - $ref: "#/components/schemas/Id"
        notify_target:
          description: Whether a local account is told of the action; ignored for a remote one.
          type: boolean
          default: true
        expires_in:
          description: |
            The seconds the action lasts; omitted, it lasts until it is lifted. A `ban` and the
            actions on posts take none.
          type: integer
          minimum: 1
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on; required for them and taken by no other kind.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
    LiftAccountActionRequest:
      description: Why an action on an account is lifted.
      type: object
      properties:
        reason:
          type: string
          maxLength: 5000
    # --- end of admin: account actions (#316) ---
    # --- the viewer's permissions (#267) ---
    Permission:
      description: |
        A capability that a role grants. `manage_accounts`: the moderation actions on accounts.
        `manage_domains`: the health of remote servers and the moderation actions on domains.
        `manage_reports`: the reports. `manage_rules`: the instance rules. `manage_jobs`: the
        dead jobs of the job queue. The others guard no client API operation yet.
      type: string
      enum:
        - manage_reports
        - manage_accounts
        - manage_domains
        - manage_rules
        - manage_settings
        - manage_roles
        - manage_invites
        - view_audit
        - manage_jobs
    # --- end of the viewer's permissions (#267) ---
    # --- admin: instance rules (#331) ---
    AdminRule:
      description: |
        A rule of the instance (FR-705) with its texts in every locale. Its ID stays the same
        across revisions, so reports keep citing it.
      type: object
      required: [id, position, texts, created_at, revised_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        position:
          description: |
            The sort key of the rule; the rules in effect are listed by it. Retiring a rule
            leaves a gap until the next move.
          type: integer
          minimum: 1
        texts:
          description: The texts by locale.
          type: array
          items:
            $ref: "#/components/schemas/AdminRuleText"
        created_at:
          type: string
          format: date-time
        revised_at:
          description: When the current revision was recorded.
          type: string
          format: date-time
        retired_at:
          description: When the rule was retired; omitted for a rule in effect.
          type: string
          format: date-time
    AdminRuleList:
      description: The rules.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRule"
    AdminRuleText:
      description: The text of a rule in one locale.
      type: object
      required: [locale, text]
      properties:
        locale:
          description: The BCP 47 tag of the locale, canonical (`ja-JP`).
          type: string
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
    InstanceRuleInput:
      description: The texts of a rule.
      type: object
      required: [texts]
      properties:
        texts:
          description: The rule in each locale, at least one; they replace every earlier text.
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/InstanceRuleTextInput"
    InstanceRuleTextInput:
      description: The text of a rule in one locale.
      type: object
      required: [locale, text]
      properties:
        locale:
          description: A BCP 47 tag; it is canonicalized (`ja_jp` becomes `ja-JP`).
          type: string
          minLength: 1
          maxLength: 64
        text:
          description: The rule, on one line, as plain text.
          type: string
          minLength: 1
          maxLength: 300
        hint:
          description: An explanation of the rule, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    MoveInstanceRuleRequest:
      description: The new place of a rule.
      type: object
      required: [position]
      properties:
        position:
          description: The place among the rules in effect, from 1.
          type: integer
          minimum: 1
    # --- end of admin: instance rules (#331) ---
    # --- admin: moderator counts (#338) ---
    AdminCounts:
      description: What awaits the moderators; a count whose permission the user lacks is omitted.
      type: object
      properties:
        open_reports:
          description: The reports that are open. Needs `manage_reports`.
          type: integer
          format: int64
          minimum: 0
        pending_registrations:
          description: The registrations that await approval. Needs `manage_accounts`.
          type: integer
          format: int64
          minimum: 0
    # --- end of admin: moderator counts (#338) ---
    # --- admin: registrations (#345) ---
    AdminRegistration:
      description: A user's registration as the moderators review it (FR-721).
      type: object
      required: [user_id, state, since, email, email_verified, submitted_at]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        account_id:
          description: The user's local account; omitted when it is gone.
          allOf:
            - $ref: "#/components/schemas/Id"
        username:
          description: The username of the user's local account; omitted when it is gone.
          type: string
        state:
          $ref: "#/components/schemas/RegistrationState"
        since:
          description: When the registration entered its state.
          type: string
          format: date-time
        email:
          description: The user's primary email address; empty when there is none.
          type: string
        email_verified:
          description: Whether the user confirmed the email address.
          type: boolean
        reason:
          description: Why the user wants to join, as plain text; omitted when they gave none.
          type: string
        invite_id:
          description: The invite the user signed up with; omitted for none.
          allOf:
            - $ref: "#/components/schemas/Id"
        submitted_at:
          description: When the user signed up.
          type: string
          format: date-time
    AdminRegistrationPage:
      description: A page of registrations, longest in their state first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminRegistration"
    RegistrationDecisionRequest:
      description: A moderator's decision on a registration.
      type: object
      properties:
        note:
          description: A note for the moderators, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    RegistrationState:
      description: |
        Where a registration stands: `pending` waits for a moderator, `approved` lets the user
        sign in, and `rejected` keeps them out.
      type: string
      enum: [pending, approved, rejected]
    # --- end of admin: registrations (#345) ---
    # --- reports (#332) ---
    CreateReportRequest:
      description: A report of an account to the moderators.
      type: object
      required: [account_id, category]
      properties:
        account_id:
          description: The account reported, local or remote.
          allOf:
            - $ref: "#/components/schemas/Id"
        status_ids:
          description: Posts of the account that the user can see, up to 20.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        category:
          $ref: "#/components/schemas/ReportCategory"
        rule_ids:
          description: |
            Instance rules in effect that the account broke, up to 20; only with the
            `violation` category.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        comment:
          description: A comment for the moderators as plain text.
          type: string
          maxLength: 1000
        forward:
          description: |
            Asks to forward the report to the server of a remote account, without naming the
            reporter. It means nothing for a local account.
          type: boolean
          default: false
    Report:
      description: |
        A report that the user filed. It never names the reporter, and tells only whether the
        moderators resolved it, never how.
      type: object
      required: [id, category, comment, forwarded, filed_at, target_account, status_ids, rule_ids, state]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        category:
          $ref: "#/components/schemas/ReportCategory"
        comment:
          description: The comment as plain text.
          type: string
        forwarded:
          description: Whether the report is to be forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        target_account:
          $ref: "#/components/schemas/Account"
        status_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        rule_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/ReportState"
    ReportCategory:
      description: |
        Why the account is reported. `spam`: spam or unwanted promotion. `legal`: content that
        is illegal. `violation`: it breaks the instance rules that `rule_ids` cite. `other`:
        anything else.
      type: string
      enum: [spam, legal, violation, other]
    ReportPage:
      description: A page of the user's reports, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Report"
    ReportState:
      description: |
        `open`: the report awaits the moderators. `resolved`: the moderators handled it.
      type: string
      enum: [open, resolved]
    # --- end of reports (#332) ---
