name: Web E2E

# Playwright E2E of the web client (ADR-0015, ADR-0027), called by ci.yml on every PR with the per-PR subset
# and by nightly.yml with the full width × locale matrix (app/web/playwright.config.ts).

on:
  workflow_call:
    inputs:
      matrix:
        description: "`pr` for the per-PR subset, `full` for every width × locale project."
        type: string
        required: true

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    # The official Playwright image, pinned by digest, provides the browsers and their system libraries.
    # Its tag must match @playwright/test in app/web/package.json, and it must equal PLAYWRIGHT_IMAGE in the Makefile
    # (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      E2E_MATRIX: ${{ inputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      # The image has neither make nor the unzip that setup-bun extracts Bun with.
      - name: Install make and unzip
        run: apt-get update && apt-get install -y --no-install-recommends make unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-e2e-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-e2e-${{ runner.os }}-
      - name: make web-e2e
        run: make web-e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.matrix }}
          path: |
            app/web/playwright-report/
            app/web/test-results/
          retention-days: 7
