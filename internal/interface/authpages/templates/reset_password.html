{{define "content"}}
<h1>{{.L.ServerAuthResetPasswordTitle}}</h1>
<p>{{.L.ServerAuthResetPasswordPrompt}}</p>
{{if .Error}}<p id="reset-password-error" class="alert" role="alert">{{.Error}}</p>{{end}}
<form class="form" method="post" action="/auth/reset_password">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<input type="hidden" name="token" value="{{.Token}}">
{{with .NewPassword}}<div class="field">
<label for="reset-password-password">{{$.L.ServerAuthResetPasswordPasswordLabel}}</label>
<p id="reset-password-password-hint" class="hint">{{.Hint}}</p>
{{with .Error}}<p id="reset-password-password-error" class="field-error">{{.}}</p>{{end}}
<input id="reset-password-password" name="password" type="password" autocomplete="new-password" required minlength="{{.Min}}" maxlength="{{.Max}}" aria-describedby="reset-password-password-hint{{if .Error}} reset-password-password-error{{end}}"{{if .Error}} aria-invalid="true"{{end}}>
</div>{{end}}
<div class="actions">
<button class="button" type="submit">{{.L.ServerAuthResetPasswordSubmit}}</button>
</div>
</form>
{{end}}
