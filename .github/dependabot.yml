#
# Dependabot version updates (ADR-0046). Security alerts come from the repository's Dependabot Alerts.
# The 14-day cooldown matches the rule that no dependency version younger than two weeks is installed
# (app/bunfig.toml, tools/i18n/bunfig.toml). Cooldown applies to version updates only, so security updates
# still open immediately.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # Bun workspaces with a text bun.lock.
  - package-ecosystem: bun
    directories:
      - /app
      - /tools/i18n
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Babel only hosts babel-plugin-react-compiler (ADR-0025), whose releases depend on Babel 7
      # (@babel/types ^7); a Babel major update waits for a compiler release that supports it.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
  # Workflows pin every action, GitHub's own included, to a release's commit SHA with the full version in a
  # trailing comment (`uses: owner/repo@<sha> # vX.Y.Z`): a moving major tag can point at a release younger
  # than two weeks, and Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # The Go, Node.js, and Bun image tags in the Dockerfile must match .tool-versions (make docker-check).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
