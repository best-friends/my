#
# sqlc configuration (ADR-0003). The sqlc version is pinned in tools/go.mod. Regenerate with
# `scripts/task.sh go:sqlc`; `scripts/task.sh go:sqlc-check` (part of `scripts/task.sh check`) fails when the committed code is stale.
#
# Product queries live in queries/<dialect>/*.sql, read schema/<dialect>.sql, and generate into
# internal/adapter/db/<dialect>/<dialect>gen. Comments above a query become the doc comment of
# its generated method.
#
# The queue entries generate the queries of the database job queue (internal/adapter/queue/db)
# from queries/<dialect>/queue/*.sql into internal/adapter/queue/db/internal/<dialect>queue.
#
# Keep query files ASCII-only: the sqlite engine of sqlc miscounts byte offsets after a
# multi-byte character, which cuts generated queries short or rejects sqlc.arg / @name rewrites.
version: "2"
sql:
  - name: sqlite
    engine: sqlite
    schema: schema/sqlite.sql
    queries: queries/sqlite
    gen:
      go:
        package: sqlitegen
        out: internal/adapter/db/sqlite/sqlitegen
        emit_empty_slices: true
        omit_unused_structs: true
  - name: postgres
    engine: postgresql
    schema: schema/postgres.sql
    queries: queries/postgres
    gen:
      go:
        package: postgresgen
        out: internal/adapter/db/postgres/postgresgen
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - name: sqlite-queue
    engine: sqlite
    schema: schema/sqlite.sql
    queries: queries/sqlite/queue
    gen:
      go:
        package: sqlitequeue
        out: internal/adapter/queue/db/internal/sqlitequeue
        emit_empty_slices: true
        omit_unused_structs: true
  - name: postgres-queue
    engine: postgresql
    schema: schema/postgres.sql
    queries: queries/postgres/queue
    gen:
      go:
        package: postgresqueue
        out: internal/adapter/queue/db/internal/postgresqueue
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
  - name: sqlite-kv
    engine: sqlite
    schema: schema/sqlite.sql
    queries: queries/sqlite/kv
    gen:
      go:
        package: sqlitekv
        out: internal/adapter/kv/db/internal/sqlitekv
        emit_empty_slices: true
        omit_unused_structs: true
  - name: postgres-kv
    engine: postgresql
    schema: schema/postgres.sql
    queries: queries/postgres/kv
    gen:
      go:
        package: postgreskv
        out: internal/adapter/kv/db/internal/postgreskv
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
