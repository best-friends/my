name: CI

# The entry of the pull request and merge queue checks (ADR-0047): `changes` selects the contexts of `make check` the
# change touches, one job per context calls that context's reusable workflow (ctx-<context>.yml), and `check`
# collects their results into the single required status check. The workflow has no path filter, so it always runs
# and `check` always reports. Pushes to main run main.yml instead.

on:
  pull_request:
  # The merge queue of main runs the same required `check` on each merge group before it merges the group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its run. Each merge group has a ref of its own (gh-readonly-queue/main/...) and is
  # never cancelled here: the merge queue replaces the groups it rebuilds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `make check` split by context (scripts/changed-contexts.sh): a context's job runs only when the pull request or
  # the merge group touches that context or one it depends on. A change to shared configuration runs them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.contexts.outputs.docs }}
      go: ${{ steps.contexts.outputs.go }}
      i18n: ${{ steps.contexts.outputs.i18n }}
      api: ${{ steps.contexts.outputs.api }}
      ui: ${{ steps.contexts.outputs.ui }}
      web: ${{ steps.contexts.outputs.web }}
      docker: ${{ steps.contexts.outputs.docker }}
      shell: ${{ steps.contexts.outputs.shell }}
      schema: ${{ steps.contexts.outputs.schema }}
      smoke: ${{ steps.contexts.outputs.smoke }}
      # The input `scope` of the ctx-*.yml: `queue` in the merge queue, `pr` on pull requests.
      scope: ${{ github.event_name == 'merge_group' && 'queue' || 'pr' }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch. A merge group checks out
      # its head commit and compares it with its base, the main commit the group is built on; that base is fetched by
      # SHA because a group queued behind others is several commits ahead of it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select the contexts the change touches
        id: contexts
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            contexts="$(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed")"
          else
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$RUNNER_TEMP/changed"
            contexts="$(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed")"
          fi
          echo "contexts: ${contexts//$'\n'/ }"
          for c in docs go i18n api ui web docker shell schema; do
            if grep -qx "$c" <<< "$contexts"; then echo "$c=true"; else echo "$c=false"; fi >> "$GITHUB_OUTPUT"
          done
          # The Docker smoke test runs on a change to the docker context and on one to cmd/ or internal/platform/,
          # which load the configuration and assemble the server the images start (ADR-0047). changed-contexts.sh
          # puts those two in the go context, so their paths are matched here.
          if grep -qx docker <<< "$contexts" || grep -qE '^(cmd|internal/platform)/' "$RUNNER_TEMP/changed"; then
            echo smoke=true
          else
            echo smoke=false
          fi >> "$GITHUB_OUTPUT"

  # One job per context, each calling the context's reusable workflow. A job whose `if` is false is skipped, and
  # `check` counts a skipped job as passed. Inside a called workflow `github` is this workflow's context (so
  # github.event_name is this run's event), but this workflow's `env` does not reach it: the ctx-*.yml set their own.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/ctx-docs.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/ctx-go.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  i18n:
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    uses: ./.github/workflows/ctx-i18n.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ctx-api.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  web:
    # The ui context (ui-check and the ui-test story tests) and the web context (web-check).
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ctx-web.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
      ui: ${{ needs.changes.outputs.ui == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}

  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    uses: ./.github/workflows/ctx-schema.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  docker:
    # docker-check and the linux/arm64 image builds on a change to the docker context, and on pull requests the
    # Docker smoke test on a change to the docker context, cmd/, or internal/platform/ (ADR-0047). The merge queue
    # runs only docker-check (ctx-docker.yml), so there the job runs only on a change to the docker context.
    needs: changes
    if: >-
      needs.changes.outputs.docker == 'true' ||
      (needs.changes.outputs.scope == 'pr' && needs.changes.outputs.smoke == 'true')
    uses: ./.github/workflows/ctx-docker.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}
      check: ${{ needs.changes.outputs.docker == 'true' }}
      smoke: ${{ needs.changes.outputs.smoke == 'true' }}
      arm64: ${{ needs.changes.outputs.docker == 'true' }}

  shell:
    # shellcheck is a pull request check only (ctx-shell.yml); the merge queue does not call the workflow at all.
    needs: changes
    if: needs.changes.outputs.shell == 'true' && needs.changes.outputs.scope == 'pr'
    uses: ./.github/workflows/ctx-shell.yml
    with:
      scope: ${{ needs.changes.outputs.scope }}

  check:
    # The required status check of the protect-main ruleset, on pull requests and merge groups: it passes only when
    # every context job above passed, or was skipped because the change does not touch its context. A job that calls
    # a reusable workflow fails when one of the called jobs fails, so a failed schema, ui-test, docker-smoke, or
    # docker-arm64 job fails `check`. `always()` makes it report a result even when every other job is skipped, so
    # neither a pull request nor a merge group waits on it.
    if: always()
    needs: [changes, docs, go, i18n, api, web, schema, docker, shell]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a check job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null
