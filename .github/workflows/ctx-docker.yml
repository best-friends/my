name: "Context: docker"

# The docker context of `make check` (scripts/changed-contexts.sh): the Dockerfile image version check
# (make docker-check), the Docker Compose smoke test (linux/amd64), and the linux/arm64 image builds. Called by
# ci.yml, main.yml, and nightly.yml, with the inputs `check`, `smoke`, and `arm64` selecting the jobs, and runnable
# by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips the smoke test and the arm64 builds."
        type: string
        default: pr
      check:
        description: Run make docker-check.
        type: boolean
        default: true
      smoke:
        description: Run the Docker Compose smoke test.
        type: boolean
        default: true
      arm64:
        description: Build the images for linux/arm64.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips the smoke test and the arm64 builds."
        type: choice
        options: [pr, queue]
        default: pr
      check:
        description: Run make docker-check.
        type: boolean
        default: true
      smoke:
        description: Run the Docker Compose smoke test.
        type: boolean
        default: true
      arm64:
        description: Build the images for linux/arm64.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  docker:
    if: inputs.check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make docker-check
        run: make docker-check

  docker-smoke:
    # Build the images and run deploy/docker/compose.yaml end to end: schema apply, server start, admin creation,
    # then WebFinger, Actor, and NodeInfo (scripts/docker-smoke.sh dumps the logs on failure and always tears down).
    # The merge queue skips it: a change that breaks the images is stopped on its pull request, and the rare break
    # from stacking two of them is found after the merge (ADR-0047).
    if: inputs.smoke && inputs.scope == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Smoke-test the Docker Compose setup
        run: make docker-smoke

  docker-arm64:
    # The smoke test covers linux/amd64; build both images for linux/arm64 too (ADR-0010) under QEMU. The Go server
    # cross-builds with CGO_ENABLED=0, so only a change to the Dockerfile or the deployments makes the arm64 images
    # differ: ci.yml runs it on a change to the docker context and nightly.yml every night (ADR-0047).
    if: inputs.arm64 && inputs.scope == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build the images for linux/arm64
        run: |
          docker build --platform linux/arm64 --target schema .
          docker build --platform linux/arm64 --target app .
