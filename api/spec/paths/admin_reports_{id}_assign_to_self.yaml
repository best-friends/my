# SPDX-License-Identifier: AGPL-3.0-only
post:
  operationId: assignReportToSelf
  summary: Take a report
  description: |
    Makes the authenticated user the moderator who handles the report. An unknown ID is a
    404. Needs the `manage_reports` permission.
  tags: [admin-moderation]
  security:
    - oauth2: ["admin:write"]
  parameters:
    - $ref: ../components/parameters/ReportId.yaml
  responses:
    "200":
      $ref: ../components/responses/AdminReportDetail.yaml
    default:
      $ref: ../components/responses/Problem.yaml
