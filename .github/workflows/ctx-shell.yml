name: "Context: shell"

# The shell context of `make check` (scripts/changed-contexts.sh): shellcheck on scripts/*.sh (make lint-shell).
# Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips shellcheck."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips shellcheck."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

jobs:
  shell:
    # shellcheck is decided file by file, so the merge queue skips it (ADR-0047).
    if: inputs.scope == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: make lint-shell
