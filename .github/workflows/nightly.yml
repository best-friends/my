name: Nightly

# The slow suite (slow-suite.yml, ADR-0079) on the head of main every night, so that a regression in the checks too
# slow for the merge queue is found within a day. A scheduled run is skipped when main has not moved since the last
# successful Nightly run; a run by hand always runs the suite (`gh workflow run nightly.yml`).

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      # A skipped run succeeds with the same head, so the comparison holds until main moves.
      - name: Compare main with the last successful run
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "main ($HEAD_SHA) has not moved since the last successful run: skipping the slow suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last successful run: ${last:-none}; main: $HEAD_SHA."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  slow-suite:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/slow-suite.yml
    # The permissions of slow-suite.yml's CodeQL job.
    permissions:
      actions: read
      contents: read
      security-events: write
