name: "Context: agentkit"

# The agentkit context of `make check` (scripts/changed-contexts.sh): tools/agentkit, the context and workflow
# tools for coding agents (go mod tidy, vet, golangci-lint, tests, its dependencies against go.sum), and its
# context map, which must cover every path, so every change runs it (make agentkit-check).
# Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  agentkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Cache the Go modules and builds of tools/agentkit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-agentkit-${{ runner.os }}-${{ hashFiles('tools/agentkit/go.sum') }}
          restore-keys: |
            go-agentkit-${{ runner.os }}-
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
          install-only: true
      - name: make agentkit-check
        run: make agentkit-check
