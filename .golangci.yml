# golangci-lint v2 configuration. The golangci-lint version is pinned in .tool-versions.
version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    # Architecture boundaries (ADR-0002, docs/architecture/overview.md §2 and §6).
    # A file matched by several rules must satisfy all of them.
    # - domain/<module>: standard library and its own module's domain only.
    # - app/<module>: standard library, its own module's domain, any module's app package
    #   (the public API through which modules reach each other), and internal/i18n.
    # - i18n: a leaf library (message formatting, ADR-0009) usable from app and interface code;
    #   it imports only the standard library, the embedded catalogs, and its MessageFormat engine.
    # - interface/*, adapter/*, pkg/testkit: anything except the layers listed under deny.
    # - platform and cmd: anything (composition root). Nothing imports cmd.
    # Third-party packages for domain/app must be added to the allow list explicitly.
    depguard:
      rules:
        no-cmd:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/best-friends/my/cmd
              desc: entrypoints are leaves; move shared code into internal/platform
        domain-identity:
          list-mode: strict
          files:
            - "**/internal/domain/identity/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/identity
        app-identity:
          list-mode: strict
          files:
            - "**/internal/app/identity/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/identity
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
            # Argon2id password hashing (ADR-0019 §3): a pure-Go algorithm, not an external resource.
            - golang.org/x/crypto/argon2
            # BCP 47 tag parsing and canonicalization for preferences (ADR-0009): pure-Go data, not an external resource.
            - golang.org/x/text/language
        domain-account:
          list-mode: strict
          files:
            - "**/internal/domain/account/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/account
        app-account:
          list-mode: strict
          files:
            - "**/internal/app/account/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/account
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-content:
          list-mode: strict
          files:
            - "**/internal/domain/content/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/content
        app-content:
          list-mode: strict
          files:
            - "**/internal/app/content/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/content
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
            # NFKC normalization of hashtags (data-model §4.4, tags.name_normalized): pure-Go Unicode data, not an external resource.
            - golang.org/x/text/unicode/norm
        domain-graph:
          list-mode: strict
          files:
            - "**/internal/domain/graph/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/graph
        app-graph:
          list-mode: strict
          files:
            - "**/internal/app/graph/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/graph
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-timeline:
          list-mode: strict
          files:
            - "**/internal/domain/timeline/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/timeline
        app-timeline:
          list-mode: strict
          files:
            - "**/internal/app/timeline/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/timeline
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-notification:
          list-mode: strict
          files:
            - "**/internal/domain/notification/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/notification
        app-notification:
          list-mode: strict
          files:
            - "**/internal/app/notification/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/notification
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-federation:
          list-mode: strict
          files:
            - "**/internal/domain/federation/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/federation
        app-federation:
          list-mode: strict
          files:
            - "**/internal/app/federation/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/federation
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-moderation:
          list-mode: strict
          files:
            - "**/internal/domain/moderation/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/moderation
        app-moderation:
          list-mode: strict
          files:
            - "**/internal/app/moderation/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/moderation
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        domain-instance:
          list-mode: strict
          files:
            - "**/internal/domain/instance/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/instance
        app-instance:
          list-mode: strict
          files:
            - "**/internal/app/instance/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/domain/instance
            - github.com/best-friends/my/internal/app
            - github.com/best-friends/my/internal/i18n
        # app/kernel holds the ports and helpers shared by every module (Clock, IDGenerator, KeyManager);
        # it depends on nothing in the repository so that any module can import it.
        app-kernel:
          list-mode: strict
          files:
            - "**/internal/app/kernel/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/kernel
        # app/uow holds the UnitOfWork port, its retry loop, and the synchronous projector registry
        # shared by every module and database adapter; like kernel, it depends on nothing in the repository.
        app-uow:
          list-mode: strict
          files:
            - "**/internal/app/uow/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/uow
        # app/queue holds the job queue ports, the handler registry, the retry policy, and the pull
        # runner shared by every module and queue adapter; it depends only on kernel and uow.
        app-queue:
          list-mode: strict
          files:
            - "**/internal/app/queue/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/queue
            - github.com/best-friends/my/internal/app/kernel
            - github.com/best-friends/my/internal/app/uow
        # app/stream holds the ports of the real-time updates (Publisher / Subscriber) and the
        # in-process broker shared by the modules that publish and the streaming endpoint; like
        # uow, it depends on nothing in the repository.
        app-stream:
          list-mode: strict
          files:
            - "**/internal/app/stream/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/stream
        # app/blob (BlobStore) and app/media (MediaProcessor) hold ports shared by every module that
        # keeps files and by their adapters; like kernel, they depend on nothing in the repository.
        app-blob:
          list-mode: strict
          files:
            - "**/internal/app/blob/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/blob
        app-media:
          list-mode: strict
          files:
            - "**/internal/app/media/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/app/media
        i18n:
          list-mode: strict
          files:
            - "**/internal/i18n/**"
          allow:
            - $gostd
            - github.com/best-friends/my/internal/i18n
            - github.com/best-friends/my/locales
            - github.com/kaptinlin/messageformat-go/mf1
        # bluemonday is the remote HTML sanitizer (ADR-0019 §2); it stays inside the adapter of
        # kernel.HTMLSanitizer so that every caller goes through the port and its policy version.
        bluemonday:
          list-mode: lax
          files:
            - $all
            - "!**/internal/adapter/htmlsanitizer/**"
          deny:
            - pkg: github.com/microcosm-cc/bluemonday
              desc: sanitize HTML through kernel.HTMLSanitizer (internal/adapter/htmlsanitizer)
        interface:
          list-mode: lax
          files:
            - "**/internal/interface/**"
            - "!$test"
          deny:
            - pkg: github.com/best-friends/my/internal/adapter
              desc: interface code reaches adapters only through application ports
            - pkg: github.com/best-friends/my/internal/platform
              desc: only cmd imports the composition root
            - pkg: github.com/best-friends/my/pkg/testkit
              desc: testkit is for adapter contract tests
        interface-tests:
          # Tests may use pkg/testkit fakes (clock, IDs, fixtures); production interface code may not.
          list-mode: lax
          files:
            - "**/internal/interface/**/*_test.go"
          deny:
            - pkg: github.com/best-friends/my/internal/adapter
              desc: interface tests reach adapters only through application ports
            - pkg: github.com/best-friends/my/internal/platform
              desc: only cmd imports the composition root
        adapter:
          list-mode: lax
          files:
            - "**/internal/adapter/**"
          deny:
            - pkg: github.com/best-friends/my/internal/interface
              desc: adapters implement application ports and never call inbound interfaces
            - pkg: github.com/best-friends/my/internal/platform
              desc: only cmd imports the composition root
        testkit:
          list-mode: lax
          files:
            - "**/pkg/testkit/**"
          deny:
            - pkg: github.com/best-friends/my/internal/interface
              desc: testkit depends only on application ports and domain types
            - pkg: github.com/best-friends/my/internal/adapter
              desc: testkit depends only on application ports and domain types
            - pkg: github.com/best-friends/my/internal/platform
              desc: testkit depends only on application ports and domain types
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/best-friends/my
  exclusions:
    generated: lax
