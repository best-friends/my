#
# sqlc configuration (ADR-0003): one entry per dialect. The sqlc version is pinned in
# tools/go.mod. Regenerate with `make sqlc`; `make sqlc-check` (part of `make check`) fails
# when the committed code is stale.
#
# Queries live in queries/<dialect>/*.sql, read schema/<dialect>.sql, and generate into
# internal/adapter/db/<dialect>/<dialect>gen. Keep query files ASCII: the SQLite engine of sqlc
# miscounts byte offsets after a non-ASCII character and cuts the generated queries short.
# Comments above a query become the doc comment of its generated method.
version: "2"
sql:
  - name: sqlite
    engine: sqlite
    schema: schema/sqlite.sql
    queries: queries/sqlite
    gen:
      go:
        package: sqlitegen
        out: internal/adapter/db/sqlite/sqlitegen
        emit_empty_slices: true
  - name: postgres
    engine: postgresql
    schema: schema/postgres.sql
    queries: queries/postgres
    gen:
      go:
        package: postgresgen
        out: internal/adapter/db/postgres/postgresgen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
