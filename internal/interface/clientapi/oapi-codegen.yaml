#
# oapi-codegen (pinned in tools/go.mod) generates the strict net/http server of api/openapi.yaml
# into api.gen.go (ADR-0029). Run `make generate` (scripts/generate.sh); never edit api.gen.go by hand.
package: clientapi
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  skip-prune: true
compatibility:
  # Enum constants are named <Type><Value> (StatusVisibilityPublic), so that the values of
  # different enums never collide or get renamed when another enum is added.
  always-prefix-enum-values: true
