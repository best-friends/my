name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its run; every main commit runs to the end (ADR-0040).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  # `make check` split by context (scripts/changed-contexts.sh): a context's job runs only when the pull request
  # touches that context or one it depends on. A change to shared configuration and every push to main run them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.contexts.outputs.docs }}
      go: ${{ steps.contexts.outputs.go }}
      i18n: ${{ steps.contexts.outputs.i18n }}
      api: ${{ steps.contexts.outputs.api }}
      ui: ${{ steps.contexts.outputs.ui }}
      web: ${{ steps.contexts.outputs.web }}
      docker: ${{ steps.contexts.outputs.docker }}
      shell: ${{ steps.contexts.outputs.shell }}
      schema: ${{ steps.contexts.outputs.schema }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Select the contexts the change touches
        id: contexts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            contexts="$(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed")"
          else
            contexts="$(scripts/changed-contexts.sh --all)"
          fi
          echo "contexts:" $contexts
          for c in docs go i18n api ui web docker shell schema; do
            if grep -qx "$c" <<< "$contexts"; then echo "$c=true"; else echo "$c=false"; fi >> "$GITHUB_OUTPUT"
          done

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: make docs-check
        run: make docs-check

  go:
    # go-check except go-test (the go-test job), and govulncheck.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-go's own cache is keyed on go.sum alone and never refreshed. This one is saved on every push to main
      # and restored by pull requests, so the build and go test results of unchanged packages stay cached.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-lint-${{ runner.os }}-
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # The official action installs the prebuilt binary, caches lint results and annotates the PR.
      # It also puts golangci-lint on PATH, so `make go-lint` reuses the binary and the cache.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
      - name: make go-check (except go-test)
        run: make go-mod-check go-vet go-lint go-build go-licenses sqlc-check
      - name: govulncheck
        run: make go-vuln
      - name: Save the Go module and build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0041); the postgres-contract
    # job runs them on a real postgres container on pushes to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same cache as the go job's, of the test builds and results.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-test-${{ runner.os }}-
      - name: make go-test
        run: make go-test
      - name: Save the Go module and build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}

  i18n:
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: make i18n-check
        run: make i18n-check

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # openapi-typescript runs on Node.js (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      # oapi-codegen and securitygen are Go: restore the go job's cache from main, without saving one.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-lint-${{ runner.os }}-
      - name: make api-check
        run: make api-check

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: make ui-check
        run: make ui-check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vite and Vitest run on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: make web-check
        run: make web-check

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make docker-check
        run: make docker-check

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: make lint-shell

  check:
    # The required status check of the protect-main ruleset: it passes only when every job above passed, or was
    # skipped because the change does not touch its context.
    if: always()
    needs: [changes, docs, go, go-test, i18n, api, ui, web, docker, shell]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a check job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null

  schema:
    # Apply each dialect's desired-state schema to an empty database and require an empty diff afterwards (ADR-0023).
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    env:
      DB_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Atlas Community Edition (pinned in scripts/install-atlas.sh)
        run: make atlas
      - name: Start PostgreSQL
        if: matrix.dialect == 'postgres'
        run: make db-up
      - name: Apply the schema to an empty database and check for drift
        run: make db-check

  postgres-contract:
    # The PostgreSQL tests on a real postgres container instead of pgmem, on pushes to main only; nightly.yml runs
    # them too (ADR-0041).
    if: github.event_name == 'push'
    uses: ./.github/workflows/postgres-contract.yml

  web-e2e:
    # Playwright E2E of the web client over the subset of the width × locale matrix, on pushes to main only;
    # a newer push cancels the run in progress. nightly.yml runs all of it (ADR-0040).
    if: github.event_name == 'push'
    concurrency:
      group: web-e2e-main
      cancel-in-progress: true
    uses: ./.github/workflows/web-e2e.yml
    with:
      matrix: pr

  ui-test:
    # The @my/ui story tests (ADR-0027): axe on every story and the screenshots at 3 container widths × light / dark
    # × LTR / RTL. The baselines were generated in this same image (`make ui-snapshots-update`).
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in the Makefile (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      # The image has neither make nor the unzip that setup-bun extracts Bun with.
      - name: Install make and unzip
        run: apt-get update && apt-get install -y --no-install-recommends make unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: make ui-test
        run: make ui-test
      # On a visual difference, the actual and diff images are under app/ui/.vitest/attachments/.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: app/ui/.vitest/
          retention-days: 7

  docker-smoke:
    # Build the images and run deploy/docker/compose.yaml end to end: schema apply, server start, admin creation,
    # then WebFinger, Actor, and NodeInfo (scripts/docker-smoke.sh dumps the logs on failure and always tears down).
    # The images hold everything but the docs, so a change to any other context runs it.
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.i18n == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Smoke-test the Docker Compose setup
        run: make docker-smoke
      # The smoke test covers linux/amd64; also build both images for linux/arm64 (ADR-0010) under QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build the images for linux/arm64
        run: |
          docker build --platform linux/arm64 --target schema .
          docker build --platform linux/arm64 --target app .
