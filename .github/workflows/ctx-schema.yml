name: "Context: schema"

# The schema context of `scripts/task.sh check` (scripts/changed-contexts.sh): apply each dialect's desired-state schema to an
# empty database and require an empty diff afterwards (db:check, ADR-0023). Called by ci.yml when a pull request
# or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue. Every job runs in both scopes."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue. Every job runs in both scopes."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    env:
      DB_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - name: Install Atlas Community Edition (pinned in scripts/install-atlas.sh)
        run: scripts/task.sh db:atlas
      - name: Start PostgreSQL
        if: matrix.dialect == 'postgres'
        run: scripts/task.sh db:up
      - name: Apply the schema to an empty database and check for drift
        run: scripts/task.sh db:check
