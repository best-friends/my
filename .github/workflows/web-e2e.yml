name: Web E2E

# Playwright E2E of the web client (ADR-0015, ADR-0027) in three stages (ADR-0047): one build of app/web/dist and
# bin/my, Playwright `--shard` jobs that all test that same build, and one HTML report merged from the shards' blob
# reports. main.yml calls it on every push to main (ADR-0040) with the subset on 4 shards, and nightly.yml with the
# full width × locale matrix (app/web/playwright.config.ts) on 8. Pull requests never start it on their own: run it
# by hand on a PR's branch with `gh workflow run web-e2e.yml --ref <branch>` (or the Actions tab).

on:
  workflow_call:
    inputs:
      matrix:
        description: "`pr` for the default subset (main pushes), `full` for every width × locale project."
        type: string
        required: true
      shards:
        description: "The number of shard jobs; 0 picks 4 for `pr` and 8 for `full`."
        type: number
        default: 0
      workers:
        description: "Playwright workers in each shard job."
        type: number
        default: 2
  workflow_dispatch:
    inputs:
      matrix:
        description: "`pr` for the default subset, `full` for every width × locale project."
        type: choice
        options: [pr, full]
        default: pr
      shards:
        description: "The number of shard jobs; 0 picks 4 for `pr` and 8 for `full`."
        type: number
        default: 0
      workers:
        description: "Playwright workers in each shard job."
        type: number
        default: 2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - name: List the shards
        id: shards
        env:
          MATRIX: ${{ inputs.matrix }}
          SHARDS: ${{ inputs.shards }}
        run: |
          total="$SHARDS"
          if [ "$total" -le 0 ]; then
            if [ "$MATRIX" = full ]; then total=8; else total=4; fi
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "list=$(jq -nc --argjson n "$total" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions (ADR-0025).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            go.mod
            go.sum
      # `make build` builds app/web/dist (vite preview serves it) and bin/my with it embedded (e2e/server.ts
      # starts it).
      - name: make build
        run: make build
      # Artifacts drop file modes, so the build travels as a tarball that keeps bin/my executable.
      - name: Pack the build
        run: tar -cf "$RUNNER_TEMP/e2e-build.tar" bin/my app/web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-${{ inputs.matrix }}-w${{ inputs.workers }}
          path: ${{ runner.temp }}/e2e-build.tar
          retention-days: 1

  shard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    name: shard ${{ matrix.shard }}/${{ needs.build.outputs.total }}
    # The official Playwright image, pinned by digest, provides the browsers and their system libraries.
    # Its tag must match @playwright/test in app/web/package.json, and it must equal PLAYWRIGHT_IMAGE in the Makefile
    # (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      E2E_MATRIX: ${{ inputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image lacks the unzip that setup-bun extracts Bun with.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-e2e-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-e2e-${{ runner.os }}-
      - name: Install the client packages
        working-directory: app
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-build-${{ inputs.matrix }}-w${{ inputs.workers }}
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: tar -xf "$RUNNER_TEMP/e2e-build.tar"
      - name: playwright test --shard=${{ matrix.shard }}/${{ needs.build.outputs.total }}
        working-directory: app/web
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.build.outputs.total }}
          WORKERS: ${{ inputs.workers }}
        run: bun run playwright test --shard="$SHARD" --workers="$WORKERS" --reporter=github,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ inputs.matrix }}-w${{ inputs.workers }}-${{ matrix.shard }}
          path: app/web/blob-report/
          retention-days: 1

  report:
    # Merges the blob reports even when shards failed; a cancelled run (a newer push to main) skips it.
    needs: [build, shard]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Restore the Bun package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install the client packages
        working-directory: app
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-${{ inputs.matrix }}-w${{ inputs.workers }}-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true
      - name: playwright merge-reports
        working-directory: app/web
        run: bun run playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"
      # The merged report holds every shard's results and the traces of the failed tests.
      - name: Upload the Playwright report
        if: ${{ needs.shard.result != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ inputs.matrix }}
          path: app/web/playwright-report/
          retention-days: 7
