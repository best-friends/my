name: "Context: go"

# The go context of `make check` (scripts/changed-contexts.sh): make go-check, split into go-test and the rest.
# Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips go-licenses."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips go-licenses."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  go:
    # go-check except go-test (the go-test job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-go's own cache is keyed on go.sum alone and never refreshed. This one is saved by main.yml on the
      # pushes to main that touch Go and restored here, so the builds of unchanged packages stay cached.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-lint-${{ runner.os }}-
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # The official action installs the prebuilt binary, caches lint results and annotates the PR.
      # It also puts golangci-lint on PATH, so `make go-lint` reuses the binary and the cache.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
      - name: make go-check (except go-test and go-licenses)
        run: make go-mod-check go-vet go-lint go-build sqlc-check
      # The licenses follow from go.sum alone: the dependencies of two stacked pull requests are the union of
      # dependencies each one passed with, so the merge queue skips it (ADR-0047).
      - name: make go-licenses
        if: inputs.scope == 'pr'
        run: make go-licenses

  go-test:
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0041); postgres-contract.yml
    # runs them on a real postgres container after the merge (main.yml) and nightly. The Valkey tests run on a container,
    # except the stream.Bus contracts: miniredis here, the container in stream-contract.yml. The Pub/Sub contracts run on
    # pstest here and on the emulator container in stream-contract.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Saved by main.yml like the go job's, of the test builds.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-test-${{ runner.os }}-
      # The Valkey tests (pkg/testkit/valkeytest) start valkey/valkey on the runner's Docker; TEST_VALKEY_REQUIRED
      # makes a missing Docker fail the job instead of skipping them.
      - name: make go-test
        run: make go-test
        env:
          TEST_VALKEY_REQUIRED: "1"
