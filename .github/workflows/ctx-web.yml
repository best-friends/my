name: "Context: web"

# The client contexts of `make check` (scripts/changed-contexts.sh): ui (make ui-check and the @my/ui story tests)
# and web (make web-check, split into the static checks and Vitest). Called by ci.yml when a pull request or a merge
# group touches either context, with the inputs `ui` and `web` selecting the jobs, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips ui-test and the web checks decided file by file (licenses, tokens, Playwright image, 100vh)."
        type: string
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check, as the jobs web and web-test).
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips ui-test and the web checks decided file by file (licenses, tokens, Playwright image, 100vh)."
        type: choice
        options: [pr, queue]
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check, as the jobs web and web-test).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ui:
    if: inputs.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: make ui-check
        run: make ui-check

  web:
    # make web-check without web-test (the web-test job): tsc, Oxlint, knip, the Vite build, and the route tree.
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vite and Vitest run on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: make web-check (static checks, except the ones decided file by file)
        run: make web-typecheck web-lint-code web-dist web-routes-check
      # Decided file by file or by the lockfile alone, so two stacked pull requests cannot break them and the merge
      # queue skips them (ADR-0047).
      - name: make web-check (licenses, tokens, Playwright image, 100vh)
        if: inputs.scope == 'pr'
        run: make web-lint-css web-licenses web-tokens playwright-image-check

  web-test:
    # The Vitest half of make web-check, in a job of its own so that it runs beside the static checks (ADR-0047).
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: make web-test
        run: make web-test

  ui-test:
    # The @my/ui story tests (ui-test.yml), which main.yml also runs after the merge. The merge queue skips them: a
    # pull request that changes a screenshot fixes its baselines itself, and a change from stacking two of them is
    # rare enough to find after the merge (ADR-0047).
    if: inputs.ui && inputs.scope == 'pr'
    uses: ./.github/workflows/ui-test.yml
