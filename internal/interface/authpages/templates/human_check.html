{{define "human_check"}}{{with .HumanCheck}}<div class="field">
<script src="{{.ScriptSrc}}" async defer></script>
<div class="{{.ContainerClass}}" data-sitekey="{{.SiteKey}}"{{with .Action}} data-action="{{.}}"{{end}}{{with .Language}} data-language="{{.}}"{{end}} data-theme="{{.Theme}}"></div>
<noscript><p class="alert">{{$.L.ServerAuthHumanCheckNoscript}}</p></noscript>
<p class="hint">{{.Notice}}</p>
{{with .Links}}<ul class="links">
{{range .}}<li><a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Title}}<span class="visually-hidden"> {{$.L.ServerAuthLinkNewTab}}</span></a></li>
{{end}}</ul>{{end}}
</div>
{{end}}{{end}}
