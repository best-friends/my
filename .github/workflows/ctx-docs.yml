name: "Context: docs"

# The docs context of `scripts/task.sh check` (scripts/changed-contexts.sh): markdownlint and the ADR numbers (docs:check).
# Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips markdownlint."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips markdownlint."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      # markdownlint is decided file by file, so two pull requests stacked in the merge queue cannot break it; the
      # ADR numbers can collide when two of them add an ADR, so the queue keeps docs:adr-numbers (ADR-0081).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.scope == 'pr'
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        if: inputs.scope == 'pr'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: markdownlint
        if: inputs.scope == 'pr'
        run: scripts/task.sh docs:lint
      - name: docs:adr-numbers
        run: scripts/task.sh docs:adr-numbers
