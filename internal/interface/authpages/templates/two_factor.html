{{define "content"}}
<h1>{{.L.ServerAuthTwoFactorTitle}}</h1>
{{if .Error}}<p id="two-factor-error" class="alert" role="alert">{{.Error}}</p>{{end}}
<p id="two-factor-prompt">{{.L.ServerAuthTwoFactorPrompt}}</p>
<form class="form" method="post" action="/auth/sign_in/two_factor">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
{{if .ReturnTo}}<input type="hidden" name="return_to" value="{{.ReturnTo}}">{{end}}
<div class="field">
<label for="two-factor-code">{{.L.ServerAuthTwoFactorCodeLabel}}</label>
<input id="two-factor-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="64" required aria-describedby="two-factor-prompt{{if .Error}} two-factor-error{{end}}"{{if .Error}} aria-invalid="true"{{end}}>
</div>
<div class="actions">
<button class="button" type="submit">{{.L.ServerAuthTwoFactorSubmit}}</button>
</div>
</form>
<p class="links"><a href="/auth/sign_in{{if .ReturnTo}}?return_to={{.ReturnTo}}{{end}}">{{.L.ServerAuthTwoFactorRestartLink}}</a></p>
{{end}}
