name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            go.mod
            go.sum
            tools/go.mod
            tools/go.sum
      - name: Install golangci-lint (version from .tool-versions)
        run: |
          version="$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${version}"
          golangci-lint version
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: make check
        run: make check
      - name: shellcheck
        run: make lint-shell
      - name: govulncheck
        run: make go-vuln
