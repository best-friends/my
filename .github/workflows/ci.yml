name: CI

# The pull request and merge queue checks (ADR-0079). One workflow and one required status check, `check`, whose jobs
# depend on the event:
#
# - pull_request: `preflight`, the checks a pull request's own files decide (scripts/task.sh ci:preflight), and the
#   @my/ui story tests (ui-test.yml) when the ui context changes.
# - merge_group: the full check of the contexts the group changes (scripts/changed-contexts.sh): server-static,
#   server-test, client-static, client-test (2 shards), repo, and docker, at most 7 jobs.
# - pull_request labelled `ci:full`: both.
#
# Each job sets up its tools and runs one `scripts/task.sh ci:<job>`, the same task that runs locally. The workflow has
# no path filter, so it always runs and `check` always reports. Pushes to main run main.yml instead.

on:
  # labeled / unlabeled rerun the checks when `ci:full` is added or removed, and the concurrency group cancels the
  # older run, so no result of the other set of jobs is left on the pull request.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue of main runs the same required `check` on each merge group before it merges the group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push or label change replaces a PR's run. Each merge group has a ref of its own (gh-readonly-queue/main/...)
  # and is never cancelled here: the merge queue replaces the groups it rebuilds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  # Selects the jobs: whether the full check runs, and the contexts of scripts/changed-contexts.sh the change touches.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      ui: ${{ steps.select.outputs.ui }}
      server: ${{ steps.select.outputs.server }}
      client: ${{ steps.select.outputs.client }}
      smoke: ${{ steps.select.outputs.smoke }}
      arm64: ${{ steps.select.outputs.arm64 }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch. A merge group checks out
      # its head commit and compares it with its base, the main commit the group is built on; that base is fetched by
      # SHA because a group queued behind others is several commits ahead of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # The merge queue, or a pull request labelled `ci:full`.
          FULL: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          else
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            git diff --name-only "$MERGE_GROUP_BASE_SHA" "$MERGE_GROUP_HEAD_SHA" > "$RUNNER_TEMP/changed"
          fi
          contexts=" $(scripts/changed-contexts.sh --files "$RUNNER_TEMP/changed" | tr '\n' ' ')"
          echo "full: $FULL, contexts:$contexts"
          # touches JOB CONTEXT... sets the output JOB to whether the change touches one of the contexts.
          touches() {
            local job="$1" c value=false
            shift
            for c in "$@"; do
              case "$contexts" in *" $c "*) value=true ;; esac
            done
            echo "$job=$value" >> "$GITHUB_OUTPUT"
          }
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          touches ui ui
          touches server go schema api i18n
          touches client ui web api i18n
          # Only a change to the docker context makes the linux/arm64 images differ: the Go server cross-builds with
          # CGO_ENABLED=0 (ADR-0010).
          touches arm64 docker
          # The Docker smoke test also runs on a change to cmd/ or internal/platform/, which load the configuration
          # and assemble the server the images start. changed-contexts.sh puts those two in the go context, so their
          # paths are matched here.
          if [[ "$contexts" == *" docker "* ]] || grep -qE '^(cmd|internal/platform)/' "$RUNNER_TEMP/changed"; then
            echo smoke=true
          else
            echo smoke=false
          fi >> "$GITHUB_OUTPUT"

  # --- Pull requests --------------------------------------------------------------------------------------------

  preflight:
    # Markdown, shellcheck, gofmt, the Go and npm licenses, the Dockerfile and Playwright image versions, the design
    # tokens, and the CSS 100vh check. A pull request's own files or lockfiles decide each of them, so stacking pull
    # requests in the merge queue cannot break them and the queue does not run them again.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-bun
        with:
          node: "false"
      - name: ci:preflight
        run: scripts/task.sh ci:preflight

  ui-test:
    # The @my/ui story tests (ADR-0027), on pull requests alone: a pull request that changes a screenshot fixes its
    # baselines itself, and a change from stacking two of them is rare.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui-test.yml

  # --- The full check: merge groups, and pull requests labelled ci:full -------------------------------------------
  # A job whose `if` is false is skipped, and `check` counts a skipped job as passed.

  server-static:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-go
        with:
          golangci-lint: "true"
      # api:check bundles the spec with Redocly and i18n:lint checks the catalogs, both on Bun.
      - uses: ./.github/actions/setup-bun
      - name: ci:server-static
        run: scripts/task.sh ci:server-static

  server-test:
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0041); the slow suite runs them
    # on a real postgres container. The Valkey tests start valkey/valkey on the runner's Docker; TEST_VALKEY_REQUIRED
    # makes a missing Docker fail the job instead of skipping them.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-go
      - name: ci:server-test
        run: scripts/task.sh ci:server-test
        env:
          TEST_VALKEY_REQUIRED: "1"

  client-static:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-bun
      - name: ci:client-static
        run: scripts/task.sh ci:client-static

  client-test:
    # Vitest of app/web in two shards, the longest job otherwise; the first shard also runs app/ui and tools/i18n.
    name: client-test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-bun
      - name: ci:client-test
        run: scripts/task.sh ci:client-test SHARD=${{ matrix.shard }}

  repo:
    # agentkit and its context map, which must cover every path, and the ADR numbers: any change can break them.
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-go
        with:
          golangci-lint: "true"
      - name: ci:repo
        run: scripts/task.sh ci:repo

  docker:
    # The Docker Compose smoke test (linux/amd64), and on a change to the docker context the linux/arm64 image builds
    # under QEMU.
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      # The images take their version from `git describe`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-task
      - if: needs.changes.outputs.arm64 == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: ci:docker
        run: scripts/task.sh ci:docker ARM64=${{ needs.changes.outputs.arm64 }}

  check:
    # The required status check of the protect-main ruleset, on pull requests and merge groups: it passes only when
    # every job above passed, or was skipped because the event or the change does not need it. A job that calls a
    # reusable workflow fails when a called job fails, so a failed story test fails `check`. `always()` makes it report
    # a result even when every other job is skipped, so neither a pull request nor a merge group waits on it.
    if: always()
    needs: [changes, preflight, ui-test, server-static, server-test, client-static, client-test, repo, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a check job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null
