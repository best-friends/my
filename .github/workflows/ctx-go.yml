name: "Context: go"

# The go context of `scripts/task.sh check` (scripts/changed-contexts.sh): go:check, split into go:test and the rest.
# Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips go-licenses."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue, which skips go-licenses."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  go:
    # go-check except go-test (the go-test job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      # Restores the Go cache that main.yml builds, so the builds of unchanged packages stay cached.
      - uses: ./.github/actions/setup-go
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # The official action installs the prebuilt binary, caches lint results and annotates the PR.
      # It is go:lint of go:check, which the step below leaves out so that golangci-lint runs once.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
      - name: go:check (except go:lint, go:test, and go:licenses)
        run: scripts/task.sh --parallel go:mod-check go:vet go:build go:build-tags go:sqlc-check
      # The licenses follow from go.sum alone: the dependencies of two stacked pull requests are the union of
      # dependencies each one passed with, so the merge queue skips it (ADR-0047).
      - name: go:licenses
        if: inputs.scope == 'pr'
        run: scripts/task.sh go:licenses

  go-test:
    # The PostgreSQL tests run on pgmem inside the test processes, without Docker (ADR-0041); postgres-contract.yml
    # runs them on a real postgres container nightly. The Valkey tests run on a container,
    # except the stream.Bus contracts: miniredis here, the container in stream-contract.yml. The Pub/Sub contracts run on
    # pstest here and on the emulator container in stream-contract.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-task
      - uses: ./.github/actions/setup-go
      # The Valkey tests (pkg/testkit/valkeytest) start valkey/valkey on the runner's Docker; TEST_VALKEY_REQUIRED
      # makes a missing Docker fail the job instead of skipping them.
      - name: go:test
        run: scripts/task.sh go:test
        env:
          TEST_VALKEY_REQUIRED: "1"
