name: "Context: web"

# The client contexts of `make check` (scripts/changed-contexts.sh): ui (make ui-check and the @my/ui story tests)
# and web (make web-check, split into the static checks and Vitest). Called by ci.yml when a pull request or a merge
# group touches either context, with the inputs `ui` and `web` selecting the jobs, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests (and main pushes), `queue` in the merge queue, which skips ui-test and the web checks decided file by file (licenses, tokens, Playwright image, 100vh)."
        type: string
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check, as the jobs web and web-test).
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests (and main pushes), `queue` in the merge queue, which skips ui-test and the web checks decided file by file (licenses, tokens, Playwright image, 100vh)."
        type: choice
        options: [pr, queue]
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check, as the jobs web and web-test).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ui:
    if: inputs.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: make ui-check
        run: make ui-check

  web:
    # make web-check without web-test (the web-test job): tsc, ESLint, knip, the Vite build, and the route tree.
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vite and Vitest run on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: make web-check (static checks, except the ones decided file by file)
        run: make web-typecheck web-lint-code web-dist web-routes-check
      # Decided file by file or by the lockfile alone, so two stacked pull requests cannot break them and the merge
      # queue skips them (ADR-0047).
      - name: make web-check (licenses, tokens, Playwright image, 100vh)
        if: inputs.scope == 'pr'
        run: make web-lint-css web-licenses web-tokens playwright-image-check

  web-test:
    # The Vitest half of make web-check, in a job of its own so that it runs beside the static checks (ADR-0047).
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: make web-test
        run: make web-test

  ui-test:
    # The @my/ui story tests (ADR-0027): axe on every story and the screenshots at 3 container widths × light / dark
    # × LTR / RTL. The baselines were generated in this same image (`make ui-snapshots-update`). The merge queue
    # skips them: a pull request that changes a screenshot fixes its baselines itself, and a change from stacking two
    # of them is rare enough to find after the merge (ADR-0047).
    if: inputs.ui && inputs.scope == 'pr'
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in the Makefile (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # The image has neither make nor the unzip that setup-bun extracts Bun with.
      - name: Install make and unzip
        run: apt-get update && apt-get install -y --no-install-recommends make unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: make ui-test
        run: make ui-test
      # On a visual difference, the actual and diff images are under app/ui/.vitest/attachments/.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-screenshots
          path: app/ui/.vitest/
          retention-days: 7
