name: Bug
description: Something does not work as specified
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / 何が起きたか
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 期待する動作
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 再現手順
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target and adapters
      placeholder: "self-hosted docker, sqlite, queue-db"
