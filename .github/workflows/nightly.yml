name: Nightly

# Checks too slow for every PR (ADR-0015, ADR-0047): the web E2E over the full width × locale matrix, the live
# interoperability test with Mastodon, GoToSocial, and Misskey, the PostgreSQL tests on a real postgres container
# (ADR-0041), the stream.Bus contracts on broker containers (ADR-0050), and the Docker Compose smoke test with the linux/arm64 image builds.

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  web-e2e:
    uses: ./.github/workflows/web-e2e.yml
    with:
      matrix: full
      shards: 8

  federation-live:
    uses: ./.github/workflows/federation-live.yml

  postgres-contract:
    uses: ./.github/workflows/postgres-contract.yml

  stream-contract:
    uses: ./.github/workflows/stream-contract.yml

  docker:
    # Pull requests build the arm64 images only on a change to the docker context; build them every night too, with
    # the smoke test of the main commit (ADR-0047).
    uses: ./.github/workflows/ctx-docker.yml
    with:
      check: false
      smoke: true
      arm64: true
