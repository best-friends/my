name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The PostgreSQL adapter tests start postgres with testcontainers-go on the runner's Docker.
      # Make them fail instead of skipping when that is impossible, so CI always runs them.
      TEST_POSTGRES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # Vite runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            go.mod
            go.sum
            tools/go.mod
            tools/go.sum
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # The official action installs the prebuilt binary, caches lint results and annotates the PR.
      # It also puts golangci-lint on PATH, so the run inside `make check` reuses the binary and the cache.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: make check
        run: make check
      - name: shellcheck
        run: make lint-shell
      - name: govulncheck
        run: make go-vuln

  schema:
    # Apply each dialect's desired-state schema to an empty database and require an empty diff afterwards (ADR-0023).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    env:
      DB_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Atlas Community Edition (pinned in scripts/install-atlas.sh)
        run: make atlas
      - name: Start PostgreSQL
        if: matrix.dialect == 'postgres'
        run: make db-up
      - name: Apply the schema to an empty database and check for drift
        run: make db-check

  web-e2e:
    # Playwright E2E of the web client over the per-PR subset of the width × locale matrix; nightly.yml runs all of it.
    uses: ./.github/workflows/web-e2e.yml
    with:
      matrix: pr

  ui-test:
    # The @my/ui story tests (ADR-0027): axe on every story and the screenshots at 3 container widths × light / dark
    # × LTR / RTL. The baselines were generated in this same image (`make ui-snapshots-update`).
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in the Makefile (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      # The image has neither make nor the unzip that setup-bun extracts Bun with.
      - name: Install make and unzip
        run: apt-get update && apt-get install -y --no-install-recommends make unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: make ui-test
        run: make ui-test
      # On a visual difference, the actual and diff images are under app/ui/.vitest/attachments/.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: app/ui/.vitest/
          retention-days: 7

  docker-smoke:
    # Build the images and run deploy/docker/compose.yaml end to end: schema apply, server start, admin creation,
    # then WebFinger, Actor, and NodeInfo (scripts/docker-smoke.sh dumps the logs on failure and always tears down).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Smoke-test the Docker Compose setup
        run: make docker-smoke
      # The smoke test covers linux/amd64; also build both images for linux/arm64 (ADR-0010) under QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build the images for linux/arm64
        run: |
          docker build --platform linux/arm64 --target schema .
          docker build --platform linux/arm64 --target app .
