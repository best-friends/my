name: "Context: web"

# The client contexts of `make check` (scripts/changed-contexts.sh): ui (make ui-check and the @my/ui story tests)
# and web (make web-check). Called by ci.yml when a pull request or a merge group touches either context, with the
# inputs `ui` and `web` selecting the jobs, and runnable by hand (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests (and main pushes), `queue` in the merge queue. Every job runs in both scopes."
        type: string
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check).
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests (and main pushes), `queue` in the merge queue. Every job runs in both scopes."
        type: choice
        options: [pr, queue]
        default: pr
      ui:
        description: Run the ui context (ui-check and ui-test).
        type: boolean
        default: true
      web:
        description: Run the web context (web-check).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ui:
    if: inputs.ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vitest runs on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: make ui-check
        run: make ui-check

  web:
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Vite and Vitest run on Node.js; Bun only installs packages and runs scripts (ADR-0025).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: make web-check
        run: make web-check

  ui-test:
    # The @my/ui story tests (ui-test.yml), which main.yml also runs on its own.
    if: inputs.ui
    uses: ./.github/workflows/ui-test.yml
