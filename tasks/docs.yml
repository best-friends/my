#
# Documentation: markdownlint and the ADR index (the docs context of scripts/changed-contexts.sh).
version: "3"

vars:
  MARKDOWNLINT: bunx --bun markdownlint-cli2@0.23.2

tasks:
  check:
    desc: Run the documentation checks, markdownlint and the ADR index, in parallel
    deps: [lint, adr-index-check]

  lint:
    desc: Lint Markdown files
    cmds:
      - "{{.MARKDOWNLINT}}"

  adr-index:
    desc: Regenerate the ADR index in docs/adr/README.md
    cmds:
      - scripts/adr-index.sh

  adr-index-check:
    desc: Fail if the ADR index is stale
    cmds:
      - scripts/adr-index.sh --check

  adr-new:
    desc: 'Create a new ADR: scripts/task.sh docs:adr-new TITLE="..." [SLUG=kebab-slug]'
    requires:
      vars: [TITLE]
    cmds:
      - scripts/adr-new.sh {{shellQuote .TITLE}} {{.SLUG}}
