{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.DocumentTitle}}</title>
{{with .Stylesheet}}<link rel="stylesheet" href="{{.}}">
{{end}}</head>
<body>
<main class="page{{if .Document}} page-document{{end}}">
{{with .InstanceName}}<p class="site-name" dir="auto">{{.}}</p>
{{end}}<div class="card">
{{template "content" .}}
</div>
</main>
{{with .Documents}}<footer class="footer">
<nav aria-label="{{$.L.ServerAuthDocumentFooterLabel}}">
<ul class="footer-links">
{{range .}}<li><a href="{{.Path}}">{{.Title}}</a></li>
{{end}}</ul>
</nav>
</footer>
{{end}}</body>
</html>
{{end}}
