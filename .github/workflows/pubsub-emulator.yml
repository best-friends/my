name: Pub/Sub emulator

# The stream.Bus contract of internal/adapter/stream/pubsub on the Pub/Sub emulator (a google-cloud-cli emulators
# container) instead of pstest (ADR-0050 §5). Called by main.yml on the pushes to main that touch a path it depends on
# and by nightly.yml; pull requests and merge groups run the same contract on pstest in ctx-go.yml's go-test job.

on:
  workflow_call:

permissions:
  contents: read

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  pubsub-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      # The go-test cache that main.yml saves, without saving one.
      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
            go-test-${{ runner.os }}-
      # testcontainers-go starts the emulator on the runner's Docker; TEST_PUBSUB_REQUIRED makes a missing Docker fail
      # the job instead of skipping the test.
      - name: make go-test-pubsub-emulator
        run: make go-test-pubsub-emulator
