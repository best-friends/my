name: "Context: i18n"

# The i18n context of `make check` (scripts/changed-contexts.sh): the catalogs and their generated accessors
# (make i18n-check). Called by ci.yml when a pull request or a merge group touches the context, and runnable by hand
# (ADR-0047).

on:
  workflow_call:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue. Every job runs in both scopes."
        type: string
        default: pr
  workflow_dispatch:
    inputs:
      scope:
        description: "`pr` on pull requests, `queue` in the merge queue. Every job runs in both scopes."
        type: choice
        options: [pr, queue]
        default: pr

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock', 'tools/i18n/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: make i18n-check
        run: make i18n-check
