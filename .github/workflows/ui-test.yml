name: UI story tests

# The @my/ui story tests (ADR-0027): axe on every story and the screenshots at 3 container widths × light / dark
# × LTR / RTL, in the pinned Playwright image. Called by ctx-web.yml when a pull request touches the ui context and
# by main.yml when a push to main does (ADR-0047).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-test:
    # The baselines were generated in this same image (`make ui-snapshots-update`).
    runs-on: ubuntu-latest
    # Must equal PLAYWRIGHT_IMAGE in the Makefile (`make playwright-image-check`).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image has neither make nor the unzip that setup-bun extracts Bun with.
      - name: Install make and unzip
        run: apt-get update && apt-get install -y --no-install-recommends make unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Use the Node.js from .tool-versions rather than the image's (ADR-0025).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-
      - name: make ui-test
        run: make ui-test
      # On a visual difference, the actual and diff images are under app/ui/.vitest/attachments/.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-screenshots
          path: app/ui/.vitest/
          retention-days: 7
