  schemas:
    Id:
      description: The ID of a resource, a UUIDv7 in its canonical string form.
      type: string
      format: uuid
      examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
      # The application layer passes IDs as strings (kernel.IDGenerator).
      x-go-type: string
    Cursor:
      description: An opaque pagination cursor. Clients pass it back unchanged and never parse it.
      type: string
      minLength: 1
      maxLength: 256
    PageInfo:
      description: The pagination of a collection page; collection responses embed it with allOf.
      type: object
      properties:
        next_cursor:
          $ref: "#/components/schemas/Cursor"
    Problem:
      description: |
        An RFC 9457 problem document. Besides `about:blank`, `type` is one of

        - `/api/v1/problems/unauthenticated` (401): the operation needs an access token and
          the request has none.
        - `/api/v1/problems/invalid-token` (401): the access token is malformed, unknown,
          expired, or revoked. Refresh it or sign in again.
        - `/api/v1/problems/insufficient-scope` (403): the access token lacks the scope that
          `WWW-Authenticate` names.
        - `/api/v1/problems/account-unavailable` (403): the token is valid, but its user cannot
          use the app (registration pending or rejected, email unverified, the account
          deactivated or deleted, or a moderation action that disables its login). The user
          can still sign in to the server's sign-in page, which says why.
        - `/api/v1/problems/blocking` (409): the viewer blocks the account, which keeps them
          from following it. Unblock it first.
        - `/api/v1/problems/media-too-large` (413): the uploaded file is larger than the
          instance accepts.
        - `/api/v1/problems/unsupported-media-format` (415): the uploaded file is not in an
          accepted format or codec (such as HEVC video), or its declared type does not match its
          content.
        - `/api/v1/problems/media-dimensions` (422): the image is too wide or tall, or has too
          many pixels or frames; or the video has too many pixels or frames per second.
        - `/api/v1/problems/media-too-long` (422): the video or audio file is longer than the
          instance accepts.
        - `/api/v1/problems/media-corrupt` (422): the uploaded file cannot be read as a file of
          its format.
        - `/api/v1/problems/media-attached` (409): the media file is attached to a post and can
          no longer be changed on its own.
        - `/api/v1/problems/too-many-streams` (429): the user already has as many streams
          (`GET /streaming`) open as the server allows. Close one first.
        - `/api/v1/problems/missing-permission` (403): the user's roles lack the permission
          that an admin operation needs.
        - `/api/v1/problems/already-appealed` (422): the user already appealed the moderation
          action; an action is appealed once.
        - `/api/v1/problems/appeal-window-closed` (422): the time to appeal the moderation
          action has passed.
        - `/api/v1/problems/not-appealable` (422): the moderation action is a ban whose
          account is deleted, so it can no longer be appealed or overturned.
        - `/api/v1/problems/appeal-decided` (409): the appeal was already decided the other way.
        - `/api/v1/problems/wrong-password` (422): the password given to confirm the operation is
          not the user's current password.
        - `/api/v1/problems/export-in-progress` (409): another data export of the user is being
          built. Wait for it to end.
        - `/api/v1/problems/export-not-ready` (409): the data export has no archive to download:
          it is being built, failed, or expired.
        - `/api/v1/problems/import-in-progress` (409): another import of the user is being
          carried out. Wait for it to finish.
        - `/api/v1/problems/invalid-two-factor-code` (422): the two-factor code is wrong, was
          already used, or is not a code.
        - `/api/v1/problems/totp-setup-expired` (422): the TOTP setup is unknown or expired.
          Start a new one.
        - `/api/v1/problems/two-factor-enabled` (409): the user already has two-factor
          authentication.
        - `/api/v1/problems/two-factor-not-enabled` (409): the user, or the account of an admin
          operation, has no two-factor authentication.
        - `/api/v1/problems/invalid-passkey` (422): the browser's response to a passkey
          registration or confirmation does not verify, the passkey is registered already, or
          the passkey that confirms an operation is not one of the user's.
        - `/api/v1/problems/passkey-registration-expired` (422): the passkey registration is
          unknown or expired. Start a new one.
        - `/api/v1/problems/passkey-confirmation-expired` (422): the confirmation with a passkey
          is unknown, expired, or used. Start a new one.
        - `/api/v1/problems/too-many-passkeys` (409): the user already has the most passkeys
          allowed. Remove one first.
        - `/api/v1/problems/last-sign-in-method` (409): the operation would leave the user no
          way to sign in: the password without a passkey, or the last passkey without a password.
        - `/api/v1/problems/invalid-custom-emoji` (422): a custom emoji breaks a rule; `reason`
          says which.
        - `/api/v1/problems/invalid-webhook` (422): a webhook breaks a rule; `reason` says
          which.
        - `/api/v1/problems/invalid-relay` (422): a relay cannot be registered, joined, left, or
          deleted; `reason` says why.
        - `/api/v1/problems/invalid-theme` (422): the theme breaks a rule; the problem lists every
          reason in `theme_errors` (`PUT /admin/theme`).
        - `/api/v1/problems/too-many-domain-mutes` (422): the user already mutes the most domains
          allowed. Unmute one first.
      type: object
      required: [type, title, status]
      properties:
        type:
          description: |
            A URI that identifies the problem type, stable for clients to branch on.
            It is `about:blank` when the problem means no more than its HTTP status.
          type: string
          format: uri-reference
        title:
          description: A short summary of the problem type, localized from `Accept-Language`.
          type: string
        status:
          description: The HTTP status code.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: An explanation of this occurrence, localized from `Accept-Language`.
          type: string
        request_id:
          description: The request ID (the `X-Request-Id` response header), for reporting the problem.
          type: string
    Instance:
      description: Public information about the instance.
      type: object
      required: [domain, name, version, source_url, registrations, limits, timelines, sends_email, rules, search_indexing, ai_usage]
      properties:
        domain:
          description: The domain that serves the instance.
          type: string
        name:
          description: The display name of the instance; the domain when the instance has none.
          type: string
        short_description:
          description: A one-paragraph summary of the instance, as plain text; omitted when there is none.
          type: string
        description:
          description: The full description of the instance, as plain text; omitted when there is none.
          type: string
        registrations:
          $ref: "#/components/schemas/InstanceRegistrations"
        version:
          description: The server version.
          type: string
        source_url:
          description: Where users get the source code of the running server (AGPL-3.0 section 13), as an https URL to read it at or a mailto URI to request it by email.
          type: string
          format: uri
        limits:
          $ref: "#/components/schemas/InstanceLimits"
        timelines:
          $ref: "#/components/schemas/InstanceTimelines"
        sends_email:
          description: |
            Whether the instance sends email (the server setting `mail` is not `none`). Without
            email, the moderator notifications come only in the app, so clients do not offer
            the preference `email_moderator_notifications`.
          type: boolean
        push_server_key:
          description: |
            The instance's VAPID public key (RFC 8292), an uncompressed P-256 point in unpadded
            base64url: the `applicationServerKey` that browsers subscribe with before
            `putPushSubscription`. Omitted when the instance sends no Web Push.
          type: string
        rules:
          description: The rules in effect, in order.
          type: array
          items:
            $ref: "#/components/schemas/InstanceRule"
        terms_url:
          description: |
            The public page of the instance's terms of service, which needs no sign-in; omitted
            when the instance has none, so that clients do not link to it.
          type: string
          format: uri
        privacy_policy_url:
          description: |
            The public page of the instance's privacy policy, which needs no sign-in; omitted
            when the instance has none.
          type: string
          format: uri
        theme:
          $ref: "#/components/schemas/InstanceTheme"
        contact:
          $ref: "#/components/schemas/InstanceContact"
        thumbnail:
          $ref: "#/components/schemas/InstanceThumbnail"
        search_indexing:
          $ref: "#/components/schemas/SearchIndexing"
        ai_usage:
          $ref: "#/components/schemas/AIUsage"
    InstanceContact:
      description: |
        How people reach the instance's operators (the instance settings `contact_account` and
        `contact_email`). Omitted when the instance has neither.
      type: object
      properties:
        account:
          description: |
            The local account to contact; omitted when there is none, or when the account
            cannot be shown (it is suspended or deleted).
          allOf:
            - $ref: "#/components/schemas/Account"
        email:
          description: The email address to contact; omitted when there is none.
          type: string
    InstanceThumbnail:
      description: |
        The image that represents the instance (the instance setting `thumbnail`): the large still
        variant of the media file. Omitted when there is none, or while the file is processing.
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt:
          description: |
            The alt text (the instance text `thumbnail_alt`); omitted when there is none.
          type: string
    SearchIndexing:
      description: |
        Whether the instance lets search engines index its pages (the instance setting
        `search_indexing`, FR-725, ADR-0057). `allow`: the profiles and public posts of the accounts
        that are `indexable`; `deny`: no page. An account can deny what the instance allows, never
        the reverse.
      type: string
      enum: [allow, deny]
    AIUsage:
      description: |
        What the instance states to AI crawlers (the instance setting `ai_usage`, FR-725, ADR-0057).
        `allow`: no reservation; `deny_training`: no training of AI models; `deny`: no training
        and no use by AI search, assistants, and agents. An account can opt out of what the
        instance allows (`ai_opt_out`), never the reverse.
      type: string
      enum: [allow, deny_training, deny]
    InstanceRegistrations:
      description: How people sign up on the instance.
      type: object
      required: [mode]
      properties:
        mode:
          description: |
            Who may sign up: `open` (anyone), `approval` (sign-ups wait for a moderator's
            approval), `invite` (only with an invite), or `closed` (nobody).
          type: string
          enum: [open, approval, invite, closed]
    InstanceLimits:
      description: Limits that clients check before sending a request.
      type: object
      required: [max_post_characters, require_media_description]
      properties:
        max_post_characters:
          description: The maximum number of characters in the text and content warning of a post.
          type: integer
          minimum: 1
        require_media_description:
          description: |
            Whether every media file attached to a post needs an alternative text (the instance
            setting `require_media_description`, FR-105). While it is on, a post or an edit with
            a media file without one is a 422, so clients ask for it before sending.
          type: boolean
    InstanceTimelines:
      description: |
        Which public timelines the instance serves (FR-202). A timeline that is off is a 404, so
        clients do not offer it.
      type: object
      required: [local, federated]
      properties:
        local:
          description: Whether `GET /timelines/local` serves the local timeline (the instance setting `local_timeline_enabled`).
          type: boolean
        federated:
          description: Whether `GET /timelines/public` serves the federated timeline (the instance setting `federated_timeline_enabled`).
          type: boolean
    InstanceRule:
      description: |
        A rule of the instance (FR-705). Its text and hint hold one value each, written in any
        language and the same in every locale. Reports cite it by `id`.
      type: object
      required: [id, text]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
    # --- instance: public domain actions (#347) ---
    InstanceDomainAction:
      description: A moderation action in effect on a remote domain and its subdomains, as the instance lists it publicly (FR-718).
      type: object
      required: [domain, digest, kind]
      properties:
        domain:
          description: |
            The domain, in IDNA A-labels. When the moderators chose to obfuscate it, the
            characters of its middle half other than dots are replaced with `*`.
          type: string
        digest:
          description: The SHA-256 of the domain (not obfuscated) in lower-case hexadecimal, to check a known domain against an obfuscated item.
          type: string
          pattern: "^[0-9a-f]{64}$"
        kind:
          description: |
            `suspend`: no federation with the domain at all. `limit`: its posts stay off the
            public timelines and its accounts reach only their followers.
          type: string
          enum: [limit, suspend]
        comment:
          description: The public reason for the action; omitted when there is none or the viewer may not read it.
          type: string
    InstanceDomainActionPage:
      description: A page of public domain actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InstanceDomainAction"
    # --- end of instance: public domain actions (#347) ---
    # Accounts and relationships (#108).
    Account:
      description: An account, as clients show it (FR-006).
      type: object
      required: [id, username, acct, domain, uri, display_name, note, fields, emojis, url, locked, bot, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        display_name:
          description: The display name; empty when the account has none.
          type: string
        note:
          description: The profile text as sanitized HTML; empty when there is none.
          type: string
        url:
          description: |
            The account's profile page: on this instance for a local account, and for a remote
            one the page its actor declares (`url`), or its `uri` when it declares none.
          type: string
          format: uri
        locked:
          description: Whether follow requests need the account's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        created_at:
          description: When the account was created.
          type: string
          format: date-time
        fields:
          description: The profile's metadata fields, in their order; empty when there are none.
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"
        emojis:
          description: |
            The custom emoji of the display name, the note, and the fields' names and values
            (ADR-0051). Clients show each `:shortcode:` of those texts that is in this list as its
            image, and the rest as text.
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
        avatar:
          description: |
            The avatar image, square; omitted when the account has none, or its image is not
            processed yet or could not be processed. Clients show a placeholder instead. For a
            remote account, every size is its media proxy URL.
          $ref: "#/components/schemas/MediaVariants"
        header:
          description: The header image; omitted when there is none, as `avatar` is.
          $ref: "#/components/schemas/MediaVariants"
        followers_count:
          description: |
            The number of accounts that actively follow the account, as far as the instance
            knows. Present on the account's own endpoints (`getAccount`, `lookupAccount`,
            `verifyAccountCredentials`) and left out where accounts are listed or embedded.
          type: integer
          minimum: 0
        following_count:
          description: The number of accounts that the account actively follows; present where `followers_count` is.
          type: integer
          minimum: 0
    AccountPage:
      description: A page of accounts.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [accounts]
          properties:
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/Account"
    FollowAccountRequest:
      description: The viewer's preferences of the follow; a preference left out keeps its value.
      type: object
      properties:
        show_boosts:
          description: Show the account's boosts in the home timeline. New follows show them.
          type: boolean
        notify:
          description: Notify the viewer of the account's new posts. New follows do not.
          type: boolean
    MuteAccountRequest:
      description: The settings of a mute.
      type: object
      properties:
        notifications:
          description: Also hide the account's notifications.
          type: boolean
          default: true
        duration:
          description: How long the mute lasts, in seconds; 0 mutes until unmuted.
          type: integer
          minimum: 0
          maximum: 31536000
          default: 0
    MutePage:
      description: A page of mutes.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [mutes]
          properties:
            mutes:
              type: array
              items:
                $ref: "#/components/schemas/MutedAccount"
    MutedAccount:
      description: An account that the viewer mutes, with the mute's settings.
      type: object
      required: [account, notifications]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        notifications:
          description: Whether the mute also hides the account's notifications.
          type: boolean
        expires_at:
          description: When the mute ends; left out for a mute until unmuted.
          type: string
          format: date-time
    MuteDomainRequest:
      description: The domain to mute.
      type: object
      required: [domain]
      properties:
        domain:
          description: A remote domain, such as `mastodon.example`; its subdomains are muted too.
          type: string
          minLength: 1
          maxLength: 253
    DomainMute:
      description: A domain that the viewer mutes, with its subdomains.
      type: object
      required: [domain, created_at]
      properties:
        domain:
          description: The domain, in IDNA A-labels.
          type: string
        created_at:
          description: When the viewer muted the domain.
          type: string
          format: date-time
    DomainMutePage:
      description: A page of domain mutes.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [domain_mutes]
          properties:
            domain_mutes:
              type: array
              items:
                $ref: "#/components/schemas/DomainMute"
    ProfileField:
      description: One metadata field of a profile.
      type: object
      required: [name, value]
      properties:
        name:
          description: The field's name, as plain text.
          type: string
        value:
          description: The field's value as sanitized HTML.
          type: string
    CustomEmoji:
      description: |
        A custom emoji that a text uses (FR-111, ADR-0051 §4). The text has it as `:shortcode:`.
        An emoji that is disabled or deleted, or whose images come from a domain whose media the
        instance rejects (FR-702), is not listed, and its `:shortcode:` stays text. Clients show
        `static_url` when animations should not play (`prefers-reduced-motion`), and `url`
        otherwise.
      type: object
      required: [shortcode, url, static_url]
      properties:
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        url:
          description: The URL of the image, animated when the emoji is.
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji; the same as `url` when no still version is served.
          type: string
          format: uri
    Relationship:
      description: |
        The viewer's relationship with an account. It never says whether the account blocks
        the viewer: such an account is not found at all.
      type: object
      required: [id, following, requested, followed_by, requested_by, show_boosts, notify, blocking, muting, muting_notifications]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        following:
          description: Whether the viewer actively follows the account.
          type: boolean
        requested:
          description: Whether the viewer's follow request awaits the account's approval.
          type: boolean
        followed_by:
          description: Whether the account actively follows the viewer.
          type: boolean
        requested_by:
          description: Whether the account's follow request awaits the viewer's approval.
          type: boolean
        show_boosts:
          description: Whether the viewer's follow shows the account's boosts in the home timeline (true without a follow).
          type: boolean
        notify:
          description: Whether the viewer's follow notifies them of the account's new posts.
          type: boolean
        blocking:
          description: Whether the viewer blocks the account.
          type: boolean
        muting:
          description: Whether the viewer mutes the account (a mute that has not expired).
          type: boolean
        muting_notifications:
          description: Whether the viewer's mute also hides the account's notifications.
          type: boolean
    # --- End of accounts and relationships (#108) ---
    # --- media (#112) -------------------------------------------------------------------
    MediaAttachment:
      description: |
        A media file, as an upload of the user (the media operations) or as an attachment of
        a status (`Status.media_attachments`). `url`, `preview_url`, `variants`, and `blurhash`
        are present once the file is `ready`; statuses attach only ready files. In a status,
        `description` is the status revision's own copy of the alternative text, absent when the
        attachment has none.

        A file of a remote status is always `ready`: the instance does not process it, so it has
        no `variants`; `url` and `preview_url` are its media proxy URLs (federation.md §9),
        `remote_url` its URL on the remote server, and `meta`, `blurhash`, and `type` what the
        remote server declared.
      type: object
      required: [id, type, state, meta]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          description: |
            The kind of media. An accepted upload is an `image`, a `video`, or an `audio` file;
            a file that failed processing is `unknown`. `gifv` is a remote video that plays like
            an animated image: muted, looped, without controls.
          type: string
          enum: [image, gifv, video, audio, unknown]
        state:
          description: |
            The processing state: `processing` until the server has re-encoded the file,
            then `ready`, or `failed` when the content could not be processed.
          type: string
          enum: [processing, ready, failed]
        description:
          description: The alternative text; absent when there is none.
          type: string
          maxLength: 1500
        blurhash:
          description: The blurhash (https://blurha.sh) of the image, to show while it loads.
          type: string
        meta:
          $ref: "#/components/schemas/MediaMeta"
        variants:
          $ref: "#/components/schemas/MediaVariants"
        url:
          description: |
            Where the file is served on this instance; for an upload, `variants.large.url`, or
            `variants.animated.large.url` for an animation, and the file itself for a video or
            audio file.
          type: string
          format: uri
        preview_url:
          description: |
            Where its preview is served; for an upload, `variants.small.url` (still). A video or
            audio file without a poster has none.
          type: string
          format: uri
        remote_url:
          description: The file's URL on the remote server, for a file of a remote status; clients load `url` instead.
          type: string
          format: uri
    MediaFocus:
      description: |
        The focal point that previews keep in view when they crop the image, from -1.0 (left,
        bottom) to 1.0 (right, top) on each axis; (0, 0) is the center.
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          minimum: -1
          maximum: 1
        y:
          type: number
          format: double
          minimum: -1
          maximum: 1
    MediaMeta:
      description: What the server knows about the media file.
      type: object
      required: [focus]
      properties:
        width:
          description: The width of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        height:
          description: The height of the original image in pixels, after its EXIF orientation; absent until the file is ready, and for a remote file whose server declared none.
          type: integer
          minimum: 1
        focus:
          $ref: "#/components/schemas/MediaFocus"
        duration:
          description: The length of a video or audio file in seconds; absent for an image and until the file is ready.
          type: number
          format: double
          minimum: 0
    MediaUpdate:
      description: The changes to a media file; a property left out keeps its value.
      type: object
      properties:
        description:
          description: The alternative text; an empty string removes it. Text with U+0000 is a 422.
          type: string
          maxLength: 1500
        focus:
          $ref: "#/components/schemas/MediaFocus"
    MediaUpload:
      description: An upload of a media file.
      type: object
      required: [file]
      properties:
        file:
          description: The file. Its declared type, if any, must match its content.
          type: string
          format: binary
        description:
          description: The alternative text. Text that is not UTF-8 or has U+0000 is a 422.
          type: string
          maxLength: 1500
        purpose:
          description: |
            What the file is for, which picks the sizes of its variants: an `attachment` of a
            post (within 640 × 360, 1920 × 1080, and 3840 × 2160 pixels of area), an `avatar`
            (cropped to squares of 96, 192, and 400 pixels around the focal point), a `header`
            (within 750 × 250, 1500 × 500, and 3000 × 1000), or a custom `emoji` (within 64,
            128, and 256 pixels).
          type: string
          enum: [attachment, avatar, header, emoji]
          default: attachment
        thumbnail:
          description: |
            The poster of a video or audio file: an image that it shows before it plays, which
            the client takes from the file. Its declared type is ignored; it must be an image
            within the image limits. It is ignored for an image.
          type: string
          format: binary
    MediaVariant:
      description: |
        A rendition of a media file, without metadata. Its URL never serves other content, so
        it may be cached for good. `content_type`, `width`, `height`, and `size` are present
        for an upload, and absent where unknown for a remote file served through the media
        proxy.
      type: object
      required: [url]
      properties:
        url:
          description: Where the rendition is served.
          type: string
          format: uri
        content_type:
          description: The media type of the rendition.
          type: string
        width:
          description: The width in pixels.
          type: integer
          minimum: 1
        height:
          description: The height in pixels.
          type: integer
          minimum: 1
        size:
          description: The size of the file in bytes.
          type: integer
          format: int64
          minimum: 1
    MediaVariants:
      description: |
        The renditions of a ready media file within the sizes of its purpose (see
        `MediaUpload.purpose`), never larger than the file. `small`, `medium`, and `large` are
        still: for an animation, its first frame, and for a video or audio file, its poster
        (absent without one). Clients pick one by its width (`srcset`), and
        show `animated` instead only when the user lets animations play and does not prefer
        reduced motion.
      type: object
      required: [small, medium, large]
      properties:
        small:
          description: The still rendition for small views; WebP for an upload.
          $ref: "#/components/schemas/MediaVariant"
        medium:
          description: The still rendition for views across a screen; WebP for an upload.
          $ref: "#/components/schemas/MediaVariant"
        large:
          description: The largest still rendition, JPEG or PNG for an upload.
          $ref: "#/components/schemas/MediaVariant"
        animated:
          $ref: "#/components/schemas/MediaAnimatedVariants"
    MediaAnimatedVariants:
      description: |
        The moving renditions of an animation, absent for a still image: animated WebP for
        `small` and `medium`, and a GIF for `large`.
      type: object
      required: [small, medium, large]
      properties:
        small:
          $ref: "#/components/schemas/MediaVariant"
        medium:
          $ref: "#/components/schemas/MediaVariant"
        large:
          $ref: "#/components/schemas/MediaVariant"
    # --- end of media --------------------------------------------------------------------
    # --- moderation: the user's own actions (#336) ---
    ModerationAction:
      description: |
        A moderation action on the authenticated user's own account (FR-715, NFR-MOD-6), as the
        user sees it. It never carries the moderators' private note, the report the action
        follows from, or who filed the report or issued the action.
      type: object
      required: [id, kind, kind_label, reason_category, reason_category_label, status_ids, state, issued_at, appealable]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        kind_label:
          description: What the action does, in the user's language.
          type: string
        reason_category:
          $ref: "#/components/schemas/AdminAccountActionCategory"
        reason_category_label:
          description: The reason category, in the user's language.
          type: string
        public_reason:
          description: |
            The moderators' explanation to the user, as plain text; omitted when there is none.
          type: string
        status_ids:
          description: |
            The posts that an action on posts acted on; empty for an action on the whole account.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/AdminAccountActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted when it lasts until it is lifted.
          type: string
          format: date-time
        lifted_at:
          description: When a moderator lifted the action; omitted unless it is lifted.
          type: string
          format: date-time
        appealable:
          description: |
            Whether the user can appeal the action now (`POST /moderation/actions/{id}/appeal`):
            it has no appeal yet, `appeal_deadline` has not passed, and for a `ban` the account
            is not deleted.
          type: boolean
        appeal_deadline:
          description: |
            The last moment the action can be appealed: the instance's appeal window from the
            action, and for a `ban` no later than the deletion of the account.
          type: string
          format: date-time
        appeal:
          description: The user's appeal of the action; omitted when there is none.
          $ref: "#/components/schemas/ModerationAppeal"
    ModerationActionPage:
      description: A page of the actions on the user's own account, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ModerationAction"
    # --- end of moderation: the user's own actions (#336) ---
    # --- moderation: appeals (#337) ---
    AdminAppeal:
      description: |
        A local user's appeal of an action on their account, as the moderators see it, with the
        action.
      type: object
      required: [id, account_id, text, state, submitted_at, action]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        account_id:
          description: The account that appealed, which the action is on.
          allOf:
            - $ref: "#/components/schemas/Id"
        text:
          description: What the user wrote, as plain text.
          type: string
        state:
          $ref: "#/components/schemas/ModerationAppealState"
        submitted_at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/AdminAccountAction"
        decided_at:
          description: When a moderator decided the appeal; omitted while pending.
          type: string
          format: date-time
        decision_reason:
          description: The moderators' explanation of the decision to the user; omitted when there is none.
          type: string
        decided_by_account_id:
          description: |
            The account of the moderator who decided; omitted while pending and for a decision
            from the command line.
          allOf:
            - $ref: "#/components/schemas/Id"
    AdminAppealPage:
      description: A page of appeals, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAppeal"
    DeleteOwnAccountRequest:
      description: |
        The confirmation of the deletion of the user's own account: `password` or `passkey`.
      type: object
      properties:
        password:
          description: The user's current password.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: "#/components/schemas/PasskeyAssertion"
    PasswordStatus:
      description: Whether the authenticated user has a password.
      type: object
      required: [has_password]
      properties:
        has_password:
          description: |
            Whether the password signs in; false after the user removed it, when only the
            passkeys sign in.
          type: boolean
    RemovePasswordRequest:
      description: The passkey that confirms the removal of the user's password.
      type: object
      required: [passkey]
      properties:
        passkey:
          $ref: "#/components/schemas/PasskeyAssertion"
    ChangePasswordRequest:
      description: |
        A change of the user's password, confirmed with `current_password` or `passkey`.
      type: object
      required: [new_password]
      properties:
        current_password:
          description: The user's current password, which confirms the change.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: "#/components/schemas/PasskeyAssertion"
        new_password:
          description: The new password, 8 to 128 characters.
          type: string
          minLength: 1
          maxLength: 1024
    DataExport:
      description: A request for an archive of the user's data.
      type: object
      required: [id, state, requested_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          description: |
            `pending` while the archive is being built, `ready` while it can be downloaded,
            `failed` when it could not be built (request another one).
          type: string
          enum: [pending, ready, failed]
        requested_at:
          description: When the user asked for the export.
          type: string
          format: date-time
        completed_at:
          description: When the build ended; omitted while `pending`.
          type: string
          format: date-time
        expires_at:
          description: When the export and its archive are removed; omitted while `pending`.
          type: string
          format: date-time
        file_size:
          description: The size of the archive in bytes; only for `ready`.
          type: integer
          format: int64
          minimum: 0
    DataExportList:
      description: The user's latest data exports, newest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataExport"
    # --- Mastodon CSV exports and imports (#658) ---
    DataImportKind:
      description: |
        What a CSV file lists: `following` (the accounts the user follows), `blocks` (the
        accounts the user blocks), `mutes` (the accounts the user mutes), `domain_mutes` (the
        domains the user mutes, FR-304; Mastodon's `blocked_domains.csv` with the header
        `#domain`, which a Mastodon user's blocked domains become here), or `bookmarks` (the
        posts the user bookmarked).
      type: string
      enum: [following, blocks, mutes, domain_mutes, bookmarks]
    DataImportMode:
      description: |
        `merge` adds the file's entries and keeps what the user has; `overwrite` also removes
        what the user has that the file does not list.
      type: string
      enum: [merge, overwrite]
    DataImportRequest:
      description: A CSV file to import, and how.
      type: object
      required: [kind, mode, text]
      properties:
        kind:
          $ref: "#/components/schemas/DataImportKind"
        mode:
          $ref: "#/components/schemas/DataImportMode"
        text:
          description: The content of the CSV file, in UTF-8.
          type: string
          maxLength: 1000000
    DataImportPreview:
      description: What an import of a CSV file would do.
      type: object
      required: [entries, present, removals, skipped]
      properties:
        entries:
          description: The number of entries of the file, each of which the import adds.
          type: integer
          minimum: 0
        present:
          description: How many of the entries the user has already.
          type: integer
          minimum: 0
        removals:
          description: |
            How many things the user has of the kind that the file does not list, which an
            `overwrite` removes; 0 for a `merge`.
          type: integer
          minimum: 0
        skipped:
          description: The lines that are not entries, in line order.
          type: array
          items:
            $ref: "#/components/schemas/DataImportSkipped"
    DataImportSkipped:
      description: A line of a CSV file that is not an entry.
      type: object
      required: [line, value, reason]
      properties:
        line:
          description: The line of the file, from 1.
          type: integer
          minimum: 1
        value:
          description: The line as written.
          type: string
        reason:
          description: |
            `invalid`: the line names no account address (for bookmarks, no post URL; for
            domain mutes, no domain).
            `duplicate`: an earlier line names the same account, post, or domain.
          type: string
          enum: [invalid, duplicate]
    DataImport:
      description: An import of a CSV file, with its progress.
      type: object
      required: [id, kind, mode, state, created_at, total, processed, failed]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/DataImportKind"
        mode:
          $ref: "#/components/schemas/DataImportMode"
        state:
          description: "`in_progress` until every entry and removal is done, then `finished`."
          type: string
          enum: [in_progress, finished]
        created_at:
          description: When the import started.
          type: string
          format: date-time
        total:
          description: The number of entries to add and things to remove.
          type: integer
          minimum: 0
        processed:
          description: How many of them are done, including the failed ones.
          type: integer
          minimum: 0
        failed:
          description: |
            How many of them could not be carried out: an account or post that cannot be found
            or acted on, a follow that a block stops, or a domain that cannot be muted (this
            server's own, or one beyond the most muted domains allowed).
          type: integer
          minimum: 0
    DataImportList:
      description: The user's latest imports, newest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataImport"
    # --- end of Mastodon CSV exports and imports (#658) ---
    AppealModerationActionRequest:
      description: An appeal of an action on the user's own account.
      type: object
      required: [text]
      properties:
        text:
          description: Why the moderators should reconsider the action, as plain text.
          type: string
          minLength: 1
          maxLength: 2000
    DecideAppealRequest:
      description: The moderators' explanation of a decision on an appeal.
      type: object
      properties:
        public_reason:
          description: Shown to the user who appealed, as plain text.
          type: string
          maxLength: 2000
    ModerationAppeal:
      description: |
        The authenticated user's appeal of an action on their account. It never names the
        moderator who decided it.
      type: object
      required: [id, text, state, submitted_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: What the user wrote, as plain text.
          type: string
        state:
          $ref: "#/components/schemas/ModerationAppealState"
        submitted_at:
          type: string
          format: date-time
        decided_at:
          description: When the moderators decided the appeal; omitted while pending.
          type: string
          format: date-time
        decision_reason:
          description: The moderators' explanation of the decision, as plain text; omitted when there is none.
          type: string
    ModerationAppealState:
      description: |
        Where an appeal stands: `pending` awaits the moderators, `upheld` kept the action, and
        `overturned` lifted it.
      type: string
      enum: [pending, upheld, overturned]
    # --- end of moderation: appeals (#337) ---
    # --- notifications (#111) ---
    Notification:
      description: A notification of something that happened to the authenticated user.
      type: object
      required: [id, type, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/NotificationType"
        created_at:
          description: When it happened.
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        status:
          description: |
            The post that the notification is about, as the user sees it; omitted when the user
            may not see it.
          $ref: "#/components/schemas/Status"
        report:
          description: The user's report that a `report_resolved` tells of.
          $ref: "#/components/schemas/Report"
        moderation_action:
          description: |
            The action on the user's account that a `moderation_notice` tells of, or whose
            appeal an `appeal_decided` tells of, with the appeal.
          $ref: "#/components/schemas/ModerationAction"
        report_id:
          description: The report that an `admin_report` is about.
          allOf:
            - $ref: "#/components/schemas/Id"
        appeal_id:
          description: The appeal that an `admin_appeal` is about.
          allOf:
            - $ref: "#/components/schemas/Id"
        relationship_severance:
          $ref: "#/components/schemas/RelationshipSeverance"
        reaction:
          description: The emoji of a `reaction`; omitted for the other types.
          $ref: "#/components/schemas/ReactionEmoji"
    RelationshipSeverance:
      description: |
        The follows that a `relationships_severed` tells of: the user lost them when the
        moderators suspended a server (`domain_suspension`, `domain` is the server) or a remote
        account (`account_suspension`, the notification's `account` is the account). Both
        directions end, follow requests too, and lifting the suspension does not restore them;
        the counts are of the accepted follows.
      type: object
      required: [kind, followers_lost, following_lost]
      properties:
        kind:
          type: string
          enum:
            - domain_suspension
            - account_suspension
        domain:
          description: The suspended server of a `domain_suspension`; omitted otherwise.
          type: string
        followers_lost:
          description: The accounts that followed the user and no longer do.
          type: integer
          minimum: 0
        following_lost:
          description: The accounts that the user followed and no longer does.
          type: integer
          minimum: 0
    NotificationMarker:
      description: How far the authenticated user has read the notifications.
      type: object
      required: [unread_count]
      properties:
        last_read_id:
          description: The newest notification read; omitted when the user has read none.
          $ref: "#/components/schemas/Id"
        unread_count:
          description: The number of listed notifications newer than `last_read_id`.
          type: integer
          format: int64
          minimum: 0
    NotificationMarkerUpdate:
      description: The new position of the read marker.
      type: object
      required: [last_read_id]
      properties:
        last_read_id:
          $ref: "#/components/schemas/Id"
    NotificationPage:
      description: A page of notifications, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Notification"
    PushSubscription:
      description: The Web Push subscription of a grant.
      type: object
      required: [id, endpoint, alerts, server_key]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        endpoint:
          description: The push service URL of the browser's subscription.
          type: string
          format: uri
        alerts:
          description: The notification types that are pushed, in a stable order.
          type: array
          items:
            $ref: "#/components/schemas/NotificationType"
        server_key:
          description: |
            The instance's VAPID public key now. When it differs from the key the browser
            subscribed with, the subscription receives nothing; subscribe again.
          type: string
    PushSubscriptionRequest:
      description: A browser's push subscription and the notification types to push to it.
      type: object
      required: [endpoint, keys, alerts]
      properties:
        endpoint:
          description: The push service URL (`PushSubscription.endpoint`), an `https` URL.
          type: string
          maxLength: 2048
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        alerts:
          description: The notification types to push; empty pushes none.
          type: array
          maxItems: 14
          items:
            $ref: "#/components/schemas/NotificationType"
    PushSubscriptionKeys:
      description: The keys of a browser's push subscription (RFC 8291 §3), in base64url.
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          description: The browser's P-256 public key, an uncompressed point.
          type: string
          maxLength: 128
        auth:
          description: The 16-byte authentication secret.
          type: string
          maxLength: 32
    NotificationType:
      description: |
        The kind of a notification. `account` is the account that acted: the follower
        (`follow`, `follow_request`), the followed account (`follow_accepted`), the author
        (`mention`), the booster (`boost`), the account that favourited (`favourite`), or the
        account that reacted with an emoji (`reaction`, whose `reaction` is the emoji; a reaction
        with another emoji is another notification). `status` is the post that `mention`,
        `boost`, `favourite`, `reaction`, and `poll_closed` are about. `moderation_notice` comes from the instance and has no `account`; its
        `moderation_action` is the action on the user's account, with its kind, reason, and end.
        `report_resolved` also comes from the instance: its `report` is the user's report that
        the moderators resolved, without how they resolved it. It is sent once per report, even
        when the report is reopened and resolved again. `appeal_decided` also comes from the
        instance: the moderators decided the user's appeal, and its `moderation_action` is the
        action with the appeal and the decision.
        `relationships_severed` also comes from the instance: its `relationship_severance` tells
        how many follows the user lost when the moderators suspended a server or a remote
        account, whose `account` it carries for an account. It is sent once per suspension.
        The moderator notifications come from the instance too: `admin_report` (an account
        that had no open report was reported; `report_id` is the report) goes to the users
        with the `manage_reports` permission, `admin_sign_up` (a registration awaits
        approval; `account` is the new user's account) to those with `manage_accounts`, and
        `admin_appeal` (a user appealed an action; `appeal_id` is the appeal) to those with
        `manage_accounts`, and `admin_webhook_disabled` (the server disabled a webhook that
        answered 410 Gone or kept failing; it names none) to those with `manage_webhooks`.
      type: string
      enum:
        - follow
        - follow_request
        - follow_accepted
        - mention
        - boost
        - favourite
        - reaction
        - poll_closed
        - moderation_notice
        - report_resolved
        - admin_report
        - admin_sign_up
        - relationships_severed
        - appeal_decided
        - admin_appeal
        - admin_webhook_disabled
    # --- end notifications ---
    # --- statuses (#109): Status is shared with the other operations; MediaAttachment is in the media section ---
    CreateStatusRequest:
      description: A new status.
      type: object
      required: [text, visibility]
      properties:
        text:
          $ref: "#/components/schemas/StatusText"
        spoiler_text:
          $ref: "#/components/schemas/SpoilerText"
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: "#/components/schemas/StatusLanguageInput"
        visibility:
          $ref: "#/components/schemas/Visibility"
        in_reply_to_id:
          $ref: "#/components/schemas/Id"
        media:
          $ref: "#/components/schemas/StatusMediaInput"
        poll:
          $ref: "#/components/schemas/PollInput"
    PollInput:
      description: |
        A poll of a new status (FR-112). It ends `expires_in` seconds after the status is
        posted; the author and the users who voted are notified then.
      type: object
      required: [options, expires_in]
      properties:
        options:
          description: The options, in order, as plain text; each one different from the others.
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 50
        expires_in:
          description: How long the poll takes votes, in seconds (5 minutes to 30 days).
          type: integer
          minimum: 300
          maximum: 2592000
        multiple:
          description: Whether a vote may choose several options.
          type: boolean
        hide_totals:
          description: Whether the votes of each option are hidden until the poll ends.
          type: boolean
    EditStatusRequest:
      description: The new content of a status.
      type: object
      required: [text]
      properties:
        text:
          $ref: "#/components/schemas/StatusText"
        spoiler_text:
          $ref: "#/components/schemas/SpoilerText"
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        language:
          $ref: "#/components/schemas/StatusLanguageInput"
        media:
          $ref: "#/components/schemas/StatusMediaInput"
    SpoilerText:
      description: The content warning; omitted or empty for none. It counts toward `max_post_characters`.
      type: string
    Status:
      description: |
        A status (post), as the viewer sees it. `favourited`, `boosted`, and `bookmarked`
        describe the authenticated user's relation to it and are omitted for anonymous
        requests; `pinned` is only given to the author.

        In a timeline, a boost is a status of the booster with `boost` set to the boosted
        status: its `id` and `uri` are those of the boost, `created_at` is when it was boosted,
        `visibility` and `language` are those of the boosted status, its `content`,
        `spoiler_text`, `media_attachments`, `mentions`, `tags`, `emojis`, and `reactions` are
        empty, its `card` is omitted, and its counts are zero.
      type: object
      required:
        - id
        - uri
        - account
        - content
        - spoiler_text
        - sensitive
        - visibility
        - language
        - created_at
        - media_attachments
        - mentions
        - tags
        - emojis
        - replies_count
        - boosts_count
        - favourites_count
        - reactions
      properties:
        id:
          $ref: "#/components/schemas/Id"
        uri:
          description: The ActivityPub ID of the status.
          type: string
          format: uri
        url:
          description: |
            The HTML page of the status, on the server it belongs to for a remote status; omitted
            when it has none.
          type: string
          format: uri
        account:
          $ref: "#/components/schemas/Account"
        content:
          description: |
            The text as sanitized HTML, with mentions, hashtags, and URLs linked. The HTML of a
            remote status is what the server's sanitizer kept of the received document (ADR-0019 §2).
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        sensitive:
          description: Whether the media are sensitive.
          type: boolean
        visibility:
          $ref: "#/components/schemas/Visibility"
        language:
          description: The BCP 47 language tag of the text; `und` when it is unknown.
          type: string
        in_reply_to_id:
          $ref: "#/components/schemas/Id"
        in_reply_to_account_id:
          $ref: "#/components/schemas/Id"
        created_at:
          description: When the status was posted.
          type: string
          format: date-time
        boost:
          $ref: "#/components/schemas/Status"
        edited_at:
          description: When the status was last edited; omitted when it never was.
          type: string
          format: date-time
        media_attachments:
          description: The attached media, in order.
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
        mentions:
          description: The accounts the text mentions.
          type: array
          items:
            $ref: "#/components/schemas/StatusMention"
        tags:
          description: The hashtags of the text.
          type: array
          items:
            $ref: "#/components/schemas/StatusTag"
        emojis:
          description: |
            The custom emoji of the text, the content warning, and the poll's choices
            (ADR-0051). Clients show each `:shortcode:` of those texts that is in this list as its
            image, and the rest as text. Empty for a boost, whose emoji are those of `boost`.
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
        replies_count:
          description: The number of replies.
          type: integer
          minimum: 0
        boosts_count:
          description: The number of boosts.
          type: integer
          minimum: 0
        favourites_count:
          description: The number of favourites.
          type: integer
          minimum: 0
        reactions:
          description: |
            The emoji reactions to the status, counted per emoji: the 20 emoji with the most
            reactions, the most first. The others are seen in `listStatusReactions`. Favourites
            are counted apart, in `favourites_count`.
          type: array
          items:
            $ref: "#/components/schemas/StatusReaction"
        favourited:
          description: Whether the authenticated user favourited the status.
          type: boolean
        boosted:
          description: Whether the authenticated user boosts the status.
          type: boolean
        bookmarked:
          description: Whether the authenticated user bookmarked the status.
          type: boolean
        pinned:
          description: Whether the status is pinned to the author's profile; given only to the author.
          type: boolean
        poll:
          $ref: "#/components/schemas/Poll"
        card:
          $ref: "#/components/schemas/LinkCard"
    Poll:
      description: |
        The poll of a status (FR-112); omitted when the status has none. The counts of a poll of
        another server are those its server last reported. A poll whose author hides the votes of
        each option until it ends leaves out `votes_count` of its options until then. `voted` and
        `own_votes` describe the authenticated user's vote and are omitted for anonymous requests.
      type: object
      required: [id, multiple, expired, votes_count, options]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        expires_at:
          description: When the poll ends; omitted when it has no end.
          type: string
          format: date-time
        expired:
          description: Whether the poll has ended. An ended poll takes no votes and shows its results.
          type: boolean
        multiple:
          description: Whether a vote may choose several options.
          type: boolean
        votes_count:
          description: The number of votes, one per chosen option.
          type: integer
          minimum: 0
        voters_count:
          description: |
            The number of accounts that voted; omitted when it is unknown (a multiple-choice poll
            of another server that does not report it).
          type: integer
          minimum: 0
        options:
          description: The options, in order; a vote names them by their index in this list.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PollOption"
        voted:
          description: Whether the authenticated user voted in the poll.
          type: boolean
        own_votes:
          description: The indexes of the options the authenticated user voted for, in order.
          type: array
          items:
            type: integer
            minimum: 0
    PollOption:
      description: One option of a poll.
      type: object
      required: [title]
      properties:
        title:
          description: The option as plain text.
          type: string
        votes_count:
          description: |
            The number of votes for the option; omitted while the poll hides the votes of each
            option until it ends.
          type: integer
          minimum: 0
    VoteInPollRequest:
      description: A vote in the poll of a status.
      type: object
      required: [poll_id, choices]
      properties:
        poll_id:
          $ref: "#/components/schemas/Id"
        choices:
          description: The indexes of the chosen options in `Poll.options`; one for a single-choice poll.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 19
    LinkCard:
      description: |
        The card of the first link in a status (ADR-0062): the title, description, and image
        that the linked page declares (Open Graph, X Card, and JSON-LD), fetched by the server
        after the status was posted or received. Omitted from a status with attachments or a
        poll, from a status whose link has no card yet, and when the instance setting
        `link_cards_enabled` is off. A card appears after its fetch, so a status read right after
        it was posted may have none.

        Clients show the card as one link to `url` and, under a content warning, only once the
        warning is opened. When the status is `sensitive`, the image is hidden until the viewer
        shows it.
      type: object
      required: [url, title, description, site_name]
      properties:
        url:
          description: The page that the card links to, after redirects.
          type: string
          format: uri
        title:
          description: The title of the page, as plain text.
          type: string
        description:
          description: The description of the page, as plain text; empty when it has none.
          type: string
        site_name:
          description: The name of the site, as plain text; the host of `url` when the page names none.
          type: string
        author_name:
          description: The author that the page names, as plain text; omitted when it names none.
          type: string
        published_at:
          description: When the page says it was published; omitted when it does not say.
          type: string
          format: date-time
        language:
          description: The BCP 47 language of the page; omitted when it does not say.
          type: string
        image:
          $ref: "#/components/schemas/LinkCardImage"
        author:
          description: |
            The account that the page names as its creator (`fediverse:creator`), given only when
            the account's server lists the page's domain among its `attributionDomains`.
          $ref: "#/components/schemas/Account"
    LinkCardImage:
      description: |
        The image of a link card, served by this server's media proxy in the small size of an
        attachment's image. An animated image is its first frame.
      type: object
      required: [url, width, height]
      properties:
        url:
          description: The image through the media proxy.
          type: string
          format: uri
        width:
          description: The width of the original image in pixels.
          type: integer
          minimum: 1
        height:
          description: The height of the original image in pixels.
          type: integer
          minimum: 1
        blurhash:
          description: The blurhash (https://blurha.sh) of the image, to show while it loads.
          type: string
        description:
          description: The alternative text of the image (`og:image:alt`); omitted when it has none.
          type: string
    ReactionEmoji:
      description: |
        The emoji of a reaction: a Unicode emoji, or a custom emoji with its image. A custom
        emoji of another server is shown as it is and cannot be used to react from here.
      type: object
      required: [name]
      properties:
        name:
          description: |
            The emoji as `listStatusReactions` takes it: the Unicode emoji, the shortcode of a
            custom emoji of this server, or `shortcode@domain` for a custom emoji of another
            server.
          type: string
        shortcode:
          description: The shortcode of a custom emoji, without colons; omitted for a Unicode emoji.
          type: string
        domain:
          description: The server of a custom emoji of another server; omitted otherwise.
          type: string
        emoji:
          description: |
            The custom emoji with its image; omitted for a Unicode emoji and when the image cannot
            be shown (as `CustomEmoji` leaves such an emoji out).
          $ref: "#/components/schemas/CustomEmoji"
    StatusReaction:
      description: The reactions to a status with one emoji.
      allOf:
        - $ref: "#/components/schemas/ReactionEmoji"
        - type: object
          required: [count]
          properties:
            count:
              description: The number of the reactions with the emoji.
              type: integer
              minimum: 1
            me:
              description: |
                Whether the authenticated user reacted with the emoji; omitted for anonymous
                requests.
              type: boolean
    ReactToStatusRequest:
      description: The emoji to react with.
      type: object
      required: [emoji]
      properties:
        emoji:
          description: |
            A Unicode emoji, or the shortcode of a custom emoji of this server (the `name` of
            its `ReactionEmoji`; colons around it are accepted).
          type: string
          minLength: 1
          maxLength: 130
    StatusReactor:
      description: One emoji reaction to a status, with the account that reacted.
      type: object
      required: [account, emoji, created_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        emoji:
          $ref: "#/components/schemas/ReactionEmoji"
        created_at:
          description: When the account reacted.
          type: string
          format: date-time
    StatusReactionPage:
      description: A page of the emoji reactions to a status, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StatusReactor"
    StatusContext:
      description: The thread around a status.
      type: object
      required: [ancestors, descendants]
      properties:
        ancestors:
          description: The statuses the status replies to, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/Status"
        descendants:
          description: The replies to the status and their replies, depth first in posting order.
          type: array
          items:
            $ref: "#/components/schemas/Status"
    StatusEdit:
      description: One revision of a status.
      type: object
      required: [content, spoiler_text, sensitive, created_at, media_attachments, emojis]
      properties:
        content:
          description: The text of the revision as sanitized HTML.
          type: string
        spoiler_text:
          description: The content warning of the revision; empty when there is none.
          type: string
        sensitive:
          description: Whether the media of the revision are sensitive.
          type: boolean
        created_at:
          description: When the revision was made; the first one is when the status was posted.
          type: string
          format: date-time
        media_attachments:
          description: The media the revision attaches, in order.
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
        emojis:
          description: The custom emoji of the revision's text and content warning, as `Status.emojis`.
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
    StatusHistory:
      description: The revisions of a status.
      type: object
      required: [items]
      properties:
        items:
          description: The revisions, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/StatusEdit"
    StatusLanguageInput:
      description: A BCP 47 language tag; omitted means the user's default post language.
      type: string
      minLength: 1
      maxLength: 35
    StatusMediaInput:
      description: The media to attach, in order.
      type: array
      maxItems: 4
      items:
        $ref: "#/components/schemas/StatusMediaItem"
    StatusMediaItem:
      description: A media file to attach, with its alternative text.
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        description:
          description: |
            The alternative text; omitted or empty for none. While the instance requires alt
            text (`limits.require_media_description` of `GET /instance`), a post or an edit
            whose media file has none, or only spaces, is a 422.
          type: string
          maxLength: 1500
    StatusMention:
      description: An account that a status mentions.
      type: object
      required: [id, username, acct, url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          description: The username, without the domain.
          type: string
        acct:
          description: The username for local accounts, `username@domain` for remote ones.
          type: string
        domain:
          description: |
            The domain of the account: the domain of its handle, which for local accounts is the
            instance's account domain, or the host of its `uri` when a remote account has no
            confirmed handle.
          type: string
        uri:
          description: The ActivityPub id of the account's actor, on the server it belongs to.
          type: string
          format: uri
        url:
          description: The account's profile page.
          type: string
          format: uri
    StatusPage:
      description: A page of statuses.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              description: The statuses of the page.
              type: array
              items:
                $ref: "#/components/schemas/Status"
    AccountStatusPage:
      description: A page of the statuses of an account.
      allOf:
        - $ref: "#/components/schemas/StatusPage"
        - type: object
          properties:
            remote_fetch_started:
              description: |
                `true` when this request started fetching the remote account's recent public
                posts from its server (ADR-0044). The fetch runs in the background; read the
                first page again a few seconds later to see what it stored. Absent otherwise,
                including when a fetch started in the last day.
              type: boolean
    StatusSource:
      description: What the author typed, for editing a status.
      type: object
      required: [id, text, spoiler_text, language]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: The plain text.
          type: string
        spoiler_text:
          description: The content warning; empty when there is none.
          type: string
        language:
          description: The BCP 47 language tag; `und` when it is unknown.
          type: string
    StatusTag:
      description: A hashtag of a status.
      type: object
      required: [name, url]
      properties:
        name:
          description: The hashtag as written, without `#`.
          type: string
        url:
          description: The hashtag's page.
          type: string
          format: uri
    StatusText:
      description: The plain text; the server links mentions, hashtags, and URLs.
      type: string
      minLength: 1
    Visibility:
      description: |
        Who may see a status (ADR-0017): `public` everyone, listed on public timelines;
        `local` logged-in users of this instance and followers; `unlisted` everyone, kept off
        public timelines; `private` followers and mentioned accounts; `direct` mentioned
        accounts.
      type: string
      enum: [public, local, unlisted, private, direct]
    # --- end of statuses (#109) ---
    # --- The user's own profile and preferences (#113) ---
    AccountFieldSource:
      description: A metadata field of a profile as the user typed it.
      type: object
      required: [name, value]
      properties:
        name:
          description: The label, at most 255 characters.
          type: string
        value:
          description: The value as plain text, at most 255 characters.
          type: string
    AccountSource:
      description: The profile as the user typed it, for editing.
      type: object
      required: [note, fields]
      properties:
        note:
          description: The profile text as plain text; empty when there is none.
          type: string
        fields:
          description: The metadata fields as typed, in the order of the account's `fields`.
          type: array
          items:
            $ref: "#/components/schemas/AccountFieldSource"
        avatar_media_id:
          description: The media file of the avatar; omitted when there is none.
          type: string
        header_media_id:
          description: The media file of the header image; omitted when there is none.
          type: string
    CredentialAccount:
      description: The authenticated user's own account, with what only its owner sees.
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [discoverable, indexable, ai_opt_out, source, posting, permissions]
          properties:
            discoverable:
              description: Whether the account may be suggested to others and listed in directories.
              type: boolean
            indexable:
              description: |
                Whether the account's profile and public posts may be indexed for search: by this
                instance's search and, when the instance's `search_indexing` is `allow`, by search
                engines (FR-412, ADR-0057). New accounts take the instance's default.
              type: boolean
            ai_opt_out:
              description: |
                Whether the account's pages state that AI may neither train on nor use them
                (FR-412, ADR-0057), whatever the instance's `ai_usage`. The statement is made by the
                pages of this instance only; other servers and the media files do not carry it.
              type: boolean
            source:
              $ref: "#/components/schemas/AccountSource"
            posting:
              $ref: "#/components/schemas/PostingLimits"
            permissions:
              description: |
                The permissions that the user's roles grant, which the admin operations need; empty
                for a user without roles. Clients show the admin screens by them; the server checks
                the permission of each admin operation regardless.
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    UpdateCredentialsRequest:
      description: A change of the profile; properties left out keep their current values.
      type: object
      properties:
        display_name:
          description: The display name, at most 30 characters; empty removes it.
          type: string
        note:
          description: The profile text as plain text, at most 500 characters; empty removes it.
          type: string
        fields:
          description: The metadata fields, replacing the current ones; at most 4.
          type: array
          items:
            $ref: "#/components/schemas/AccountFieldSource"
        avatar_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the avatar; empty
            removes the avatar.
          type: string
        header_media_id:
          description: |
            The ID of a processed image that the user uploaded, to become the header image;
            empty removes the header image.
          type: string
        locked:
          description: Whether follow requests need the user's approval.
          type: boolean
        bot:
          description: Whether the account is automated.
          type: boolean
        discoverable:
          description: Whether the account may be suggested to others and listed in directories.
          type: boolean
        indexable:
          description: Whether the account's profile and public posts may be indexed for search (FR-412).
          type: boolean
        ai_opt_out:
          description: Whether the account's pages state that AI may neither train on nor use them (FR-412).
          type: boolean
    Preferences:
      description: The authenticated user's preferences.
      type: object
      required: [locale, time_zone, time_zone_chosen, default_visibility, default_post_language, require_media_description, email_moderator_notifications, timeline_languages]
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name such as `Asia/Tokyo`; `UTC` until one is chosen.
          type: string
        time_zone_chosen:
          description: |
            Whether a time zone has been chosen: false for a new user until a request sets
            `time_zone`. Clients may then set it to the device's time zone.
          type: boolean
        default_visibility:
          $ref: "#/components/schemas/Visibility"
        default_post_language:
          description: The language of new posts that name none, a BCP 47 language tag; `und` when undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: |
            Whether the moderator notifications (`admin_report`, `admin_sign_up`, `admin_appeal`)
            also come by email, to the primary address. Off for a new user.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, sorted; empty shows every language.
          type: array
          items:
            type: string
    UpdatePreferencesRequest:
      description: A change of the preferences; properties left out keep their current values.
      type: object
      properties:
        locale:
          description: The UI locale, a BCP 47 language tag.
          type: string
        time_zone:
          description: The time zone, an IANA name.
          type: string
        default_visibility:
          $ref: "#/components/schemas/Visibility"
        default_post_language:
          description: The language of new posts that name none; `und` for undetermined.
          type: string
        require_media_description:
          description: Whether clients ask for a description before posting media without one.
          type: boolean
        email_moderator_notifications:
          description: Whether the moderator notifications also come by email.
          type: boolean
        timeline_languages:
          description: The languages that timelines show, at most 64; empty shows every language.
          type: array
          maxItems: 64
          items:
            type: string
    # --- end profile and preferences ---
    # --- the user's automatic deletion of old posts (#657) ---
    AutoDeletePolicy:
      description: |
        The authenticated user's automatic deletion of their own old posts (FR-118). A post is
        deleted once it was published more than `min_age_days` days ago, unless one of the
        exceptions (the `keep_` properties) keeps it.
      type: object
      required: [enabled, min_age_days, keep_pinned, keep_bookmarked, keep_favourited, keep_media, keep_polls, keep_visibilities, keep_min_boosts, keep_min_favourites]
      properties:
        enabled:
          description: Whether old posts are deleted.
          type: boolean
        min_age_days:
          description: How many days after its publication a post is deleted.
          type: integer
          minimum: 1
          maximum: 3650
        keep_pinned:
          description: Keep the posts pinned to the profile.
          type: boolean
        keep_bookmarked:
          description: Keep the posts that the user bookmarked.
          type: boolean
        keep_favourited:
          description: Keep the posts that the user favourited.
          type: boolean
        keep_media:
          description: Keep the posts with media attachments.
          type: boolean
        keep_polls:
          description: Keep the posts with a poll.
          type: boolean
        keep_visibilities:
          description: Keep the posts with these visibilities, from the widest audience to the narrowest; empty keeps none for their visibility.
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Visibility"
        keep_min_boosts:
          description: Keep the posts boosted at least this many times; 0 keeps none for their boosts.
          type: integer
          minimum: 0
          maximum: 1000000
        keep_min_favourites:
          description: Keep the posts favourited at least this many times; 0 keeps none for their favourites.
          type: integer
          minimum: 0
          maximum: 1000000
    # --- end of the user's automatic deletion of old posts (#657) ---
    # --- two-factor authentication (#628) ---
    TwoFactor:
      description: Where the authenticated user's two-factor authentication (TOTP) stands.
      type: object
      required: [enabled]
      properties:
        enabled:
          description: Whether signing in asks for a code after the password.
          type: boolean
        enrolled_at:
          description: When the authenticator app was enrolled; omitted when not enabled.
          type: string
          format: date-time
        recovery_codes_remaining:
          description: How many recovery codes are unused; omitted when not enabled.
          type: integer
          minimum: 0
    TotpSetup:
      description: A new TOTP secret to add to an authenticator app.
      type: object
      required: [secret, uri, qr_code, setup_token, expires_at]
      properties:
        secret:
          description: The secret in base32, for typing it into the app.
          type: string
        uri:
          description: The `otpauth://totp/...` URI of the secret.
          type: string
        qr_code:
          $ref: "#/components/schemas/QrCode"
        setup_token:
          description: An opaque token that carries the secret to `POST /two_factor/totp`.
          type: string
        expires_at:
          description: When `setup_token` stops working.
          type: string
          format: date-time
    QrCode:
      description: |
        A QR code as an SVG path: draw `path` filled in a `size` × `size` view box (the quiet
        zone of four modules included) on a light background.
      type: object
      required: [size, path]
      properties:
        size:
          description: The width and height of the view box, in modules.
          type: integer
          minimum: 1
        path:
          description: The path data (`d`) of the dark modules, one unit per module.
          type: string
    EnableTotpRequest:
      description: The setup to enroll and a code of the app that shows it has the secret.
      type: object
      required: [setup_token, code]
      properties:
        setup_token:
          description: The `setup_token` of `POST /two_factor/totp/setup`.
          type: string
          maxLength: 1024
        code:
          description: The six-digit code that the app shows now.
          type: string
          maxLength: 64
    # --- passkeys (#639) ---
    Passkey:
      description: A passkey that signs the authenticated user in instead of the password.
      type: object
      required: [id, name, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          description: What the user calls the passkey, such as the device it is on.
          type: string
        created_at:
          description: When the passkey was registered.
          type: string
          format: date-time
    PasskeyList:
      description: The authenticated user's passkeys, oldest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Passkey"
    PasskeyRegistrationRequest:
      description: |
        The name of a new passkey and what confirms it: the user's `password` or a `passkey` of
        the user.
      type: object
      required: [name]
      properties:
        name:
          description: What the user calls the passkey; spaces around it are dropped.
          type: string
          minLength: 1
          maxLength: 64
        password:
          description: The user's current password.
          type: string
          minLength: 1
          maxLength: 1024
        passkey:
          $ref: "#/components/schemas/PasskeyAssertion"
    PasskeyRegistration:
      description: The start of a passkey registration.
      type: object
      required: [options, registration_token, expires_at]
      properties:
        options:
          description: |
            The `PublicKeyCredentialCreationOptionsJSON` of WebAuthn Level 3 (§5.1.8): binary
            values in base64url, for `PublicKeyCredential.parseCreationOptionsFromJSON()`.
          type: object
          additionalProperties: true
        registration_token:
          description: An opaque token that carries the registration to `POST /passkeys`.
          type: string
        expires_at:
          description: When `registration_token` stops working.
          type: string
          format: date-time
    PasskeyConfirmation:
      description: The start of a confirmation with a passkey.
      type: object
      required: [options, confirmation_token, expires_at]
      properties:
        options:
          description: |
            The `PublicKeyCredentialRequestOptionsJSON` of WebAuthn Level 3 (§5.1.9): binary
            values in base64url, for `PublicKeyCredential.parseRequestOptionsFromJSON()`.
          type: object
          additionalProperties: true
        confirmation_token:
          description: An opaque token that carries the confirmation to the operation it confirms.
          type: string
        expires_at:
          description: When `confirmation_token` stops working.
          type: string
          format: date-time
    PasskeyAssertion:
      description: The browser's answer to a confirmation with a passkey, which confirms an operation.
      type: object
      required: [confirmation_token, credential]
      properties:
        confirmation_token:
          description: The `confirmation_token` of `POST /passkeys/confirmation`.
          type: string
          maxLength: 4096
        credential:
          description: |
            The `AuthenticationResponseJSON` of WebAuthn Level 3 (§5.1): what
            `PublicKeyCredential.toJSON()` returns for the passkey.
          type: object
          additionalProperties: true
    CreatePasskeyRequest:
      description: The browser's answer to a passkey registration.
      type: object
      required: [registration_token, credential]
      properties:
        registration_token:
          description: The `registration_token` of `POST /passkeys/registration`.
          type: string
          maxLength: 4096
        credential:
          description: |
            The `RegistrationResponseJSON` of WebAuthn Level 3 (§5.1): what
            `PublicKeyCredential.toJSON()` returns for the new credential.
          type: object
          additionalProperties: true
    # --- end of passkeys (#639) ---
    TwoFactorCodeRequest:
      description: A code that confirms an operation on two-factor authentication.
      type: object
      required: [code]
      properties:
        code:
          description: A six-digit code of the app or an unused recovery code.
          type: string
          maxLength: 64
    RecoveryCodes:
      description: |
        Recovery codes, each of which signs in once in place of a code of the app. They are
        shown only once.
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    # --- end of two-factor authentication (#628) ---
    # --- The viewer's posting limits (#207) ---
    PostingLimits:
      description: |
        What the account's current moderation restrictions let it post (data-model.md §5.4). The
        server applies the same policy when it posts: a status asked for with a visibility that is
        not in `visibilities` gets `visibility_ceiling` instead.
      type: object
      required: [visibility_ceiling, visibilities]
      properties:
        visibility_ceiling:
          $ref: "#/components/schemas/Visibility"
        visibilities:
          description: |
            The visibilities that a new status keeps as asked for, from the widest audience to the
            narrowest; every visibility while the account is not restricted.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Visibility"
    # --- end of the viewer's posting limits (#207) ---
    # --- admin (#261) ---
    AdminAvailabilityEvent:
      description: The time a remote server was marked unavailable or available again, and why.
      type: object
      required: [id, kind, reason, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [marked_unavailable, marked_available]
        reason:
          description: |
            `failure_days`: deliveries failed on 7 distinct days. `delivery_succeeded`: a delivery
            succeeded. `inbound_request`: the server sent a signed request. `probe_succeeded`: the
            daily probe fetched its NodeInfo. `operator`: an operator marked it.
          type: string
          enum: [failure_days, delivery_succeeded, inbound_request, probe_succeeded, operator]
        occurred_at:
          type: string
          format: date-time
    AdminAvailabilityEventPage:
      description: A page of availability events, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAvailabilityEvent"
    AdminJobState:
      description: |
        The state of a job. `queued`: it has not run yet and waits for its `run_at` or a worker.
        `running`: a worker holds it. `retrying`: it ran and waits to run again. `dead`: it
        failed for good (its handler gave up, or it used up its attempts).
      type: string
      enum: [queued, running, retrying, dead]
    AdminJob:
      description: A job of the job queue.
      type: object
      required: [id, type, state, payload, attempts, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          description: The job type, such as `federation.deliver`.
          type: string
        state:
          $ref: "#/components/schemas/AdminJobState"
        payload:
          description: The job's payload, a JSON document as text.
          type: string
        idempotency_key:
          type: string
        ordering_key:
          type: string
        attempts:
          description: The number of runs the job had, the one in progress included.
          type: integer
          minimum: 0
        last_error:
          description: Why the last run failed; omitted for a job whose runs did not fail.
          type: string
        run_at:
          description: When a pending job is due; omitted for a dead job.
          type: string
          format: date-time
        worker:
          description: The worker that runs a `running` job.
          type: string
        locked_until:
          description: When the lease of a `running` job ends; another worker may run it after.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        failed_at:
          description: When a dead job failed.
          type: string
          format: date-time
    AdminJobPage:
      description: A page of jobs.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminJob"
    AdminJobCount:
      description: The number of jobs of one type in one state.
      type: object
      required: [state, type, count]
      properties:
        state:
          $ref: "#/components/schemas/AdminJobState"
        type:
          type: string
        count:
          type: integer
          format: int64
          minimum: 1
    AdminQueue:
      description: The state of the job queue (ADR-0064).
      type: object
      required: [adapter, pending_listing, counts]
      properties:
        adapter:
          description: The queue the server runs, the `queue` setting (`db`, `inline`, `sqs`, `cloudtasks`).
          type: string
        pending_listing:
          description: Whether the queue lists its pending jobs (`queued`, `running`, `retrying`).
          type: boolean
        counts:
          description: |
            The jobs by state (`queued`, `running`, `retrying`, `dead`) then type; states and
            types without jobs are left out. Empty without `pending_listing`.
          type: array
          items:
            $ref: "#/components/schemas/AdminJobCount"
        oldest_ready_at:
          description: |
            The earliest `run_at` among the due jobs that no worker holds: how long the queue
            has kept a job waiting. Omitted when no job waits, or without `pending_listing`.
          type: string
          format: date-time
    AdminJobAttempt:
      description: A run of a job that did not succeed.
      type: object
      required: [attempt, type, outcome, error, worker, started_at, finished_at]
      properties:
        attempt:
          description: The number of the run, from 1.
          type: integer
          minimum: 1
        type:
          description: The job type.
          type: string
        outcome:
          description: "`retry`: the job runs again. `dead`: it failed for good."
          type: string
          enum: [retry, dead]
        error:
          description: Why the run failed, at most 2,000 bytes.
          type: string
        worker:
          description: The worker that ran it.
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AdminJobAttemptPage:
      description: A page of attempts, the most recently finished first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminJobAttempt"
    AdminInstanceHealth:
      description: Whether deliveries go to a remote server (federation.md §7.3).
      type: object
      required: [domain, state, failure_days]
      properties:
        domain:
          type: string
        state:
          $ref: "#/components/schemas/AdminInstanceState"
        since:
          description: When the server entered its state; omitted for a server without failures.
          type: string
          format: date-time
        failure_days:
          description: The number of distinct UTC days of the latest run of failed deliveries.
          type: integer
          minimum: 0
        last_failure_day:
          description: The latest of those days; omitted without failures.
          type: string
          format: date
    AdminInstanceHealthPage:
      description: A page of server health, in domain order.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminInstanceHealth"
    AdminInstanceState:
      description: |
        `available` servers get every delivery; `unavailable` ones only `Follow`, `Accept`, and
        `Reject`.
      type: string
      enum: [available, unavailable]
    # --- end of admin (#261) ---
    # --- admin: audit log (#330) ---
    AdminAuditAction:
      description: |
        The kind of an audited operation, each on one kind of target. On an `account`:
        `account_action_issued`, `account_action_lifted`, `account_deletion_cancelled`,
        `revealed_private_data` (a moderator was shown the account's email address and IP
        addresses), `two_factor_disabled` (an administrator removed the account's two-factor
        authentication), `password_reset_link_issued` (an administrator issued a link that sets
        a new password for the account's user). On a `domain`:
        `domain_action_issued`, `domain_action_lifted`. On a `report`: `report_assigned`,
        `report_unassigned`, `report_resolved`, `report_reopened`, `report_note_added`. On a
        `user` (a registration):
        `registration_approved`, `registration_rejected`. On a `setting`: `setting_changed`
        (an instance setting), `text_changed` (an instance text). On a `rule`:
        `rule_added`, `rule_revised`, `rule_moved`, `rule_retired`. On a `role`: `role_granted`,
        `role_revoked` (a role of a user; the label is the key and the handle), `role_created`,
        `role_updated` (its position or permissions), `role_deleted` (the label is the key). On
        an `appeal`:
        `appeal_upheld`, `appeal_overturned` (which also records the action's
        `account_action_lifted`, and for a `ban` the `account_deletion_cancelled` on the
        `account`). On a `signup_block`: `signup_block_added`, `signup_block_lifted`. On a
        `custom_emoji`: `custom_emoji_created`, `custom_emoji_image_replaced`,
        `custom_emoji_copied` (a new local emoji copied from a remote one),
        `custom_emoji_updated` (its category, aliases, or place in the picker),
        `custom_emoji_enabled`, `custom_emoji_disabled`, `custom_emoji_deleted`. On a `webhook`:
        `webhook_created`, `webhook_updated` (its URL, description, or events),
        `webhook_deleted`, `webhook_enabled`, `webhook_disabled` (by the `system` when the
        endpoint answered 410 Gone or kept failing), `webhook_secret_rotated`; the label is its
        description and the host name of its URL, never the URL. On an `announcement`:
        `announcement_created`, `announcement_updated` (its text or window),
        `announcement_published`, `announcement_withdrawn`; the label is the first line of its
        text. On an `invite`: `invite_created`, `invite_revoked`; the label is the first
        characters of its code, never the whole code. On a `relay`: `relay_added`,
        `relay_followed`, `relay_unfollowed`, `relay_removed`, and `relay_accepted`,
        `relay_rejected` (by the `remote` relay); the label is its URL.
      type: string
      enum:
        - account_action_issued
        - account_action_lifted
        - domain_action_issued
        - domain_action_lifted
        - report_assigned
        - report_unassigned
        - report_resolved
        - report_reopened
        - report_note_added
        - registration_approved
        - registration_rejected
        - setting_changed
        - text_changed
        - rule_added
        - rule_revised
        - rule_moved
        - rule_retired
        - role_granted
        - role_revoked
        - role_created
        - role_updated
        - role_deleted
        - appeal_upheld
        - appeal_overturned
        - account_deletion_cancelled
        - revealed_private_data
        - signup_block_added
        - signup_block_lifted
        - two_factor_disabled
        - password_reset_link_issued
        - custom_emoji_created
        - custom_emoji_image_replaced
        - custom_emoji_copied
        - custom_emoji_updated
        - custom_emoji_enabled
        - custom_emoji_disabled
        - custom_emoji_deleted
        - webhook_created
        - webhook_updated
        - webhook_deleted
        - webhook_enabled
        - webhook_disabled
        - webhook_secret_rotated
        - announcement_created
        - announcement_updated
        - announcement_published
        - announcement_withdrawn
        - invite_created
        - invite_revoked
        - relay_added
        - relay_followed
        - relay_unfollowed
        - relay_removed
        - relay_accepted
        - relay_rejected
    AdminAuditActorKind:
      description: |
        Who performed the operation. `user`: a signed-in moderator or administrator.
        `cli`: the `my` command line, which acts as no user. `system`: the server itself.
        `remote`: another server.
      type: string
      enum: [user, cli, system, remote]
    AdminAuditEntry:
      description: One operation of a moderator or an administrator (FR-704).
      type: object
      required: [id, actor_kind, action, target_kind, target_id, target_label, target_exists, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        actor_kind:
          $ref: "#/components/schemas/AdminAuditActorKind"
        actor_account_id:
          description: |
            The local account of the user who performed the operation; omitted unless
            `actor_kind` is `user`, and when the user has no account.
          allOf:
            - $ref: "#/components/schemas/Id"
        actor_account:
          description: The account of `actor_account_id`; omitted when it is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        action:
          $ref: "#/components/schemas/AdminAuditAction"
        target_kind:
          $ref: "#/components/schemas/AdminAuditTargetKind"
        target_id:
          description: |
            The target: the ID of an account, a report, an appeal, a user, a role, a rule, a
            sign-up block, a custom emoji, a webhook, or an invite, the domain of a domain action,
            or the key of a setting or a text.
          type: string
        target_label:
          description: |
            The target's display name when the operation happened, such as `@alice`,
            `@bob@example.com`, a domain, a setting's key, a rule's text, or a sign-up block's
            kind and value (`email_domain spam.example`); up to 512 characters.
          type: string
        target_exists:
          description: |
            Whether the target is still there to look at. It is `false` for an account, a report,
            an appeal, or a sign-up block that is gone (erased past its retention), and for a
            role, a custom emoji, a webhook, or a relay that was deleted, which only `target_label`
            names now. It is `true` for the other kinds of targets, which are never removed.
          type: boolean
        source_event_id:
          description: |
            The ID of the record of the operation (the domain action, the assignment, the
            resolution, the reopening, the note, the decision, the revision), which holds its
            reasons and notes; omitted when the operation has none.
          type: string
        occurred_at:
          type: string
          format: date-time
    AdminAuditEntryPage:
      description: A page of the audit log, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAuditEntry"
    AdminAuditTargetKind:
      description: The kind of what an audited operation acted on.
      type: string
      enum: [account, status, domain, report, appeal, user, role, setting, rule, signup_block, custom_emoji, webhook, announcement, invite, relay]
    # --- end of admin: audit log (#330) ---
    # --- admin: domain actions and reports (#296) ---
    AdminDomainAction:
      description: A moderation action on a remote domain and its subdomains (FR-702).
      type: object
      required: [id, domain, kind, obfuscate, state, issued_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        domain:
          description: The domain, in IDNA A-labels.
          type: string
        kind:
          $ref: "#/components/schemas/AdminDomainActionKind"
        public_comment:
          description: The reason that may be shown publicly; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        obfuscate:
          description: Whether a public list of the domain actions hides part of the domain.
          type: boolean
        state:
          $ref: "#/components/schemas/AdminDomainActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
    AdminDomainActionKind:
      description: |
        `suspend`: no federation with the domain at all. `limit`: its posts stay off the public
        timelines and its accounts reach only their followers. `reject_media`: its media are
        not fetched. `reject_reports`: its reports are dropped. `force_sensitive`: its media
        are marked sensitive.
      type: string
      enum: [limit, suspend, reject_media, reject_reports, force_sensitive]
    AdminDomainActionPage:
      description: A page of domain actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminDomainAction"
    AdminDomainActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum: [active, expired, lifted]
    AdminReport:
      description: A report of an account to the moderators (FR-701).
      type: object
      required: [id, category, comment, forwarded, filed_at, state, state_changed_at, reporter_account_id, target_account_id, status_ids, rule_ids]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        uri:
          description: |
            The `id` of the `Flag` activity that another server sent; omitted for a report
            made on this server.
          type: string
        category:
          type: string
          enum: [spam, legal, violation, other]
        comment:
          description: The reporter's comment as plain text, up to 5,000 characters.
          type: string
        forwarded:
          description: Whether the report was forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/AdminReportState"
        outcome:
          $ref: "#/components/schemas/AdminReportOutcome"
        state_changed_at:
          description: When the report entered its state (when it was filed, resolved, or reopened).
          type: string
          format: date-time
        assignee_account_id:
          description: |
            The account of the moderator who handles the report; omitted when nobody does.
          allOf:
            - $ref: "#/components/schemas/Id"
        reporter_account_id:
          $ref: "#/components/schemas/Id"
        reporter_account:
          description: The reporter, often the instance actor of a remote server; omitted when the account is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        target_account_id:
          $ref: "#/components/schemas/Id"
        target_account:
          description: The account reported; omitted when the account is gone.
          allOf:
            - $ref: "#/components/schemas/Account"
        status_ids:
          description: The IDs of the target's posts that the report points at.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        rule_ids:
          description: |
            The IDs of the instance rules that the report cites, retired ones included; only a
            report of the `violation` category cites rules.
          type: array
          items:
            $ref: "#/components/schemas/Id"
    AdminReportOutcome:
      description: |
        How the report was resolved, present only while it is resolved. `actioned`: a moderator
        took an action on the target. `dismissed`: there was nothing to act on.
      type: string
      enum: [actioned, dismissed]
    AdminReportPage:
      description: A page of reports, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminReport"
    AdminReportState:
      description: "`open` reports await the moderators; `resolved` ones are handled."
      type: string
      enum: [open, resolved]
    CreateDomainActionRequest:
      description: A moderation action to take on a domain.
      type: object
      required: [domain, kind]
      properties:
        domain:
          description: |
            The remote domain, such as `spam.example`; a U-label spelling such as `例え.jp` is
            accepted. The action covers its subdomains.
          type: string
          minLength: 1
          maxLength: 253
        kind:
          $ref: "#/components/schemas/AdminDomainActionKind"
        public_comment:
          type: string
          maxLength: 5000
        private_note:
          type: string
          maxLength: 5000
        obfuscate:
          type: boolean
          default: false
        expires_in:
          description: The seconds the action lasts; omitted, it lasts until it is lifted.
          type: integer
          minimum: 1
    ResolveReportRequest:
      description: How a report is resolved.
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/AdminReportOutcome"
    # --- end of admin: domain actions and reports (#296) ---
    # --- admin: report notes and reopenings (#333) ---
    AdminReportDetail:
      description: |
        A report as a moderator opens it: the report with its internal notes, the posts it
        points at, and what the moderators had about its target.
      allOf:
        - $ref: "#/components/schemas/AdminReport"
        - type: object
          required: [notes, target_history, statuses]
          properties:
            notes:
              description: The moderators' notes on the report, oldest first.
              type: array
              items:
                $ref: "#/components/schemas/AdminReportNote"
            target_history:
              $ref: "#/components/schemas/AdminReportTargetHistory"
            statuses:
              description: |
                The posts that the report points at, in the order of `status_ids`, whatever
                their visibility and also when their author deleted them, for the moderators to
                review. A post that the server no longer has is left out.
              type: array
              items:
                $ref: "#/components/schemas/AdminReportStatus"
    AdminReportNote:
      description: A moderator's internal note on a report; never shown to the target or the reporter.
      type: object
      required: [id, body, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        author_account_id:
          description: |
            The account of the moderator who wrote the note; omitted for a note from the
            command line and when the moderator has no account.
          allOf:
            - $ref: "#/components/schemas/Id"
        body:
          description: The note as plain text, up to 2,000 characters.
          type: string
        created_at:
          type: string
          format: date-time
    AdminReportStatus:
      description: |
        A post that a report points at, as a moderator reviews it. `status` is the post as it
        was last, without the moderator's own relation to it (`favourited`, `boosted`,
        `bookmarked`, and `pinned` are omitted).
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/Status"
        deleted_at:
          description: When the post was deleted, by its author or otherwise; omitted when it is not.
          type: string
          format: date-time
    AdminReportTargetHistory:
      description: What the moderators had about the target of a report.
      type: object
      required: [reports_count, actions_count]
      properties:
        reports_count:
          description: The number of the target's other reports, open and resolved.
          type: integer
          format: int64
          minimum: 0
        actions_count:
          description: The number of moderation actions on the target, ended ones included.
          type: integer
          format: int64
          minimum: 0
    CreateReportNoteRequest:
      description: A note to add to a report.
      type: object
      required: [body]
      properties:
        body:
          description: The note as plain text; it may not be blank.
          type: string
          minLength: 1
          maxLength: 2000
    # --- end of admin: report notes and reopenings (#333) ---
    # --- admin: account actions (#316) ---
    AdminAccountAction:
      description: A moderation action on an account (FR-703).
      type: object
      required: [id, account_id, kind, reason_category, issuer, notify_target, state, issued_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        account_id:
          description: The account the action is on.
          allOf:
            - $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        reason_category:
          $ref: "#/components/schemas/AdminAccountActionCategory"
        public_reason:
          description: The reason shown to the account; omitted when there is none.
          type: string
        private_note:
          description: The moderators' note; omitted when there is none.
          type: string
        report_id:
          description: The report the action follows from; omitted when there is none.
          allOf:
            - $ref: "#/components/schemas/Id"
        issuer:
          description: |
            `moderator`: a moderator or the CLI. `system`: this server by itself. `remote`: the
            account's own server.
          type: string
          enum: [moderator, system, remote]
        issued_by_account_id:
          description: |
            The account of the moderator who took the action; omitted for the CLI and the
            system.
          allOf:
            - $ref: "#/components/schemas/Id"
        notify_target:
          description: Whether the account is told of the action.
          type: boolean
        state:
          $ref: "#/components/schemas/AdminAccountActionState"
        issued_at:
          type: string
          format: date-time
        expires_at:
          description: When the action ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the action was lifted; omitted until it is.
          type: string
          format: date-time
        lift_reason:
          description: Why the action was lifted; omitted until it is or when no reason was given.
          type: string
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on, in ID order; omitted for the other kinds.
          type: array
          items:
            $ref: "#/components/schemas/Id"
    AdminAccountActionCategory:
      description: The kind of reason for an action.
      type: string
      enum: [spam, legal, violation, other]
    AdminAccountActionKind:
      description: |
        `warn`: a notice only. `mark_statuses_sensitive` and `delete_statuses`: actions on
        posts. `force_sensitive`: every attachment is shown as sensitive. `limit`: every post is
        followers-only and stays off the public timelines. `restrict_posting`: no posting.
        `restrict_interaction`: no following, favouriting, boosting, or replying.
        `disable_login`: no logging in. `suspend`: all of these, and the profile and posts are
        hidden. `ban`: a suspension that never ends, with the deletion of the account.
      type: string
      enum:
        - warn
        - mark_statuses_sensitive
        - delete_statuses
        - force_sensitive
        - limit
        - restrict_posting
        - restrict_interaction
        - disable_login
        - suspend
        - ban
    AdminAccountActionPage:
      description: A page of account actions, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAccountAction"
    AdminAccountActionState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum: [active, expired, lifted]
    CreateAccountActionRequest:
      description: A moderation action to take on an account.
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/AdminAccountActionKind"
        reason_category:
          allOf:
            - $ref: "#/components/schemas/AdminAccountActionCategory"
          default: other
        public_reason:
          description: The reason shown to the account.
          type: string
          maxLength: 5000
        private_note:
          description: A note for the moderators only.
          type: string
          maxLength: 5000
        report_id:
          description: |
            The report of the account that the action follows from. The action resolves an open
            report as `actioned` in the same operation; a resolved report stays as it is.
          allOf:
            - $ref: "#/components/schemas/Id"
        notify_target:
          description: Whether a local account is told of the action; ignored for a remote one.
          type: boolean
          default: true
        expires_in:
          description: |
            The seconds the action lasts; omitted, it lasts until it is lifted. A `ban` and the
            actions on posts take none.
          type: integer
          minimum: 1
        status_ids:
          description: |
            The posts of the account that `delete_statuses` or `mark_statuses_sensitive` acts
            on; required for them and taken by no other kind.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
        block_email:
          description: |
            Whether a `ban` also blocks sign-ups with the email address of the account's user (a
            `reject` sign-up block of kind `email_hash`, FR-719); only a `ban` of a local
            account takes it, and a user without an email address is a 422. Omitted, nothing is
            blocked.
          type: boolean
    LiftAccountActionRequest:
      description: Why an action on an account is lifted.
      type: object
      properties:
        reason:
          type: string
          maxLength: 5000
    # --- end of admin: account actions (#316) ---
    # --- the viewer's permissions (#267) ---
    Permission:
      description: |
        A capability that a role grants. `manage_accounts`: the accounts and their moderation
        actions.
        `manage_domains`: the health of remote servers and the moderation actions on domains.
        `manage_reports`: the reports. `manage_rules`: the instance rules. `manage_roles`: the
        roles of users. `manage_jobs`: the dead jobs of the job queue. `view_audit`: the audit
        log. `manage_login_recovery`: recovering a local user's sign-in, by removing their two-factor
        authentication or issuing a password reset link (only the built-in admin role by
        default). `manage_custom_emojis`: the custom emoji, local and
        remote. `manage_webhooks`: the webhooks of the instance. `manage_announcements`: the
        server's announcements to every local user. The others guard no client API operation
        yet.
      type: string
      enum:
        - manage_reports
        - manage_accounts
        - manage_domains
        - manage_rules
        - manage_settings
        - manage_roles
        - manage_invites
        - view_audit
        - manage_jobs
        - manage_login_recovery
        - manage_custom_emojis
        - manage_webhooks
        - manage_announcements
    # --- end of the viewer's permissions (#267) ---
    # --- admin: instance rules (#331) ---
    AdminRule:
      description: |
        A rule of the instance (FR-705). Its ID stays the same across revisions, so reports keep
        citing it.
      type: object
      required: [id, position, text, created_at, revised_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        position:
          description: |
            The sort key of the rule; the rules in effect are listed by it. Retiring a rule
            leaves a gap until the next move.
          type: integer
          minimum: 1
        text:
          description: The rule, on one line, as plain text.
          type: string
        hint:
          description: An explanation of the rule, as plain text; omitted when there is none.
          type: string
        created_at:
          type: string
          format: date-time
        revised_at:
          description: When the current revision was recorded.
          type: string
          format: date-time
        retired_at:
          description: When the rule was retired; omitted for a rule in effect.
          type: string
          format: date-time
    AdminRuleList:
      description: The rules.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRule"
    InstanceRuleInput:
      description: |
        The text and the hint of a rule, written once in any language and shown as they are in
        every locale; they replace the earlier ones.
      type: object
      required: [text]
      properties:
        text:
          description: The rule, on one line, as plain text.
          type: string
          minLength: 1
          maxLength: 300
        hint:
          description: An explanation of the rule, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    MoveInstanceRuleRequest:
      description: The new place of a rule.
      type: object
      required: [position]
      properties:
        position:
          description: The place among the rules in effect, from 1.
          type: integer
          minimum: 1
    # --- end of admin: instance rules (#331) ---
    # --- announcements (#665) ---
    Announcement:
      description: An announcement of the server to every local user (FR-726), as the user sees it.
      type: object
      required: [id, content, published_at, updated_at, read]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        content:
          description: |
            The text as an HTML fragment, sanitized (paragraphs, emphasis, lists, quotes, code,
            headings from `h2`, and `http`, `https`, and `mailto` links).
          type: string
        published_at:
          description: When it started to show to the users, its publication or the start of its window.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing; omitted when it shows until it is withdrawn.
          type: string
          format: date-time
        updated_at:
          description: When its text or window last changed.
          type: string
          format: date-time
        read:
          description: Whether the user has marked it read.
          type: boolean
    AnnouncementList:
      description: The announcements.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
    # --- end of announcements (#665) ---
    # --- admin: announcements (#665) ---
    AdminAnnouncementState:
      description: |
        `draft`: no user sees it. `published`: every local user sees it within its window.
        `withdrawn`: taken down for good.
      type: string
      enum: [draft, published, withdrawn]
    AdminAnnouncement:
      description: An announcement with its Markdown text and its state.
      type: object
      required: [id, text, content, state, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          description: The text, in Markdown.
          type: string
        content:
          description: The text as the users get it, an HTML fragment (`Announcement.content`).
          type: string
        state:
          $ref: "#/components/schemas/AdminAnnouncementState"
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing; omitted to show it until it is withdrawn.
          type: string
          format: date-time
        published_at:
          description: When it was last published; omitted for a draft.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When its text or window last changed.
          type: string
          format: date-time
    AdminAnnouncementList:
      description: The announcements, newest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAnnouncement"
    AdminAnnouncementInput:
      description: The text and the window of an announcement.
      type: object
      required: [text]
      properties:
        text:
          description: The text, in Markdown.
          type: string
          minLength: 1
          maxLength: 5000
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing, after `starts_at`; omitted to show it until it is withdrawn.
          type: string
          format: date-time
    AdminAnnouncementCreateRequest:
      description: A new announcement, with its text and its window.
      type: object
      required: [text]
      properties:
        text:
          description: The text, in Markdown.
          type: string
          minLength: 1
          maxLength: 5000
        starts_at:
          description: When it starts to show once published; omitted to show it from its publication.
          type: string
          format: date-time
        ends_at:
          description: When it stops showing, after `starts_at`; omitted to show it until it is withdrawn.
          type: string
          format: date-time
        publish:
          description: Publish it at once instead of keeping it a draft.
          type: boolean
          default: false
    # --- end of admin: announcements (#665) ---
    # --- custom emoji (#621) ---
    PickerCustomEmoji:
      description: |
        A local custom emoji that the picker offers (ADR-0051 §4). Picking it inserts
        `:shortcode:` into the text.
      type: object
      required: [shortcode, url, static_url, aliases]
      properties:
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        url:
          description: The URL of the image, animated when the emoji is.
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji.
          type: string
          format: uri
        category:
          description: The category that the picker groups the emoji in; absent for none.
          type: string
        aliases:
          description: Other names that a search of the picker finds the emoji by.
          type: array
          items:
            type: string
    PickerCustomEmojiList:
      description: The custom emoji of the picker.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickerCustomEmoji"
    # --- end of custom emoji (#621) ---
    # --- admin: custom emoji (#621) ---
    AdminCustomEmoji:
      description: |
        A custom emoji as the administrators manage it (ADR-0051 §4): a local one, or a remote
        one recorded from the posts and profiles of another server.
      type: object
      required: [id, shortcode, local, enabled, visible_in_picker, aliases, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        shortcode:
          description: The shortcode, without the colons around it.
          type: string
        local:
          description: Whether the emoji is of this instance.
          type: boolean
        domain:
          description: The domain of a remote emoji; absent for a local one.
          type: string
        uri:
          description: |
            The ActivityPub `id` of the emoji: `https://{host}/ap/emojis/{id}` for a local one,
            and the recorded one for a remote one; absent when a remote emoji has none.
          type: string
          format: uri
        url:
          description: |
            The URL of the image, animated when the emoji is; absent when the image cannot be
            shown (such as a remote one from a domain whose media the instance rejects).
          type: string
          format: uri
        static_url:
          description: The URL of a still image of the emoji; absent with `url`.
          type: string
          format: uri
        enabled:
          description: Whether the emoji is shown; a disabled one stays `:shortcode:` text.
          type: boolean
        visible_in_picker:
          description: Whether the picker offers the local emoji; always `true` for a remote one.
          type: boolean
        category:
          description: The category of a local emoji in the picker; absent for none.
          type: string
        aliases:
          description: The other names of a local emoji that the picker finds it by.
          type: array
          items:
            type: string
        created_at:
          description: When the emoji was registered or first seen.
          type: string
          format: date-time
        updated_at:
          description: When its current image was set, its ActivityPub `updated`.
          type: string
          format: date-time
    AdminCustomEmojiPage:
      description: A page of custom emoji.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminCustomEmoji"
    CreateCustomEmojiRequest:
      description: A new local custom emoji.
      type: object
      required: [shortcode, media_id]
      properties:
        shortcode:
          description: 2 to 30 letters (A to Z, a to z), digits, and underscores; case matters.
          type: string
          minLength: 2
          maxLength: 30
        media_id:
          $ref: "#/components/schemas/Id"
        category:
          description: The category in the picker, up to 64 characters; empty for none.
          type: string
          maxLength: 64
        aliases:
          description: Other names, each following the rules of a shortcode; at most 10.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
        visible_in_picker:
          description: Whether the picker offers the emoji.
          type: boolean
          default: true
    UpdateCustomEmojiRequest:
      description: The settings of a custom emoji to change; absent ones stay.
      type: object
      properties:
        enabled:
          description: Whether the emoji is shown.
          type: boolean
        visible_in_picker:
          description: Whether the picker offers the local emoji.
          type: boolean
        category:
          description: The category in the picker, up to 64 characters; empty removes it.
          type: string
          maxLength: 64
        aliases:
          description: The new aliases, each following the rules of a shortcode; at most 10.
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
    CopyCustomEmojiRequest:
      description: The local custom emoji that a copy of a remote one becomes.
      type: object
      properties:
        shortcode:
          description: |
            The shortcode of the local emoji: 2 to 30 letters (A to Z, a to z), digits, and
            underscores; case matters. Absent, the remote emoji's.
          type: string
          minLength: 2
          maxLength: 30
    ReplaceCustomEmojiImageRequest:
      description: The new image of a local custom emoji.
      type: object
      required: [media_id]
      properties:
        media_id:
          $ref: "#/components/schemas/Id"
    CustomEmojiProblem:
      description: |
        The problem of a custom emoji that breaks a rule (422,
        `/api/v1/problems/invalid-custom-emoji`); `reason` says which. Another 422 (a malformed
        request) has none.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/CustomEmojiProblemReason"
    CustomEmojiProblemReason:
      description: |
        Why a custom emoji is refused. `invalid_shortcode`: not 2 to 30 letters, digits, and
        underscores. `shortcode_taken`: a local emoji has the shortcode. `invalid_alias`: an
        alias breaks the rules of a shortcode, or there are more than 10. `invalid_category`:
        the category is longer than 64 characters or not text. `media_not_found`: the media
        file is not an upload of the user. `media_not_ready`: it has not finished processing.
        `unsupported_format`: it is not a PNG, a GIF, or a WebP. `too_large`: it is larger
        than `custom_emoji_max_bytes`. `too_big`: it is larger than 1,024 pixels on a side.
        `remote_emoji`: the operation is for local emoji only. `local_emoji`: the operation is
        for remote emoji only. `fetch_failed`: the image of the remote emoji could not be
        fetched (its server did not return it, or the instance rejects the media of its domain).
      type: string
      enum:
        - invalid_shortcode
        - shortcode_taken
        - invalid_alias
        - invalid_category
        - media_not_found
        - media_not_ready
        - unsupported_format
        - too_large
        - too_big
        - remote_emoji
        - local_emoji
        - fetch_failed
    # --- end of admin: custom emoji (#621) ---
    # --- admin: webhooks (#666) ---
    WebhookEventType:
      description: |
        An event that a webhook subscribes to (ADR-0060). Subscribing needs, besides
        `manage_webhooks`, `manage_reports` for `report.*`; `manage_accounts` for
        `registration.pending`, `account.*`, `moderation_action.*`, and `appeal.created`;
        `manage_domains` for `domain_moderation_action.*`; `manage_custom_emojis` for
        `custom_emoji.*`; and nothing more for `status.created`. `report.created`: a report,
        local or from another server. `report.resolved`, `report.reopened`. `registration.pending`:
        a registration awaits a moderator. `account.created`: a registration was approved, at
        the sign-up or by a moderator. `account.updated`: a local account changed its profile.
        `moderation_action.created`, `moderation_action.lifted`: an action on an account.
        `appeal.created`. `domain_moderation_action.created`, `domain_moderation_action.lifted`.
        `status.created`: a public post of a local account. `custom_emoji.created`,
        `custom_emoji.updated` (its image, settings, aliases, or whether it is enabled), and
        `custom_emoji.deleted`: an administrator's operation on a custom emoji.
      type: string
      enum:
        - report.created
        - report.resolved
        - report.reopened
        - registration.pending
        - account.created
        - account.updated
        - moderation_action.created
        - moderation_action.lifted
        - appeal.created
        - domain_moderation_action.created
        - domain_moderation_action.lifted
        - status.created
        - custom_emoji.created
        - custom_emoji.updated
        - custom_emoji.deleted
    WebhookMessageType:
      description: |
        The type of a message: a `WebhookEventType`, or `webhook.test`, the test message of
        `POST /admin/webhooks/{id}/test`.
      type: string
      enum:
        - report.created
        - report.resolved
        - report.reopened
        - registration.pending
        - account.created
        - account.updated
        - moderation_action.created
        - moderation_action.lifted
        - appeal.created
        - domain_moderation_action.created
        - domain_moderation_action.lifted
        - status.created
        - custom_emoji.created
        - custom_emoji.updated
        - custom_emoji.deleted
        - webhook.test
    AdminWebhook:
      description: |
        A webhook endpoint (ADR-0060). Its secret is never shown again after it is made.
      type: object
      required: [id, url, events, state, state_reason, state_changed_at, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        url:
          description: Where the messages are posted.
          type: string
        description:
          description: What the webhook is for; omitted for none.
          type: string
        events:
          description: The events it subscribes to, in a stable order.
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        state:
          $ref: "#/components/schemas/AdminWebhookState"
        state_reason:
          $ref: "#/components/schemas/AdminWebhookStateReason"
        state_changed_at:
          type: string
          format: date-time
        failure:
          $ref: "#/components/schemas/AdminWebhookFailure"
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the URL, the description, or the events last changed.
          type: string
          format: date-time
    AdminWebhookState:
      description: Whether the webhook receives the messages of its events.
      type: string
      enum: [enabled, disabled]
    AdminWebhookStateReason:
      description: |
        Who set `state` last. `admin`: a staff member, or the `my` command line. `gone`: the
        server disabled it after the endpoint answered 410 Gone. `failing`: the server disabled
        it after the deliveries kept failing, without a success, for 72 hours and 20 attempts.
      type: string
      enum: [admin, gone, failing]
    AdminWebhookFailure:
      description: |
        The attempts that failed since the last success; omitted when the last attempt
        succeeded. The server disables the webhook once they span 72 hours and number 20.
      type: object
      required: [consecutive_failures, first_failed_at]
      properties:
        consecutive_failures:
          type: integer
          minimum: 1
        first_failed_at:
          type: string
          format: date-time
    AdminWebhookList:
      description: The webhooks, newest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminWebhook"
    AdminWebhookCreated:
      description: A new webhook and its secret.
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/AdminWebhook"
        secret:
          description: |
            The secret that signs the messages, `whsec_` and the base64 of 32 bytes, as the
            Standard Webhooks libraries take it. It is shown only now.
          type: string
    AdminWebhookSecret:
      description: A new secret of a webhook.
      type: object
      required: [secret]
      properties:
        secret:
          description: The new secret, as in `AdminWebhookCreated`. It is shown only now.
          type: string
    CreateWebhookRequest:
      description: A new webhook.
      type: object
      required: [url, events]
      properties:
        url:
          description: |
            An absolute `https` (or `http`) URL of at most 2048 bytes, without user info or a
            fragment. A destination on loopback or a private network is reached only when the
            operator allows it (`webhook_allowed_destinations`).
          type: string
          maxLength: 2048
        description:
          description: What the webhook is for, up to 200 characters.
          type: string
          maxLength: 200
        events:
          description: The events to subscribe to, at least one.
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"
    UpdateWebhookRequest:
      description: The changes to a webhook; what is omitted stays.
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          description: The new description; empty removes it.
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"
    AdminWebhookDelivery:
      description: A message to a webhook and its attempts.
      type: object
      required: [id, message_id, event_type, status, attempts, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        message_id:
          description: The `webhook-id` of the message, the same on every attempt.
          allOf:
            - $ref: "#/components/schemas/Id"
        event_type:
          $ref: "#/components/schemas/WebhookMessageType"
        status:
          $ref: "#/components/schemas/AdminWebhookDeliveryStatus"
        attempts:
          description: How many times it was sent.
          type: integer
          minimum: 0
        last_attempt:
          $ref: "#/components/schemas/AdminWebhookAttempt"
        created_at:
          type: string
          format: date-time
    AdminWebhookDeliveryStatus:
      description: |
        `pending`: not sent yet. `succeeded`: an attempt got a 2xx answer. `failing`: every
        attempt so far failed; it is retried over about 27 hours, 8 attempts in all, and can be
        sent again by hand after that.
      type: string
      enum: [pending, succeeded, failing]
    AdminWebhookAttempt:
      description: The last attempt of a delivery.
      type: object
      required: [outcome, duration_ms, attempted_at]
      properties:
        outcome:
          $ref: "#/components/schemas/AdminWebhookAttemptOutcome"
        status_code:
          description: The status code of the answer; omitted without one.
          type: integer
        duration_ms:
          type: integer
          minimum: 0
        attempted_at:
          type: string
          format: date-time
    AdminWebhookAttemptOutcome:
      description: |
        `succeeded`: a 2xx answer. `http_error`: another answer, a redirect included.
        `timeout`: no answer within 15 seconds. `connection_error`: the connection failed.
        `forbidden_destination`: the server may not reach the URL (a loopback or private address
        that `webhook_allowed_destinations` does not list).
      type: string
      enum: [succeeded, http_error, timeout, connection_error, forbidden_destination]
    AdminWebhookDeliveryPage:
      description: A page of the deliveries of a webhook, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminWebhookDelivery"
    WebhookProblem:
      description: |
        The problem of a webhook that breaks a rule (422, `/api/v1/problems/invalid-webhook`);
        `reason` says which. Another 422 (a malformed request) has none.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/WebhookProblemReason"
            missing_permissions:
              description: The permissions that the events need and the user lacks, for `missing_permission`.
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    # --- admin: relays (#667) ---
    RelayProtocol:
      description: |
        How a relay is joined (ADR-0061). `mastodon`: at its inbox, by a `Follow` of the Public
        collection. `litepub`: at its actor, by a `Follow` of the actor.
      type: string
      enum: [mastodon, litepub]
    RelayState:
      description: |
        Where the membership of a relay stands. `pending`: the `Follow` is sent and not
        answered. `accepted`: public posts go to the relay and, with `receive`, come from it.
        `rejected`: the relay rejected the `Follow` or ended the membership. `left`: the
        instance sent the `Undo` of its `Follow`.
      type: string
      enum: [pending, accepted, rejected, left]
    AdminRelay:
      description: A relay that the instance joins or joined (ADR-0061).
      type: object
      required: [id, protocol, url, inbox_url, receive, state, state_changed_at, taken_last_day, dropped_last_day, domain_suspended, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        protocol:
          $ref: "#/components/schemas/RelayProtocol"
        url:
          description: The URL it was registered with, its inbox or its actor.
          type: string
        inbox_url:
          description: Where the public posts are delivered.
          type: string
        receive:
          description: Whether the public posts it relays are taken in; `false` only sends.
          type: boolean
        state:
          $ref: "#/components/schemas/RelayState"
        state_changed_at:
          type: string
          format: date-time
        actor_uri:
          description: The relay's actor, which accepted the `Follow`; omitted unless `accepted`.
          type: string
        taken_last_day:
          description: The activities it brought in during the last 24 hours that were taken in.
          type: integer
          minimum: 0
        dropped_last_day:
          description: |
            The activities it brought in during the last 24 hours that were dropped over the
            hourly limit (`relay_ingest_hourly_limit`).
          type: integer
          minimum: 0
        domain_suspended:
          description: |
            Whether a domain action suspends its server: nothing goes to it or comes from it
            while it does, whatever `state` says.
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminRelayList:
      description: The relays, in registration order.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRelay"
    CreateRelayRequest:
      description: A relay to register and join.
      type: object
      required: [url]
      properties:
        protocol:
          $ref: "#/components/schemas/RelayProtocol"
        url:
          description: The relay's inbox (`mastodon`) or actor (`litepub`), an https URL.
          type: string
          minLength: 1
          maxLength: 2048
        receive:
          description: Whether to take in the public posts it relays; `true` when omitted.
          type: boolean
    RelayProblem:
      description: |
        The problem of a relay operation that breaks a rule (422,
        `/api/v1/problems/invalid-relay`); `reason` says which. Another 422 (a malformed
        request) has none.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/RelayProblemReason"
    RelayProblemReason:
      description: |
        Why a relay operation is refused. `url`: not an https URL of at most 2048 bytes.
        `exists`: a relay with the URL is registered. `domain_suspended`: a domain action
        suspends its server. `not_actor`: the URL of a `litepub` relay serves no actor with an
        inbox. `state`: the relay is not in a state that allows it (joining a `pending` or
        `accepted` relay, leaving or deleting one that is not).
      type: string
      enum: [url, exists, domain_suspended, not_actor, state]
    # --- end of admin: relays (#667) ---
    WebhookProblemReason:
      description: |
        Why a webhook is refused. `url`: not an absolute http or https URL of at most 2048
        bytes without user info or a fragment. `description`: longer than 200 characters or with
        control characters. `events`: none, or one twice. `missing_permission`: the user lacks
        the permission of an event (`missing_permissions`).
      type: string
      enum: [url, description, events, missing_permission]
    WebhookMessage:
      description: |
        The body of a message that a webhook receives (ADR-0060, Standard Webhooks), posted as
        `application/json` with the headers `webhook-id`, `webhook-timestamp`, and
        `webhook-signature`. `data` is what the admin API answers for the object of the event,
        presented in the transaction of the event: `AdminReport` for `report.*`,
        `AdminRegistration` for `registration.pending` and `account.created`, `AdminAccount`
        for `account.updated`, `AdminAccountAction` for `moderation_action.*`, `AdminAppeal`
        for `appeal.created`, `AdminDomainAction` for `domain_moderation_action.*`,
        `WebhookCustomEmoji` for `custom_emoji.*`, `WebhookStatus` for `status.created`, and
        `WebhookTest` for `webhook.test`. No operation returns it; docs/reference/webhooks.md
        describes it.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          $ref: "#/components/schemas/WebhookMessageType"
        timestamp:
          description: When the event happened.
          type: string
          format: date-time
        data:
          type: object
    WebhookStatus:
      description: The post of a `status.created` message, always `public` and local.
      type: object
      required: [id, uri, account_id, visibility, spoiler_text, sensitive, language, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        uri:
          type: string
        account_id:
          $ref: "#/components/schemas/Id"
        visibility:
          type: string
        in_reply_to_uri:
          type: string
        spoiler_text:
          type: string
        sensitive:
          type: boolean
        language:
          type: string
        content:
          description: Sanitized HTML.
          type: string
        created_at:
          type: string
          format: date-time
    WebhookCustomEmoji:
      description: |
        The emoji of a `custom_emoji.*` message: `AdminCustomEmoji` with the operation. A
        `custom_emoji.deleted` message presents the emoji as it was before the deletion.
      allOf:
        - $ref: "#/components/schemas/AdminCustomEmoji"
        - type: object
          required: [operation]
          properties:
            operation:
              description: |
                The operation, named as in the audit log: `custom_emoji_created`,
                `custom_emoji_image_replaced`, `custom_emoji_copied`, `custom_emoji_updated`,
                `custom_emoji_enabled`, `custom_emoji_disabled`, or `custom_emoji_deleted`.
              type: string
    WebhookTest:
      description: The data of a `webhook.test` message.
      type: object
      required: [endpoint_id]
      properties:
        endpoint_id:
          $ref: "#/components/schemas/Id"
    # --- end of admin: webhooks (#666) ---
    # --- admin: instance texts (#489) ---
    ThemeTokenValue:
      description: |
        The override of one design token, named without `--` (`color-accent`, `radius-md`): `light`
        and `dark` for a color token, `value` for the others.
      type: object
      required: [token]
      properties:
        token:
          type: string
        light:
          type: string
        dark:
          type: string
        value:
          type: string
    AdminTheme:
      description: The instance theme as its administrators edit it.
      type: object
      required: [tokens, custom_css]
      properties:
        revision:
          description: The ID of the current theme revision; omitted when no theme was ever saved.
          type: string
        stylesheet_url:
          description: The stylesheet of the theme; omitted when the theme changes nothing.
          type: string
          format: uri
        tokens:
          description: The overridden tokens, in the order of the token list.
          type: array
          items:
            $ref: "#/components/schemas/ThemeTokenValue"
        custom_css:
          description: The custom CSS; empty for none.
          type: string
        revised_at:
          description: When the current revision was recorded; omitted when no theme was ever saved.
          type: string
          format: date-time
    SetThemeRequest:
      description: The whole theme; tokens left out go back to their defaults.
      type: object
      required: [tokens, custom_css]
      properties:
        tokens:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ThemeTokenValue"
        custom_css:
          type: string
    InstanceTheme:
      description: |
        The instance's theme (ADR-0059), for clients that do not load the server's HTML shell: the
        stylesheet to apply and the overridden tokens. `Instance.theme` omits it when the
        instance has no theme.
      type: object
      required: [revision, stylesheet_url, tokens]
      properties:
        revision:
          type: string
        stylesheet_url:
          type: string
          format: uri
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ThemeTokenValue"
    ThemeError:
      description: |
        One reason a theme cannot be saved. `code` is `unknown_token`, `duplicate_token`,
        `invalid_value` (the value does not have the token's shape; `scheme` names the color scheme
        of a color), `out_of_range` (`min` and `max` are the bounds, in rem for a length and ms for a
        duration), `low_contrast` (`token` on `background` is `ratio`:1 in `scheme` and needs
        `minimum`:1), `css_too_long` (`max` bytes), or `css_invalid` (not UTF-8 text).
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [unknown_token, duplicate_token, invalid_value, out_of_range, low_contrast, css_too_long, css_invalid]
        token:
          type: string
        scheme:
          type: string
          enum: [light, dark]
        background:
          type: string
        ratio:
          type: number
        minimum:
          type: number
        min:
          type: number
        max:
          type: number
    ThemeProblem:
      description: |
        A 422 of `PUT /admin/theme`. For the type `/api/v1/problems/invalid-theme`, `theme_errors`
        lists why the theme cannot be saved; another 422 (a malformed request) has none.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            theme_errors:
              type: array
              items:
                $ref: "#/components/schemas/ThemeError"
    AdminInstanceText:
      description: The current text of a key, the same in every locale.
      type: object
      required: [key, body, revised_at]
      properties:
        key:
          $ref: "#/components/schemas/InstanceTextKey"
        body:
          description: |
            The text: Markdown for `terms` and `privacy_policy`, plain text for the other keys.
            Empty only in the answer to clearing it.
          type: string
        revised_at:
          description: When the revision was recorded.
          type: string
          format: date-time
    AdminInstanceTextList:
      description: The current instance texts, by key.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminInstanceText"
    InstanceTextKey:
      description: |
        The key of an instance text: the name (one line), the short and full descriptions,
        the terms of service and the privacy policy (Markdown), and the alternative texts of the
        preview image and the thumbnail.
      type: string
      enum: [name, short_description, description, terms, privacy_policy, preview_image_alt, thumbnail_alt]
    SetInstanceTextRequest:
      description: A new revision of an instance text.
      type: object
      required: [body]
      properties:
        body:
          description: The text, in any language; empty clears it.
          type: string
          maxLength: 100000
    # --- end of admin: instance texts (#489) ---
    # --- admin: moderator counts (#338) ---
    AdminCounts:
      description: What awaits the moderators; a count whose permission the user lacks is omitted.
      type: object
      properties:
        open_reports:
          description: The reports that are open. Needs `manage_reports`.
          type: integer
          format: int64
          minimum: 0
        pending_registrations:
          description: The registrations that await approval. Needs `manage_accounts`.
          type: integer
          format: int64
          minimum: 0
        pending_appeals:
          description: The appeals of moderation actions that await a decision. Needs `manage_accounts`.
          type: integer
          format: int64
          minimum: 0
    # --- end of admin: moderator counts (#338) ---
    # --- admin: accounts (#344) ---
    AdminAccount:
      description: |
        An account as the moderators see it (FR-714). It never includes an email or IP address.
      type: object
      required: [id, account, local, state, restrictions]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        account:
          $ref: "#/components/schemas/Account"
        local:
          description: Whether the account is on this server.
          type: boolean
        state:
          $ref: "#/components/schemas/AdminAccountState"
        restrictions:
          description: |
            What the account's own actions take away now (data-model §5.2), in a fixed order.
            The domain actions on its domain are listed apart.
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountRestriction"
        registration_state:
          $ref: "#/components/schemas/AdminAccountRegistrationState"
    AdminAccountDetail:
      description: The details of an account (FR-714).
      allOf:
        - $ref: "#/components/schemas/AdminAccount"
        - type: object
          required: [roles, actions, reports]
          properties:
            registration:
              $ref: "#/components/schemas/AdminAccountRegistration"
            email_verified:
              description: |
                Whether the primary email address of a local account is verified; omitted when
                it has none.
              type: boolean
            two_factor_enabled:
              description: |
                Whether the user of a local account signs in with two-factor authentication;
                omitted for a remote account.
              type: boolean
            roles:
              description: The keys of the user's roles, highest position first; empty for a remote account.
              type: array
              items:
                type: string
            actions:
              description: The newest 20 actions on the account, newest first.
              type: array
              items:
                $ref: "#/components/schemas/AdminAccountAction"
            reports:
              description: The newest 20 reports of the account, newest first.
              type: array
              items:
                $ref: "#/components/schemas/AdminReport"
    AdminAccountPage:
      description: A page of accounts, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAccount"
    AdminPasswordResetLink:
      description: |
        A password reset link that an administrator issued for a local account (FR-002). It is
        shown once.
      type: object
      required: [url, expires_at]
      properties:
        url:
          description: The link that sets a new password; it works once.
          type: string
          format: uri
        expires_at:
          description: When the link stops working.
          type: string
          format: date-time
    AdminAccountPrivateData:
      description: |
        The email address and the IP addresses of a local account (FR-714). Showing them is
        recorded in the audit log.
      type: object
      required: [sign_ins, same_ip_accounts]
      properties:
        email:
          description: The primary email address; omitted when there is none.
          type: string
        email_verified:
          description: Whether the primary email address is verified; omitted with `email`.
          type: boolean
        registration_ip:
          description: |
            The IP address the account registered from; omitted for a registration from an
            unknown address, by the command line, or past the retention.
          type: string
        registered_at:
          description: When the account registered from `registration_ip`; omitted with it.
          type: string
          format: date-time
        sign_ins:
          description: The newest 20 sign-ins within the retention, newest first.
          type: array
          items:
            $ref: "#/components/schemas/AdminAccountSignIn"
        same_ip_accounts:
          description: |
            For each IP address of `sign_ins` and `registration_ip`, newest first, up to 20
            other accounts that registered or signed in from it, newest first.
          type: array
          items:
            $ref: "#/components/schemas/AdminSameIpAccounts"
    AdminAccountRegistration:
      description: The registration application of a local account.
      type: object
      required: [submitted_at, state_changed_at]
      properties:
        submitted_at:
          type: string
          format: date-time
        reason:
          description: Why the applicant wants to join; omitted when not asked or not given.
          type: string
        invite_id:
          $ref: "#/components/schemas/Id"
        state_changed_at:
          description: When the registration entered its `registration_state`.
          type: string
          format: date-time
    AdminAccountRegistrationState:
      description: |
        Where the registration of a local account stands; a user made with the command line is
        `approved`. Omitted for a remote account.
      type: string
      enum: [pending, approved, rejected]
    AdminAccountRestriction:
      description: |
        A capability that an action takes away (data-model §5.2). `login`: logging in and the
        API. `post`: posting, replying, boosting, editing. `interact`: following, favouriting,
        boosting, voting. `visibility_ceiling_private`: posts are followers-only.
        `public_discovery`: posts stay off the public timelines and search.
        `unsolicited_reach`: notifications reach followers only. `media_sensitive`: media shows
        as sensitive. `profile_view`: the profile and posts are hidden. `federation`: nothing is
        delivered or received.
      type: string
      enum:
        - login
        - post
        - interact
        - visibility_ceiling_private
        - public_discovery
        - unsolicited_reach
        - media_sensitive
        - profile_view
        - federation
    AdminAccountSignIn:
      description: Where one sign-in came from.
      type: object
      required: [signed_in_at]
      properties:
        ip:
          description: The IP address; omitted when unknown.
          type: string
        user_agent:
          description: The User-Agent; omitted when unknown.
          type: string
        signed_in_at:
          type: string
          format: date-time
    AdminAccountState:
      description: |
        The state of an account, the first that applies: `deleted` (deleted here or on its
        server), `suspended` (a `suspend` or `ban`), `disabled` (a `disable_login`), `rejected`
        and `pending` (the registration of a local account), `limited` (a `limit`), and
        `active`.
      type: string
      enum: [active, pending, rejected, limited, disabled, suspended, deleted]
    AdminSameIpAccounts:
      description: The other accounts that used one IP address.
      type: object
      required: [ip, accounts]
      properties:
        ip:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
    # --- end of admin: accounts (#344) ---
    # --- admin: roles (#348) ---
    AdminRole:
      description: |
        A role (FR-720): a named set of permissions. A higher position outranks a lower one;
        a user may grant, revoke, create, change, and delete only the roles at or below their
        highest one, and give or take only the permissions they hold.
      type: object
      required: [id, key, position, permissions]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        key:
          description: The name of the role, such as `admin` or `moderator`.
          type: string
          minLength: 1
          maxLength: 64
        position:
          type: integer
        permissions:
          description: The permissions that the role grants, in the order of `Permission`.
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    AdminRoleList:
      description: Roles, highest position first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRole"
    CreateRoleRequest:
      description: A new role.
      type: object
      required: [key, position, permissions]
      properties:
        key:
          description: The name of the role, 1 to 64 lowercase ASCII letters, digits, `_`, and `-`.
          type: string
          minLength: 1
          maxLength: 64
        position:
          description: The rank of the role, from 0 to 999 (below `admin`).
          type: integer
        permissions:
          description: The permissions that the role grants, each once.
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    UpdateRoleRequest:
      description: The changes to a role; what is omitted stays.
      type: object
      properties:
        position:
          description: The new rank of the role, from 0 to 999.
          type: integer
        permissions:
          description: The new permissions of the role, each once; empty removes them all.
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RoleProblem:
      description: |
        The problem of a role change that breaks a rule (422, `/api/v1/problems/invalid-role`);
        `reason` says which. Another 422 (a malformed request) has none.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/RoleProblemReason"
            missing_permissions:
              description: The permissions that the change needs and the viewer lacks, for `missing_permission`.
              type: array
              items:
                $ref: "#/components/schemas/Permission"
    RoleProblemReason:
      description: |
        Why a role change is refused. `key`: not 1 to 64 lowercase ASCII letters, digits, `_`,
        and `-`. `key_taken`: another role has the key. `position`: outside 0 to 999.
        `permissions`: an unknown permission, or one twice. `builtin`: `admin` cannot change,
        and neither `admin` nor `moderator` can be deleted. `held`: users hold the role.
        `missing_permission`: the change adds or removes permissions that the viewer's roles
        do not grant (`missing_permissions`).
      type: string
      enum: [key, key_taken, position, permissions, builtin, held, missing_permission]
    # --- end of admin: roles (#348) ---
    # --- admin: registrations (#345) ---
    AdminRegistration:
      description: A user's registration as the moderators review it (FR-721).
      type: object
      required: [user_id, state, since, email, email_verified, submitted_at]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        account_id:
          description: The user's local account; omitted when it is gone.
          allOf:
            - $ref: "#/components/schemas/Id"
        username:
          description: The username of the user's local account; omitted when it is gone.
          type: string
        state:
          $ref: "#/components/schemas/RegistrationState"
        since:
          description: When the registration entered its state.
          type: string
          format: date-time
        email:
          description: The user's primary email address; empty when there is none.
          type: string
        email_verified:
          description: Whether the user confirmed the email address.
          type: boolean
        reason:
          description: Why the user wants to join, as plain text; omitted when they gave none.
          type: string
        invite_id:
          description: The invite the user signed up with; omitted for none.
          allOf:
            - $ref: "#/components/schemas/Id"
        submitted_at:
          description: When the user signed up.
          type: string
          format: date-time
    AdminRegistrationPage:
      description: A page of registrations, longest in their state first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminRegistration"
    RegistrationDecisionRequest:
      description: A moderator's decision on a registration.
      type: object
      properties:
        note:
          description: A note for the moderators, as plain text; omitted or empty for none.
          type: string
          maxLength: 1000
    RegistrationState:
      description: |
        Where a registration stands: `pending` waits for a moderator, `approved` lets the user
        sign in, and `rejected` keeps them out.
      type: string
      enum: [pending, approved, rejected]
    # --- end of admin: registrations (#345) ---
    # --- admin: sign-up blocks (#346) ---
    AdminSignupBlock:
      description: A block on sign-ups from the registration page (FR-719).
      type: object
      required: [id, kind, value, severity, state, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AdminSignupBlockKind"
        value:
          description: |
            What the block matches, in canonical form: a domain in IDNA A-labels
            (`email_domain`), the hex SHA-256 of a canonical email address (`email_hash`), or a
            masked CIDR prefix (`ip_range`).
          type: string
        severity:
          $ref: "#/components/schemas/AdminSignupBlockSeverity"
        comment:
          description: The moderators' comment; omitted when there is none.
          type: string
        moderation_action_id:
          description: The ban the block was made from; omitted for a block added on its own.
          allOf:
            - $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/AdminSignupBlockState"
        created_at:
          type: string
          format: date-time
        expires_at:
          description: When the block ends by itself; omitted for one that lasts until lifted.
          type: string
          format: date-time
        lifted_at:
          description: When the block was lifted; omitted until it is.
          type: string
          format: date-time
    AdminSignupBlockKind:
      description: |
        `email_domain`: the domain of the email address and its subdomains. `email_hash`: one
        email address, compared in lower case without the part of the local part from its first
        `+`. `ip_range`: the client addresses in a CIDR prefix.
      type: string
      enum: [email_domain, email_hash, ip_range]
    AdminSignupBlockPage:
      description: A page of sign-up blocks, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminSignupBlock"
    AdminSignupBlockSeverity:
      description: |
        `reject`: the sign-up is refused. `require_approval`: the registration starts pending
        for a moderator, whatever the registration mode.
      type: string
      enum: [reject, require_approval]
    AdminSignupBlockState:
      description: |
        `active`: in effect now. `expired`: it ended at `expires_at`. `lifted`: a moderator
        lifted it.
      type: string
      enum: [active, expired, lifted]
    CreateSignupBlockRequest:
      description: A new block on sign-ups.
      type: object
      required: [kind, value, severity]
      properties:
        kind:
          $ref: "#/components/schemas/AdminSignupBlockKind"
        value:
          description: |
            A domain such as `spam.example` or `例え.jp` (`email_domain`), an email address or
            the hex SHA-256 of a canonical one (`email_hash`), or a CIDR prefix such as
            `192.0.2.0/24` or a single IP address (`ip_range`).
          type: string
          minLength: 1
          maxLength: 320
        severity:
          $ref: "#/components/schemas/AdminSignupBlockSeverity"
        comment:
          type: string
          maxLength: 1000
        expires_in:
          description: The seconds the block lasts; omitted, it lasts until it is lifted.
          type: integer
          minimum: 1
    # --- end of admin: sign-up blocks (#346) ---
    # --- admin: sign-up block import (#498) ---
    ImportSignupBlocksRequest:
      description: A list of values to block sign-ups by, all with the same settings.
      type: object
      required: [kind, text, severity]
      properties:
        kind:
          $ref: "#/components/schemas/AdminSignupBlockKind"
        text:
          description: |
            The list: one value per line, or a CSV row whose first field is the value; blank
            lines and lines starting with `#` are ignored. At most 10,000 values.
          type: string
        severity:
          $ref: "#/components/schemas/AdminSignupBlockSeverity"
        comment:
          description: The comment of every block added.
          type: string
          maxLength: 1000
        expires_in:
          description: The seconds each block lasts; omitted, they last until they are lifted.
          type: integer
          minimum: 1
    SignupBlockImportResult:
      description: What an import of a list of sign-up blocks did.
      type: object
      required: [added, skipped]
      properties:
        added:
          description: The number of blocks added.
          type: integer
          minimum: 0
        skipped:
          description: The lines whose block was not added, in line order.
          type: array
          items:
            $ref: "#/components/schemas/SignupBlockImportSkipped"
    SignupBlockImportSkipped:
      description: A line of an imported list whose block was not added.
      type: object
      required: [line, value, reason]
      properties:
        line:
          description: The line of the list, from 1.
          type: integer
          minimum: 1
        value:
          description: The value as written on the line.
          type: string
        reason:
          description: |
            `invalid`: not a valid value for the kind. `duplicate`: an earlier line has the same
            value in canonical form. `already_blocked`: a block in effect of the same kind and
            value with a severity at least as strong covers it.
          type: string
          enum: [invalid, duplicate, already_blocked]
    # --- end of admin: sign-up block import (#498) ---
    # --- admin: domain block CSV (#641) ---
    DomainBlockSeverity:
      description: |
        The `#severity` of Mastodon's domain block CSV. `suspend`: the action `suspend`.
        `silence`: Mastodon's name of the action `limit`. `noop`: no action but the rejections.
      type: string
      enum: [suspend, silence, noop]
    DomainBlock:
      description: |
        A row of Mastodon's domain block CSV. The server checks the domain (a U-label spelling
        such as `例え.jp` is accepted) and the public comment (at most 5,000 characters).
      type: object
      required: [domain, severity, reject_media, reject_reports, obfuscate]
      properties:
        domain:
          type: string
        severity:
          $ref: "#/components/schemas/DomainBlockSeverity"
        reject_media:
          type: boolean
        reject_reports:
          type: boolean
        public_comment:
          type: string
        obfuscate:
          type: boolean
    PreviewDomainBlockImportRequest:
      description: A domain block CSV to preview.
      type: object
      required: [csv]
      properties:
        csv:
          description: The file's text, with a header or as a list of domains; at most 5,000 rows.
          type: string
    DomainBlockImportStatus:
      description: |
        What importing a row would do. `importable`: it issues the actions of `issue`.
        `already_applied`: an action in effect of each of the row's kinds covers the domain
        already, on it or on a parent domain. `no_action`: the row stands for no action (a
        `noop` without rejections). `duplicate`: an earlier row has the same domain once
        normalized. `invalid`: the domain, the severity, or the public comment is not valid.
      type: string
      enum: [importable, already_applied, no_action, duplicate, invalid]
    DomainBlockImportRow:
      description: A row of a domain block CSV and what importing it would do.
      type: object
      required: [line, written_domain, status, issue]
      properties:
        line:
          description: The line of the file the row starts on, from 1.
          type: integer
          minimum: 1
        written_domain:
          description: The domain as written in the row.
          type: string
        block:
          description: |
            The row, with its domain normalized (IDNA A-labels in lower case); absent when
            the row is `invalid`. The import takes it as it is.
          $ref: "#/components/schemas/DomainBlock"
        status:
          $ref: "#/components/schemas/DomainBlockImportStatus"
        issue:
          description: The kinds of the actions the import would issue; empty unless `importable`.
          type: array
          items:
            $ref: "#/components/schemas/AdminDomainActionKind"
    DomainBlockImportPreview:
      description: What importing each row of a domain block CSV would do, in row order.
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DomainBlockImportRow"
    ImportDomainBlocksRequest:
      description: The rows of a domain block CSV to import.
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/DomainBlock"
        private_note:
          description: The private note of every action issued.
          type: string
          maxLength: 5000
    DomainBlockImportResult:
      description: What an import of domain blocks did.
      type: object
      required: [issued, skipped]
      properties:
        issued:
          description: The actions issued, in the order of the blocks.
          type: array
          items:
            $ref: "#/components/schemas/AdminDomainAction"
        skipped:
          description: The blocks that issued nothing, in their order.
          type: array
          items:
            $ref: "#/components/schemas/DomainBlockImportSkipped"
    DomainBlockImportSkipped:
      description: A block of an import that issued nothing.
      type: object
      required: [domain, reason]
      properties:
        domain:
          description: The domain as sent.
          type: string
        reason:
          description: Why it issued nothing; never `importable`.
          $ref: "#/components/schemas/DomainBlockImportStatus"
    # --- end of admin: domain block CSV (#641) ---
    # --- reports (#332) ---
    CreateReportRequest:
      description: A report of an account to the moderators.
      type: object
      required: [account_id, category]
      properties:
        account_id:
          description: The account reported, local or remote.
          allOf:
            - $ref: "#/components/schemas/Id"
        status_ids:
          description: Posts of the account that the user can see, up to 20.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        category:
          $ref: "#/components/schemas/ReportCategory"
        rule_ids:
          description: |
            Instance rules in effect that the account broke, up to 20; only with the
            `violation` category.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        comment:
          description: A comment for the moderators as plain text.
          type: string
          maxLength: 1000
        forward:
          description: |
            Asks to forward the report to the server of a remote account, without naming the
            reporter. It means nothing for a local account.
          type: boolean
          default: false
    Report:
      description: |
        A report that the user filed. It never names the reporter, and tells only whether the
        moderators resolved it, never how.
      type: object
      required: [id, category, comment, forwarded, filed_at, target_account, status_ids, rule_ids, state]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        category:
          $ref: "#/components/schemas/ReportCategory"
        comment:
          description: The comment as plain text.
          type: string
        forwarded:
          description: Whether the report is to be forwarded to the target's server.
          type: boolean
        filed_at:
          type: string
          format: date-time
        target_account:
          $ref: "#/components/schemas/Account"
        status_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        rule_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/ReportState"
    ReportCategory:
      description: |
        Why the account is reported. `spam`: spam or unwanted promotion. `legal`: content that
        is illegal. `violation`: it breaks the instance rules that `rule_ids` cite. `other`:
        anything else.
      type: string
      enum: [spam, legal, violation, other]
    ReportPage:
      description: A page of the user's reports, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Report"
    ReportState:
      description: |
        `open`: the report awaits the moderators. `resolved`: the moderators handled it.
      type: string
      enum: [open, resolved]
    # --- end of reports (#332) ---
    # --- admin: instance settings (#624) ---
    AdminSetting:
      description: |
        An instance setting: its value and what it accepts. Every value is a string in its
        canonical form, whatever its kind.
      type: object
      required: [key, kind, value, default, stored]
      properties:
        key:
          $ref: "#/components/schemas/InstanceSettingKey"
        kind:
          $ref: "#/components/schemas/InstanceSettingKind"
        value:
          description: The current value, which is `default` when `stored` is false.
          type: string
        default:
          description: The value of the setting while it has never been set.
          type: string
        stored:
          description: Whether the setting has been set; false means its default applies.
          type: boolean
        choices:
          description: The values an `enum` setting accepts, in order; omitted for other kinds.
          type: array
          items:
            type: string
        minimum:
          description: The least value of an `int` setting; omitted for other kinds.
          type: integer
        maximum:
          description: The greatest value of an `int` setting; omitted for other kinds.
          type: integer
    AdminSettingList:
      description: Every instance setting, in a fixed order.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSetting"
    InstanceSettingKey:
      description: |
        The key of an instance setting (docs/operations/instance-settings.md). New keys may be
        added; clients show the ones they know.
      type: string
      enum:
        - registration_mode
        - max_status_length
        - default_locale
        - local_timeline_enabled
        - federated_timeline_enabled
        - preview_image
        - contact_account
        - contact_email
        - thumbnail
        - remote_media_policy
        - remote_media_cache_ttl
        - authorized_fetch
        - domain_actions_visibility
        - domain_actions_rationale_visibility
        - appeal_window
        - retention_session_origins
        - retention_registration_origins
        - retention_reports
        - retention_moderation_actions
        - retention_audit_log
        - search_indexing
        - ai_usage
        - indexable_default
        - security_contact
        - require_media_description
        - link_cards_enabled
    InstanceSettingKind:
      description: |
        The type of a setting's value. `bool`: `true` or `false`. `int`: a decimal integer from
        `minimum` to `maximum`. `enum`: one of `choices`. `locale`: a BCP 47 language tag.
        `media`: the ID of an image uploaded with `POST /media`, or empty for none. `account`:
        the username of a local account, or empty for none. `email`: an email address such as
        `admin@example.com`, or empty for none. `uri`: an `https:` or `mailto:` URI, or empty for
        none.
      type: string
      enum: [bool, int, enum, locale, media, account, email, uri]
    UpdateInstanceSettingsRequest:
      description: New values of some instance settings, saved together.
      type: object
      required: [values]
      properties:
        values:
          description: The new value of each setting to change, by key, as a string.
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 320
    # --- end of admin: instance settings (#624) ---
    # --- admin: invites (#624) ---
    AdminInvite:
      description: An invite that lets people sign up while the registration mode is `invite`.
      type: object
      required: [id, code, url, uses, state, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          description: The code people enter on the registration page, 16 characters.
          type: string
        url:
          description: The registration page with the code filled in, to send to people.
          type: string
          format: uri
        max_uses:
          description: How many sign-ups the invite allows; omitted when there is no limit.
          type: integer
          minimum: 1
        uses:
          description: How many people have signed up with the invite.
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/AdminInviteState"
        expires_at:
          description: When the invite stops working; omitted when it never does.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AdminInvitePage:
      description: A page of invites, newest first.
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminInvite"
    AdminInviteState:
      description: |
        What the invite allows now. `usable`: people may sign up with it. `revoked`: a staff
        member revoked it. `expired`: it passed `expires_at`. `exhausted`: it was used
        `max_uses` times.
      type: string
      enum: [usable, revoked, expired, exhausted]
    CreateInviteRequest:
      description: A new invite.
      type: object
      properties:
        max_uses:
          description: How many sign-ups the invite allows; omitted for no limit.
          type: integer
          minimum: 1
          maximum: 1000000
        expires_in:
          description: How many seconds the invite works; omitted for an invite that never expires.
          type: integer
          minimum: 1
          maximum: 315360000
    # --- end of admin: invites (#624) ---
