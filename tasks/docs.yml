#
# Documentation: markdownlint and the ADR numbers (the docs context of scripts/changed-contexts.sh).
version: "3"

vars:
  MARKDOWNLINT: bunx --bun markdownlint-cli2@0.23.2

tasks:
  check:
    desc: Run the documentation checks, markdownlint and the ADR numbers, in parallel
    deps: [lint, adr-numbers]

  lint:
    desc: Lint Markdown files
    cmds:
      - "{{.MARKDOWNLINT}}"

  adr-numbers:
    desc: Fail if two files in docs/adr share a number
    cmds:
      - scripts/adr-numbers.sh

  adr-new:
    desc: 'Create a new ADR: scripts/task.sh docs:adr-new TITLE="..." [SLUG=kebab-slug]'
    requires:
      vars: [TITLE]
    cmds:
      - scripts/adr-new.sh {{shellQuote .TITLE}} {{.SLUG}}
