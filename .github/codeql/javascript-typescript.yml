#
# CodeQL configuration of the javascript-typescript analysis (codeql.yml). The analysis reads the sources without
# building them, so it is limited to the client workspace and the i18n tool; the generated route tree, API schema,
# and message accessors, the intentional lint violations, and build output are left out.
paths:
  - app
  - tools/i18n
paths-ignore:
  - "**/*.gen.ts"
  - "**/node_modules"
  - "**/dist"
  - "**/storybook-static"
  - app/oxlint/violations
