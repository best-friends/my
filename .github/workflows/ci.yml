name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use exactly the Go version from .tool-versions; never auto-download another toolchain.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The PostgreSQL adapter tests start postgres with testcontainers-go on the runner's Docker.
      # Make them fail instead of skipping when that is impossible, so CI always runs them.
      TEST_POSTGRES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache-dependency-path: |
            go.mod
            go.sum
            tools/go.mod
            tools/go.sum
      - name: Read tool versions from .tool-versions
        id: tools
        run: echo "golangci-lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # The official action installs the prebuilt binary, caches lint results and annotates the PR.
      # It also puts golangci-lint on PATH, so the run inside `make check` reuses the binary and the cache.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v${{ steps.tools.outputs.golangci-lint }}
      - name: Verify Go version matches .tool-versions
        run: |
          want="go$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          got="$(go env GOVERSION)"
          echo "want=${want} got=${got}"
          test "${want}" = "${got}"
      - name: make check
        run: make check
      - name: shellcheck
        run: make lint-shell
      - name: govulncheck
        run: make go-vuln

  schema:
    # Apply each dialect's desired-state schema to an empty database and require an empty diff afterwards (ADR-0023).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    env:
      DB_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Atlas Community Edition (pinned in scripts/install-atlas.sh)
        run: make atlas
      - name: Start PostgreSQL
        if: matrix.dialect == 'postgres'
        run: make db-up
      - name: Apply the schema to an empty database and check for drift
        run: make db-check
